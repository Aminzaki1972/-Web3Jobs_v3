<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Web3Jobs - Manage Companies</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4.4"></script>

    <style>

        :root {
            --bg:#06101d;
            --panel:#0b1a2b;
            --panel2:#0e2135;
            --border:#1d3852;
            --text:#f5f9ff;
            --muted:#8fa5bb;
            --green:#4ade80;
            --blue:#60a5fa;
            --red:#f87171;
        }

        * {
            box-sizing:border-box;
        }

        body {
            margin:0;
            min-height:100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(38,102,160,.18),
                    transparent 35%
                ),
                var(--bg);
            color:var(--text);
            font-family:Arial,Helvetica,sans-serif;
        }

        .page {
            width:min(1400px,100%);
            margin:auto;
            padding:20px;
        }

        .header {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin-bottom:20px;
            padding:18px;
            border:1px solid var(--border);
            border-radius:16px;
            background:var(--panel);
        }

        .title {
            display:flex;
            align-items:center;
            gap:12px;
        }

        .logo {
            width:45px;
            height:45px;
            display:grid;
            place-items:center;
            border-radius:12px;
            background:linear-gradient(135deg,#1c765a,#175a47);
            font-weight:900;
        }

        h1 {
            margin:0;
            font-size:20px;
        }

        .subtitle {
            margin-top:4px;
            color:var(--muted);
            font-size:11px;
        }

        button {
            font:inherit;
        }

        .back,
        .refresh {
            min-height:42px;
            padding:0 15px;
            border:1px solid var(--border);
            border-radius:9px;
            background:var(--panel2);
            color:white;
            cursor:pointer;
            font-weight:700;
        }

        .back:hover,
        .refresh:hover {
            background:#12283e;
        }

        .toolbar {
            display:flex;
            gap:10px;
            margin-bottom:18px;
        }

        .search {
            flex:1;
            min-height:44px;
            padding:0 14px;
            border:1px solid var(--border);
            border-radius:10px;
            outline:none;
            background:var(--panel);
            color:white;
        }

        .search:focus {
            border-color:var(--blue);
        }

        .card {
            border:1px solid var(--border);
            border-radius:16px;
            overflow:hidden;
            background:var(--panel);
        }

        .table-wrap {
            width:100%;
            overflow-x:auto;
        }

        table {
            width:100%;
            min-width:850px;
            border-collapse:collapse;
        }

        th {
            padding:14px;
            text-align:left;
            color:var(--muted);
            font-size:10px;
            text-transform:uppercase;
            background:var(--panel2);
        }

        td {
            padding:14px;
            border-top:1px solid rgba(255,255,255,.06);
            font-size:12px;
        }

        tr:hover td {
            background:rgba(255,255,255,.025);
        }

        .company-name {
            font-weight:800;
        }

        .wallet {
            max-width:150px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .delete {
            padding:7px 10px;
            border:1px solid rgba(248,113,113,.3);
            border-radius:7px;
            background:rgba(248,113,113,.06);
            color:var(--red);
            cursor:pointer;
            font-size:10px;
            font-weight:800;
        }

        .empty {
            padding:40px 20px;
            text-align:center;
            color:var(--muted);
        }

        .message {
            display:none;
            margin-bottom:18px;
            padding:14px;
            border-radius:10px;
            font-size:12px;
        }

        .error {
            display:block;
            border:1px solid rgba(248,113,113,.3);
            background:rgba(248,113,113,.06);
            color:#fecaca;
        }

        #loading {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--muted);
        }

        #app {
            display:none;
        }

        @media(max-width:600px) {

            .page {
                padding:12px;
            }

            .header {
                align-items:flex-start;
                flex-direction:column;
            }

            .toolbar {
                flex-direction:column;
            }

        }

    </style>

</head>

<body>


<div id="loading">
    Checking administrator access...
</div>


<main id="app">

    <div class="page">

        <header class="header">

            <div class="title">

                <div class="logo">
                    W3
                </div>

                <div>

                    <h1>
                        Manage Companies
                    </h1>

                    <div class="subtitle">
                        Web3Jobs Administrator
                    </div>

                </div>

            </div>


            <button
                type="button"
                class="back"
                id="back-button"
            >
                ← Admin Dashboard
            </button>

        </header>


        <div
            id="message"
            class="message"
        ></div>


        <div class="toolbar">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search companies..."
            >

            <button
                type="button"
                id="refresh"
                class="refresh"
            >
                Refresh
            </button>

        </div>


        <section class="card">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>Company</th>

                            <th>Industry</th>

                            <th>Location</th>

                            <th>Website</th>

                            <th>Wallet</th>

                            <th>Created</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="companies-body">

                        <tr>

                            <td
                                colspan="7"
                                class="empty"
                            >
                                Loading companies...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>


<!-- =====================================================
     IMPORTANT:
     This file MUST load the same Supabase client
     used by the rest of Web3Jobs.
===================================================== -->

<script src="js/supabase.js?v=20260812"></script>


<script>

"use strict";

(() => {

    let supabase = null;
    let currentUser = null;
    let companies = [];


    /* =====================================================
       GET THE EXISTING WEB3JOBS CLIENT
    ===================================================== */

    function getClient() {

        if (
            window.Web3JobsSupabase &&
            typeof
            window.Web3JobsSupabase.getClient ===
            "function"
        ) {

            const client =
                window.Web3JobsSupabase.getClient();

            if (client) {
                return client;
            }
        }


        if (
            window.supabaseClient &&
            typeof
            window.supabaseClient.from ===
            "function"
        ) {

            return window.supabaseClient;
        }


        throw new Error(
            "Supabase client is not initialized."
        );
    }


    /* =====================================================
       VERIFY LOGIN
    ===================================================== */

    async function verifyAdmin() {

        supabase =
            getClient();


        /*
         * IMPORTANT:
         * We use the existing Web3Jobs session.
         */

        const {
            data,
            error
        } =
            await supabase.auth.getUser();


        if (error) {

            console.error(
                "Authentication error:",
                error
            );

            throw new Error(
                "Authentication failed."
            );
        }


        currentUser =
            data?.user || null;


        if (!currentUser) {

            throw new Error(
                "Authentication session is missing."
            );
        }


        console.log(
            "Authenticated user:",
            currentUser.id
        );


        /* =================================================
           VERIFY ADMIN FROM PROFILES
        ================================================= */

        const {
            data: profile,
            error: profileError
        } =
            await supabase
                .from("profiles")
                .select(
                    "id,role"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if (profileError) {

            throw new Error(
                "Unable to verify administrator account: " +
                profileError.message
            );
        }


        const role =
            String(
                profile?.role || ""
            )
            .trim()
            .toLowerCase();


        console.log(
            "Admin role:",
            role
        );


        if (role !== "admin") {

            throw new Error(
                "Administrator privileges are required."
            );
        }


        return true;
    }


    /* =====================================================
       LOAD COMPANIES
    ===================================================== */

    async function loadCompanies() {

        const body =
            document.getElementById(
                "companies-body"
            );


        body.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty"
                >
                    Loading companies...
                </td>
            </tr>
        `;


        const {
            data,
            error
        } =
            await supabase
                .from("company_profiles")
                .select(
                    `
                    id,
                    user_id,
                    company_name,
                    website,
                    industry,
                    location,
                    wallet_address,
                    created_at
                    `
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if (error) {

            console.error(
                "Company query error:",
                error
            );

            throw new Error(
                error.message
            );
        }


        companies =
            data || [];


        renderCompanies(
            companies
        );
    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderCompanies(
        list
    ) {

        const body =
            document.getElementById(
                "companies-body"
            );


        if (!list.length) {

            body.innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        class="empty"
                    >
                        No companies found.
                    </td>
                </tr>
            `;

            return;
        }


        body.innerHTML =
            list.map(
                company => {

                    const name =
                        escapeHtml(
                            company.company_name ||
                            "Unnamed Company"
                        );


                    const industry =
                        escapeHtml(
                            company.industry ||
                            "—"
                        );


                    const location =
                        escapeHtml(
                            company.location ||
                            "—"
                        );


                    const wallet =
                        escapeHtml(
                            company.wallet_address ||
                            "—"
                        );


                    const created =
                        company.created_at
                            ? new Date(
                                company.created_at
                            ).toLocaleDateString()
                            : "—";


                    return `
                        <tr>

                            <td>
                                <div class="company-name">
                                    ${name}
                                </div>
                            </td>

                            <td>
                                ${industry}
                            </td>

                            <td>
                                ${location}
                            </td>

                            <td>

                                ${
                                    company.website
                                        ? `
                                            <a
                                                href="${escapeAttribute(company.website)}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                style="color:#60a5fa"
                                            >
                                                Visit
                                            </a>
                                        `
                                        : "—"
                                }

                            </td>

                            <td>

                                <div class="wallet">
                                    ${wallet}
                                </div>

                            </td>

                            <td>
                                ${created}
                            </td>

                            <td>

                                <button
                                    type="button"
                                    class="delete"
                                    data-id="${escapeAttribute(company.id)}"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>
                    `;

                }
            )
            .join("");


        document
            .querySelectorAll(".delete")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteCompany(
                                button.dataset.id
                            );

                        }
                    );

                }
            );
    }


    /* =====================================================
       DELETE COMPANY
    ===================================================== */

    async function deleteCompany(
        id
    ) {

        const company =
            companies.find(
                item =>
                    item.id === id
            );


        if (!company) {
            return;
        }


        const name =
            company.company_name ||
            "this company";


        if (
            !window.confirm(
                `Delete ${name}?\n\nThis action cannot be undone.`
            )
        ) {

            return;
        }


        const {
            error
        } =
            await supabase
                .from("company_profiles")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (error) {

            showError(
                error.message
            );

            return;
        }


        await loadCompanies();
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function setupSearch() {

        const input =
            document.getElementById(
                "search"
            );


        input.addEventListener(
            "input",
            () => {

                const query =
                    input.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    renderCompanies(
                        companies
                    );

                    return;
                }


                const filtered =
                    companies.filter(
                        company => {

                            return [

                                company.company_name,

                                company.industry,

                                company.location,

                                company.website,

                                company.wallet_address

                            ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase()
                            .includes(query);

                        }
                    );


                renderCompanies(
                    filtered
                );
            }
        );
    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );
    }


    function showError(
        message
    ) {

        const box =
            document.getElementById(
                "message"
            );


        box.textContent =
            "Error: " +
            message;


        box.className =
            "message error";


        box.style.display =
            "block";
    }


    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

        try {

            await verifyAdmin();


            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "app"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "back-button"
                )
                .addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "admin-dashboard.html";

                    }
                );


            document
                .getElementById(
                    "refresh"
                )
                .addEventListener(
                    "click",
                    async () => {

                        try {

                            await loadCompanies();

                        } catch (error) {

                            showError(
                                error.message
                            );

                        }

                    }
                );


            setupSearch();


            await loadCompanies();


        } catch (error) {

            console.error(
                "Admin Companies Error:",
                error
            );


            const loading =
                document.getElementById(
                    "loading"
                );


            loading.innerHTML = `
                <div style="
                    max-width:500px;
                    padding:30px;
                    text-align:center;
                ">

                    <strong style="
                        display:block;
                        margin-bottom:12px;
                        color:#f87171;
                    ">
                        Unable to load companies
                    </strong>

                    <span style="
                        color:#8fa5bb;
                        font-size:12px;
                    ">
                        ${escapeHtml(error.message)}
                    </span>

                    <br><br>

                    <button
                        onclick="window.location.href='admin-dashboard.html'"
                        style="
                            padding:10px 16px;
                            border:1px solid #1d3852;
                            border-radius:8px;
                            background:#0e2135;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        Back to Admin Dashboard
                    </button>

                </div>
            `;
        }
    }


    /* =====================================================
       START
    ===================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    } else {

        init();

    }

})();

</script>

</body>

                </html>
