<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Web3Jobs - Manage Companies</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --bg: #06101d;
            --panel: #0b1a2b;
            --panel2: #0e2135;
            --border: #1d3852;
            --text: #f5f9ff;
            --muted: #8fa5bb;
            --green: #4ade80;
            --blue: #60a5fa;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(38,102,160,.18),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button {
            font: inherit;
        }

        .page {
            width: min(1400px, 100%);
            margin: auto;
            padding: 20px;
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 20px;
            padding: 18px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--panel);
        }

        .title h1 {
            margin: 0;
            font-size: 22px;
        }

        .title p {
            margin: 6px 0 0;

            color: var(--muted);
            font-size: 12px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button {
            min-height: 40px;

            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--panel2);
            color: white;

            cursor: pointer;

            font-size: 11px;
            font-weight: 800;
        }

        .button:hover {
            background: #15304a;
        }

        .button.green {
            border-color: rgba(74,222,128,.3);
            color: var(--green);
        }

        /* STAT */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

            margin-bottom: 20px;
        }

        .stat {
            padding: 18px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: var(--panel);
        }

        .stat-label {
            color: var(--muted);

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 8px;

            font-size: 28px;
            font-weight: 900;
        }

        /* CARD */

        .card {
            padding: 18px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--panel);
        }

        .card-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 17px;
        }

        .search {
            width: 260px;
            max-width: 100%;

            padding: 11px 13px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            background: #071423;
            color: white;
        }

        .search:focus {
            border-color: var(--blue);
        }

        /* TABLE */

        .table-wrapper {
            width: 100%;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 700px;
        }

        th {
            padding: 12px 10px;

            color: var(--muted);

            border-bottom:
                1px solid
                var(--border);

            font-size: 10px;
            text-align: left;

            text-transform: uppercase;
        }

        td {
            padding: 13px 10px;

            border-bottom:
                1px solid
                rgba(255,255,255,.05);

            font-size: 12px;
        }

        tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .company-name {
            font-weight: 800;
        }

        .email {
            color: var(--muted);
            word-break: break-all;
        }

        .date {
            color: var(--muted);
        }

        .badge {
            display: inline-block;

            padding: 5px 8px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 800;
        }

        .badge.active {
            color: var(--green);

            background:
                rgba(74,222,128,.08);
        }

        .view-button {
            padding: 7px 10px;

            border: 1px solid var(--border);
            border-radius: 7px;

            background: #0e2135;
            color: white;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;
        }

        .view-button:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        /* EMPTY */

        .empty {
            padding: 35px 15px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
        }

        /* LOADING */

        #loading {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--bg);
        }

        .loading-box {
            text-align: center;
        }

        .loading-box strong {
            display: block;

            margin-bottom: 8px;

            font-size: 18px;
        }

        .loading-box span {
            color: var(--muted);
            font-size: 12px;
        }

        /* NOTICE */

        .notice {
            display: none;

            margin-bottom: 15px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 11px;
        }

        .notice.error {
            display: block;

            color: #fecaca;

            border:
                1px solid
                rgba(248,113,113,.3);

            background:
                rgba(248,113,113,.06);
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .page {
                padding: 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .card-header {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div class="loading-box">

        <strong>
            Web3Jobs Admin
        </strong>

        <span>
            Checking administrator access...
        </span>

    </div>

</div>


<main id="content" style="display:none;">

    <div class="page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="title">

                <h1>
                    Manage Companies
                </h1>

                <p>
                    View and manage registered company accounts.
                </p>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="button"
                    id="back-button"
                >
                    ← Admin Dashboard
                </button>

                <button
                    type="button"
                    class="button green"
                    id="refresh-button"
                >
                    Refresh
                </button>

                <button
                    type="button"
                    class="button"
                    id="logout-button"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- =================================================
             NOTICE
        ================================================== -->

        <div
            id="notice"
            class="notice"
        ></div>


        <!-- =================================================
             STATS
        ================================================== -->

        <section class="stats">


            <div class="stat">

                <div class="stat-label">
                    Total Companies
                </div>

                <div
                    class="stat-value"
                    id="total-companies"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Loaded
                </div>

                <div
                    class="stat-value"
                    id="loaded-companies"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Admin Access
                </div>

                <div class="stat-value">
                    ✓
                </div>

            </div>


        </section>


        <!-- =================================================
             COMPANIES
        ================================================== -->

        <section class="card">


            <div class="card-header">

                <h2>
                    Registered Companies
                </h2>


                <input
                    type="search"
                    id="search"
                    class="search"
                    placeholder="Search company or email..."
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Company
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Account ID
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="companies-body">

                    </tbody>

                </table>

            </div>


            <div
                id="empty"
                class="empty"
                style="display:none;"
            >
                No companies found.
            </div>


        </section>


    </div>

</main>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="js/supabase.js?v=20260812"></script>


<script>

"use strict";

(() => {

    let client = null;

    let currentUser = null;

    let companies = [];


    /* =====================================================
       SUPABASE
    ===================================================== */

    function getSupabase() {

        if (client) {
            return client;
        }


        if (
            window.Web3JobsSupabase &&
            typeof
            window.Web3JobsSupabase.getClient ===
            "function"
        ) {

            client =
                window.Web3JobsSupabase.getClient();

            return client;
        }


        if (
            window.supabaseClient &&
            typeof
            window.supabaseClient.from ===
            "function"
        ) {

            client =
                window.supabaseClient;

            return client;
        }


        throw new Error(
            "Supabase client is not initialized."
        );
    }


    /* =====================================================
       NOTICE
    ===================================================== */

    function showError(message) {

        const notice =
            document.getElementById("notice");

        if (!notice) {
            return;
        }

        notice.textContent =
            message;

        notice.className =
            "notice error";

    }


    /* =====================================================
       ADMIN VERIFICATION
    ===================================================== */

    async function verifyAdmin() {

        const supabase =
            getSupabase();


        const {
            data,
            error
        } =
            await supabase.auth.getUser();


        if (error) {
            throw error;
        }


        currentUser =
            data?.user || null;


        if (!currentUser) {

            window.location.replace(
                "login.html"
            );

            return false;
        }


        const {
            data: profile,
            error: profileError
        } =
            await supabase
                .from("profiles")
                .select(
                    "id,email,role,account_type"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if (profileError) {
            throw profileError;
        }


        const role =
            String(
                profile?.role || ""
            )
                .trim()
                .toLowerCase();


        if (role !== "admin") {

            showError(
                "Access denied. Administrator privileges are required."
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                1200
            );


            return false;
        }


        return true;

    }


    /* =====================================================
       LOAD COMPANIES
    ===================================================== */

    async function loadCompanies() {

        const supabase =
            getSupabase();


        const body =
            document.getElementById(
                "companies-body"
            );


        body.innerHTML = "";


        /*
         * We use company_profiles first.
         */

        const {
            data,
            error
        } =
            await supabase
                .from("company_profiles")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Company loading error:",
                error
            );

            throw error;
        }


        companies =
            Array.isArray(data)
                ? data
                : [];


        document
            .getElementById(
                "total-companies"
            )
            .textContent =
            companies.length;


        renderCompanies(
            companies
        );

    }


    /* =====================================================
       GET COMPANY NAME
    ===================================================== */

    function getCompanyName(company) {

        return (
            company.company_name ||
            company.name ||
            company.company ||
            company.title ||
            "Unnamed Company"
        );

    }


    /* =====================================================
       GET EMAIL
    ===================================================== */

    function getCompanyEmail(company) {

        return (
            company.email ||
            company.contact_email ||
            "—"
        );

    }


    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(value) {

        if (!value) {
            return "—";
        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(value);

        }


        return date.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderCompanies(
        list
    ) {

        const body =
            document.getElementById(
                "companies-body"
            );

        const empty =
            document.getElementById(
                "empty"
            );


        body.innerHTML = "";


        if (!list.length) {

            empty.style.display =
                "block";

            document
                .getElementById(
                    "loaded-companies"
                )
                .textContent =
                "0";

            return;
        }


        empty.style.display =
            "none";


        list.forEach(
            company => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const name =
                    getCompanyName(
                        company
                    );


                const email =
                    getCompanyEmail(
                        company
                    );


                const userId =
                    company.user_id ||
                    company.id ||
                    "—";


                const created =
                    formatDate(
                        company.created_at
                    );


                row.innerHTML = `

                    <td>
                        <div class="company-name">
                            ${escapeHtml(name)}
                        </div>
                    </td>

                    <td>
                        <div class="email">
                            ${escapeHtml(email)}
                        </div>
                    </td>

                    <td>
                        ${escapeHtml(
                            shortId(userId)
                        )}
                    </td>

                    <td>
                        <span class="date">
                            ${escapeHtml(created)}
                        </span>
                    </td>

                    <td>
                        <span class="badge active">
                            Active
                        </span>
                    </td>

                `;


                body.appendChild(
                    row
                );

            }
        );


        document
            .getElementById(
                "loaded-companies"
            )
            .textContent =
            list.length;

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function setupSearch() {

        const search =
            document.getElementById(
                "search"
            );


        search.addEventListener(
            "input",
            function () {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    renderCompanies(
                        companies
                    );

                    return;
                }


                const filtered =
                    companies.filter(
                        company => {

                            const name =
                                getCompanyName(
                                    company
                                )
                                    .toLowerCase();


                            const email =
                                getCompanyEmail(
                                    company
                                )
                                    .toLowerCase();


                            return (
                                name.includes(
                                    query
                                ) ||
                                email.includes(
                                    query
                                )
                            );

                        }
                    );


                renderCompanies(
                    filtered
                );

            }
        );

    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function shortId(id) {

        const value =
            String(id || "");


        if (value.length <= 12) {
            return value;
        }


        return (
            value.substring(0, 8) +
            "••••"
        );

    }


    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    function setupButtons() {

        document
            .getElementById(
                "back-button"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "admin-dashboard.html";

                }
            );


        document
            .getElementById(
                "refresh-button"
            )
            .addEventListener(
                "click",
                async function () {

                    this.disabled =
                        true;

                    this.textContent =
                        "Loading...";


                    try {

                        await loadCompanies();

                    } catch (error) {

                        console.error(
                            error
                        );

                        showError(
                            "Unable to load companies: " +
                            (
                                error?.message ||
                                "Unknown error"
                            )
                        );

                    }


                    this.disabled =
                        false;

                    this.textContent =
                        "Refresh";

                }
            );


        document
            .getElementById(
                "logout-button"
            )
            .addEventListener(
                "click",
                async function () {

                    this.disabled =
                        true;

                    this.textContent =
                        "Logging out...";


                    try {

                        await getSupabase()
                            .auth
                            .signOut();

                    } catch (error) {

                        console.error(
                            "Logout error:",
                            error
                        );

                    }


                    window.location.replace(
                        "login.html"
                    );

                }
            );

    }


    /* =====================================================
       SHOW
    ===================================================== */

    function showPage() {

        const loading =
            document.getElementById(
                "loading"
            );

        const content =
            document.getElementById(
                "content"
            );


        loading.style.display =
            "none";

        content.style.display =
            "block";

    }


    /* =====================================================
       INIT
    ===================================================== */

    async function init() {

        try {

            const allowed =
                await verifyAdmin();


            if (!allowed) {
                return;
            }


            setupButtons();

            setupSearch();

            await loadCompanies();

            showPage();


            console.log(
                "Web3Jobs: Admin Companies loaded."
            );


        } catch (error) {

            console.error(
                "Admin Companies Error:",
                error
            );


            const loading =
                document.getElementById(
                    "loading"
                );


            loading.innerHTML = `

                <div class="loading-box">

                    <strong>
                        Unable to Load Companies
                    </strong>

                    <span>
                        ${escapeHtml(
                            error?.message ||
                            "Unknown error"
                        )}
                    </span>

                    <br><br>

                    <button
                        class="button"
                        onclick="location.href='admin-dashboard.html'"
                    >
                        ← Back to Admin
                    </button>

                </div>

            `;

        }

    }


    /* =====================================================
       START
    ===================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    } else {

        init();

    }

})();

</script>


</body>

    </html>
