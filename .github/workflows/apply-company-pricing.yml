name: Apply company subscription pricing

on:
  push:
    paths:
      - '.github/workflows/apply-company-pricing.yml'

permissions:
  contents: write

jobs:
  apply-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply subscription plan configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('js/company-dashboard.js')
          text = js.read_text(encoding='utf-8')

          pattern = r'const PLANS = \{.*?\n\s*\};'
          replacement = '''const PLANS = {

          free: {
              code: "free",
              name: "Free",
              price: 0,
              limit: 1,
              durationDays: 30
          },

          starter: {
              code: "starter",
              name: "Starter",
              price: 19,
              limit: 1,
              durationDays: 30
          },

          professional: {
              code: "professional",
              name: "Professional",
              price: 49,
              limit: 5,
              durationDays: 30
          },

          enterprise: {
              code: "enterprise",
              name: "Enterprise",
              price: 99,
              limit: 20,
              durationDays: 30
          }

      };'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('PLANS block not found exactly once')
          js.write_text(new_text, encoding='utf-8')

          html = Path('company-dashboard.html')
          h = html.read_text(encoding='utf-8')

          # Keep the dashboard UI backed by the database-driven subscription module.
          if 'js/company-subscription-v2.js' not in h:
              h = h.replace('</body>', '    <script src="js/company-subscription-v2.js" defer></script>\n    <script src="js/company-subscription-ui.js" defer></script>\n</body>')
          elif 'js/company-subscription-ui.js' not in h:
              h = h.replace('</body>', '    <script src="js/company-subscription-ui.js" defer></script>\n</body>')

          html.write_text(h, encoding='utf-8')
          PY

      - name: Verify pricing
        run: |
          grep -n -A32 'const PLANS' js/company-dashboard.js
          grep -n 'company-subscription' company-dashboard.html

      - name: Commit changes
        run: |
          git config user.name "web3jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/company-dashboard.js company-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Update company subscription plans to 19 49 99"
          git push
