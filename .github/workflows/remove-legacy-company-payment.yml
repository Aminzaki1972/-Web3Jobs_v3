name: Remove legacy company payment path

on:
  push:
    branches: [main]
    paths:
      - 'company-jobs.html'
      - '.github/workflows/remove-legacy-company-payment.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy inline payment implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('company-jobs.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n\s*<!-- =====================================================\n\s*WALLET PAYMENT SYSTEM\n\s*===================================================== -->\n\s*<script>.*?</script>\n'
          cleaned, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if n:
              p.write_text(cleaned, encoding='utf-8')
              print('Legacy company payment block removed.')
          else:
              print('No legacy company payment block found.')
          PY
      - name: Commit and push cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-jobs.html
          if git diff --cached --quiet; then
            echo 'No cleanup required.'
          else
            git commit -m 'Remove legacy inline company subscription payment'
            git push
          fi
