name: Clean company JavaScript architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Consolidate company subscription modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -f js/company-dashboard.js ] && [ ! -f js/company-dashboard-core.js ]; then
            git mv js/company-dashboard.js js/company-dashboard-core.js
          fi
          cat > js/company-dashboard.js <<'EOF'
          /* Web3Jobs Company Dashboard entry point */
          "use strict";
          (() => {
            const modules = [
              "js/company-dashboard-core.js?v=20260828-1",
              "js/company-subscription-canonical.js?v=20260828-3"
            ];
            const load = src => new Promise((resolve, reject) => {
              const key = src.split("?")[0];
              if (document.querySelector(`script[data-wj-module="${key}"]`)) return resolve();
              const s = document.createElement("script");
              s.src = src;
              s.async = false;
              s.dataset.wjModule = key;
              s.onload = resolve;
              s.onerror = () => reject(new Error(`Failed to load ${src}`));
              (document.head || document.documentElement).appendChild(s);
            });
            async function init() {
              for (const src of modules) await load(src);
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, {once:true});
            else init();
          })();
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/company-dashboard.js js/company-dashboard-core.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean company JavaScript architecture'
          git push
