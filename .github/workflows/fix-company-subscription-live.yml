name: Fix company subscription live flow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subscription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install canonical subscription controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('company-dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          tag = '<script src="js/company-subscription-canonical.js?v=20260828-1"></script>'
          # Remove all previous subscription bootstrap/hotfix script tags from the live page.
          lines = s.splitlines()
          lines = [x for x in lines if 'company-subscription-' not in x]
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          if tag not in s:
              s = s.replace(marker, '    ' + tag + '\n' + marker, 1) if marker in s else s + '\n' + tag + '\n'
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install canonical company subscription controller'
          git push
