name: Normalize subscription pricing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-subscriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize dashboard legacy price
        shell: python
        run: |
          from pathlib import Path
          p = Path('company-dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = '$49 USDT / month'
          new = '$45 USDT / month'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print('Replaced legacy $49 subscription price in company-dashboard.html')
          else:
              print('No legacy $49 subscription price found in company-dashboard.html')

      - name: Verify subscription pricing references
        shell: bash
        run: |
          set -e
          echo 'Scanning subscription/payment source files for legacy price labels...'
          files=$(find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.md' \) \
            -not -path './.git/*' -not -path './node_modules/*')
          if grep -nE '\$10[[:space:]]*USDT|\$25[[:space:]]*USDT|\$49[[:space:]]*USDT|\$50[[:space:]]*USDT|49 USDT|25 USDT|50 USDT|10 USDT' $files; then
            echo 'Legacy subscription price reference detected.'
            exit 1
          fi
          echo 'No legacy subscription price labels found.'

      - name: Commit normalized dashboard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-dashboard.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: remove legacy subscription price from dashboard'
            git push
          fi
