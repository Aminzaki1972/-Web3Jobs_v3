name: Install Google AdSense

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AdSense verification script on public pages
        shell: python
        run: |
          from pathlib import Path

          publisher = "ca-pub-8596907100362110"
          script = f'<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={publisher}" crossorigin="anonymous"></script>'

          targets = [Path("index.html"), Path("jobs.html")]
          changed = []

          for path in targets:
              if not path.exists():
                  print(f"Skipping missing {path}")
                  continue

              text = path.read_text(encoding="utf-8")
              if publisher in text:
                  print(f"Already installed: {path}")
                  continue

              marker = "</head>"
              if marker not in text.lower():
                  raise SystemExit(f"Missing </head> in {path}")

              # Preserve the existing page byte-for-byte except for one insertion.
              idx = text.lower().find(marker)
              text = text[:idx] + "\n" + script + "\n" + text[idx:]
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("Updated:", ", ".join(changed) if changed else "none")

      - name: Commit AdSense changes
        shell: bash
        run: |
          if git diff --quiet -- index.html jobs.html; then
            echo "No page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jobs.html
          git commit -m "chore: add Google AdSense to public pages [skip ci]"
          git push