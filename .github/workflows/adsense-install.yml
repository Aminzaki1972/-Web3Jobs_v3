name: Install Google AdSense

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AdSense on public pages
        shell: python
        run: |
          from pathlib import Path

          publisher = "ca-pub-8596907100362110"
          script = f'''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={publisher}" crossorigin="anonymous"></script>'''

          files = [Path("index.html"), Path("jobs.html")]
          changed = []

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              if publisher in text:
                  continue
              marker = "</head>"
              if marker not in text:
                  raise SystemExit(f"Missing </head> in {path}")
              text = text.replace(marker, "\n" + script + "\n" + marker, 1)
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          if changed:
              print("Updated:", ", ".join(changed))
          else:
              print("AdSense already installed on all target pages.")

      - name: Commit AdSense changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jobs.html
          git commit -m "chore: add Google AdSense to public pages [skip ci]"
          git push
