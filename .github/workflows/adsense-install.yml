name: Install Google AdSense

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-adsense:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AdSense verification script on public content pages
        shell: python
        run: |
          from pathlib import Path

          publisher = "ca-pub-8596907100362110"
          script = f'<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={publisher}" crossorigin="anonymous"></script>'

          targets = [
              Path("index.html"),
              Path("jobs.html"),
              Path("companies.html"),
              Path("about.html"),
              Path("contact.html"),
              Path("privacy.html"),
              Path("terms.html"),
              Path("cookies.html"),
              Path("disclaimer.html"),
              Path("web3-career-guide.html"),
              Path("roadmap.html"),
          ]

          changed = []
          for path in targets:
              if not path.exists():
                  print(f"Skipping missing {path}")
                  continue

              text = path.read_text(encoding="utf-8")
              if publisher in text:
                  print(f"Already installed: {path}")
                  continue

              marker = "</head>"
              lower = text.lower()
              idx = lower.find(marker)
              if idx == -1:
                  raise SystemExit(f"Missing </head> in {path}")

              text = text[:idx] + "\n" + script + "\n" + text[idx:]
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          print("Updated:", ", ".join(changed) if changed else "none")

      - name: Commit AdSense changes
        shell: bash
        run: |
          files=(index.html jobs.html companies.html about.html contact.html privacy.html terms.html cookies.html disclaimer.html web3-career-guide.html roadmap.html)
          if git diff --quiet -- "${files[@]}"; then
            echo "No page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore: install AdSense on public content pages [skip ci]"
          git push
