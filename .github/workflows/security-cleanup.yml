name: Security Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove flagged Telegram IoC and pin Supabase CDN
        shell: bash
        run: |
          set -e
          changed=0

          if grep -RIl --exclude-dir=.git 'https://t.me/web3jop' . | grep -q .; then
            grep -RIl --exclude-dir=.git 'https://t.me/web3jop' . | while read -r f; do
              sed -i '/https:\/\/t\.me\/web3jop/d' "$f"
            done
            changed=1
          fi

          files=$(grep -RIl --exclude-dir=.git 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' . || true)
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              sed -i 's#cdn.jsdelivr.net/npm/@supabase/supabase-js@2#cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4#g' "$f"
              changed=1
            done <<< "$files"
          fi

          if [ "$changed" -eq 1 ] && ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'security: remove Telegram IoC and pin Supabase CDN'
            git push
          else
            echo 'No cleanup changes required.'
          fi
