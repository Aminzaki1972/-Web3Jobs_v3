name: Restore company dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore known-good dashboard
        run: |
          git checkout 79dd7e7f76ebc2be334f1dcd459a05bc20467fd3 -- company-dashboard.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-dashboard.html
          git commit -m 'Restore company dashboard layout'
          git push
