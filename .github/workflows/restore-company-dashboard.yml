name: Restore company dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message == 'Restore company dashboard from 79dd7e7' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dashboard file
        run: |
          git checkout 79dd7e7f76ebc2be334f1dcd459a05bc20467fd3 -- company-dashboard.html
          git rm .github/workflows/restore-company-dashboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-dashboard.html
          git commit -m 'Restore company dashboard from known-good version'
          git push
