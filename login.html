<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Web3Jobs</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo h1 {
            margin: 0;
            color: #111827;
            font-size: 30px;
        }

        .auth-logo p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-title h2 {
            margin: 0;
            color: #111827;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-links {
            text-align: center;
            margin-top: 22px;
            line-height: 1.8;
        }

        .auth-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            margin-top: 10px;
            color: #6b7280 !important;
            font-weight: normal !important;
        }

        #auth-message {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            margin: auto;
            max-width: 400px;
            z-index: 999999;
            display: none;
        }

    </style>

</head>


<body>


<div class="auth-container">

    <div class="auth-card">


        <!-- LOGO -->

        <div class="auth-logo">

            <h1>
                Web3Jobs
            </h1>

            <p>
                Global Web3 & Blockchain Jobs Platform
            </p>

        </div>


        <!-- TITLE -->

        <div class="auth-title">

            <h2>
                Login
            </h2>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="login-form"
            novalidate
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="login-email">
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
                id="login-button"
            >
                Login
            </button>


        </form>


        <!-- LINKS -->

        <div class="auth-links">

            <div>
                Don't have an account?
                <a href="signup.html">
                    Create Account
                </a>
            </div>

            <a
                href="index.html"
                class="home-link"
            >
                ← Back to Web3Jobs
            </a>

        </div>


    </div>

</div>


<!-- =====================================================
     SUPABASE
     IMPORTANT:
     Supabase library MUST load first.
     ===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     WEB3JOBS SUPABASE CONFIG
     ===================================================== -->

<script
    src="js/supabase.js"
></script>


<!-- =====================================================
     WEB3JOBS AUTHENTICATION
     ===================================================== -->

<script
    src="js/auth.js"
></script>


<!-- =====================================================
     LOGIN BUTTON STATE
     ===================================================== -->

<script>

"use strict";

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "login-form"
            );

        const button =
            document.getElementById(
                "login-button"
            );


        if (!form || !button) {
            return;
        }


        form.addEventListener(
            "submit",
            function () {

                button.disabled = true;

                button.textContent =
                    "Signing in...";


                setTimeout(
                    function () {

                        button.disabled =
                            false;

                        button.textContent =
                            "Login";

                    },
                    3000
                );

            }
        );

    }
);

</script>


</body>

</html>
