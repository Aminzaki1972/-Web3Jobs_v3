<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="Web3Jobs - Login to your Web3Jobs account."
>

<title>Login - Web3Jobs</title>

<style>

:root {
    --bg: #06101d;
    --bg2: #09182a;
    --card: #0d1b2e;
    --text: #f5f8ff;
    --muted: #9db0c8;
    --line: #1d3553;
    --accent: #6ee7b7;
    --blue: #60a5fa;
    --github: #ffffff;
    --danger: #fb7185;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at top,
            rgba(96, 165, 250, 0.14),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );

    color: var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font: inherit;
}

.login-wrapper {
    width: 100%;
    max-width: 440px;
}

.brand {

    display: flex;
    flex-direction: column;
    align-items: center;

    margin-bottom: 24px;

    text-align: center;
}

.brand-logo {

    width: 92px;
    height: 92px;

    object-fit: cover;

    border-radius: 20px;

    margin-bottom: 14px;

    border:
        1px solid
        var(--line);

    box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.35);
}

.brand-name {

    color: white;

    font-size: 25px;

    font-weight: 850;
}

.brand-name span {
    color: var(--accent);
}

.login-card {

    padding: 32px;

    background:
        rgba(13, 27, 46, 0.97);

    border:
        1px solid
        var(--line);

    border-radius: 20px;

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.38);
}

.login-card h1 {

    margin: 0 0 8px;

    text-align: center;

    font-size: 28px;
}

.subtitle {

    margin: 0 0 25px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

#auth-message {

    display: none;

    margin-bottom: 18px;

    border-radius: 10px;

    font-size: 12px;

    line-height: 1.7;
}

.auth-message-box {

    padding: 12px 14px;

    border-radius: 9px;
}

.auth-message-error {

    border:
        1px solid
        rgba(251, 113, 133, 0.35);

    background:
        rgba(251, 113, 133, 0.08);

    color: #fda4af;
}

.auth-message-success {

    border:
        1px solid
        rgba(110, 231, 183, 0.35);

    background:
        rgba(110, 231, 183, 0.08);

    color: var(--accent);
}

.auth-message-info {

    border:
        1px solid
        rgba(96, 165, 250, 0.35);

    background:
        rgba(96, 165, 250, 0.08);

    color: #93c5fd;
}


/* =====================================================
   LOGIN METHODS
===================================================== */

.login-methods {

    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-bottom: 22px;
}

.method-button {

    width: 100%;

    min-height: 48px;

    padding: 12px 15px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 800;

    transition:
        transform .2s,
        opacity .2s,
        border-color .2s;
}

.method-button:hover {

    transform:
        translateY(-1px);

    opacity: .94;
}

.method-button:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;
}


/* WALLET */

.wallet-button {

    border:
        1px solid
        rgba(110, 231, 183, .45);

    background:
        linear-gradient(
            135deg,
            rgba(110, 231, 183, .18),
            rgba(96, 165, 250, .14)
        );

    color: #dffdf1;
}

.wallet-icon {

    margin-right: 8px;

    font-size: 17px;

    vertical-align: -1px;
}


/* GITHUB */

.github-button {

    border:
        1px solid
        rgba(255, 255, 255, .22);

    background:
        #111827;

    color:
        var(--github);
}

.github-icon {

    margin-right: 8px;

    font-size: 17px;

    vertical-align: -1px;
}


/* EMAIL */

.email-method {

    border:
        1px solid
        rgba(96, 165, 250, .25);

    background:
        rgba(96, 165, 250, .08);

    color:
        #bfdbfe;
}

.email-icon {

    margin-right: 8px;

    font-size: 17px;

    vertical-align: -1px;
}


/* =====================================================
   DIVIDER
===================================================== */

.method-divider {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 20px 0;

    color: #71869e;

    font-size: 10px;
}

.method-divider::before,
.method-divider::after {

    content: "";

    flex: 1;

    height: 1px;

    background:
        var(--line);
}


/* =====================================================
   EMAIL FORM
===================================================== */

#emailLoginSection {

    display: none;

    margin-top: 5px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;
}

.form-group input {

    padding: 13px 14px;

    border:
        1px solid
        #284563;

    border-radius: 10px;

    outline: none;

    background: #071423;

    color: white;

    font-size: 14px;

        border-color .2s,

}

.form-group input:focus {

}

.form-group input::placeholder {
    color: #60758d;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 50px;
}

.toggle-password {

    position: absolute;

    top: 50%;
    right: 10px;

    transform:
        translateY(-50%);

    border: 0;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 16px;

    width: auto;

    padding: 5px;
}

.login-button {

    width: 100%;

    margin-top: 5px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background:
        var(--accent);

    color: var(--bg);

    font-size: 14px;

    font-weight: 850;

    cursor: pointer;

    transition:
        transform .2s,
        opacity .2s;
}

.login-button:hover {

    transform:
        translateY(-1px);

    opacity: .92;
}

.login-button:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;
}

.forgot {

}

.forgot:hover {
    color: var(--accent);
}


/* =====================================================
   SIGNUP
===================================================== */

.signup {

/* =====================================================

.social-links a:hover {

    border-color:

        var(--accent);
}

.back-home {

    margin-top: 20px;

    text-align: center;

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

        padding: 25px 20px;
    }

    .brand-logo {
        width: 76px;
        height: 76px;
    }

    .brand-name {
        font-size: 22px;
    }

}

</style>

<script src="js/supabase.js?v=20260814"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const togglePassword =
    document.getElementById("togglePassword");

const messageElement =
    document.getElementById("auth-message");

const walletLoginButton =
    document.getElementById("walletLoginButton");

const githubLoginButton =
    document.getElementById("githubLoginButton");

const emailMethodButton =
    document.getElementById("emailMethodButton");

const emailLoginSection =
    document.getElementById("emailLoginSection");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    arabic,
    english,
    type = "info"
) {

    if (!messageElement) {
        return;
    }

    messageElement.innerHTML = "";

    const box =
        document.createElement("div");

    box.className =
        "auth-message-box auth-message-" +
        type;


    const ar =
        document.createElement("div");

    ar.textContent =
        arabic;


    const en =
        document.createElement("div");

    en.textContent =
        english;


    box.appendChild(ar);

    box.appendChild(en);

    messageElement.appendChild(box);

    messageElement.style.display =
        "block";
}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage() {

    if (!messageElement) {
        return;
    }

    messageElement.style.display =
        "none";

    messageElement.innerHTML = "";
}


/* =====================================================
   GET SUPABASE CLIENT
===================================================== */

function getSupabaseClient() {

    let client = null;


    if (
        window.Web3JobsSupabase &&
        typeof
        window.Web3JobsSupabase.getClient ===
        "function"
    ) {

        client =
            window.Web3JobsSupabase.getClient();

    } else if (
        window.supabaseClient
    ) {

        client =
            window.supabaseClient;

    }


    if (
        !client ||
        !client.auth
    ) {

        throw new Error(
            "Supabase client is not available."
        );

    }


    return client;

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

if (togglePassword) {

    togglePassword.addEventListener(
        "click",
        function() {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                togglePassword.textContent =
                    "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type =
                    "password";

                togglePassword.textContent =
                    "👁";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );

}


/* =====================================================
   EMAIL METHOD
===================================================== */

emailMethodButton.addEventListener(
    "click",
    function() {

        hideMessage();

        emailLoginSection.style.display =
            "block";

        emailInput.focus();

    }
);


/* =====================================================
   GITHUB LOGIN
===================================================== */

githubLoginButton.addEventListener(
    "click",
    async function() {

        hideMessage();

        githubLoginButton.disabled =
            true;

        walletLoginButton.disabled =
            true;

        emailMethodButton.disabled =
            true;

        githubLoginButton.textContent =
            "Connecting to GitHub...";


        try {

            const client =
                getSupabaseClient();


            /*
             * We intentionally use the current
             * login page as the OAuth redirect.
             *
             * Supabase must have this URL in:
             *
             * Authentication
             * → URL Configuration
             * → Redirect URLs
             */

            const redirectUrl =
                window.location.origin +
                window.location.pathname;


            const {
                error
            } =
                await client.auth.signInWithOAuth({

                    provider:
                        "github",

                    options: {

                        redirectTo:
                            redirectUrl

                    }

                });


            if (error) {
                throw error;
            }


        } catch (error) {

            console.error(
                "GitHub Login Error:",
                error
            );


            showMessage(
                "تعذر تسجيل الدخول باستخدام GitHub: " +
                (
                    error.message ||
                    "خطأ غير معروف"
                ),

                "GitHub login failed: " +
                (
                    error.message ||
                    "Unknown error"
                ),

                "error"
            );


            githubLoginButton.disabled =
                false;

            walletLoginButton.disabled =
                false;

            emailMethodButton.disabled =
                false;

            githubLoginButton.innerHTML =
                '<span class="github-icon">🐙</span> Login with GitHub';

        }

    }
);


/* =====================================================
   WALLET LOGIN
===================================================== */

walletLoginButton.addEventListener(
    "click",
    async function() {

        hideMessage();

        walletLoginButton.disabled =
            true;

        githubLoginButton.disabled =
            true;

        emailMethodButton.disabled =
            true;

        walletLoginButton.textContent =
            "Connecting Wallet...";


        try {

            const client =
                getSupabaseClient();


            /* ---------------------------------------------
               CHECK WALLET
            --------------------------------------------- */

            if (
                !window.ethereum
            ) {

                throw new Error(
                    "No Ethereum wallet was detected. Please open Web3Jobs inside MetaMask or another compatible wallet."
                );

            }


            /* ---------------------------------------------
               SUPABASE WEB3 LOGIN
            --------------------------------------------- */

            const {
                data,
                error
            } =
                await client.auth.signInWithWeb3({

                    chain:
                        "ethereum",

                    statement:
                        "Sign in to Web3Jobs with your Web3 wallet."

                });


            if (error) {
                throw error;
            }


            const user =
                data &&
                data.user
                    ? data.user
                    : null;


            const session =
                data &&
                data.session
                    ? data.session
                    : null;


            if (
                !user ||
                !session
            ) {

                throw new Error(
                    "Wallet authentication did not create a session."
                );

            }


            /* ---------------------------------------------
               SAVE WALLET LOGIN
            --------------------------------------------- */

            let walletAddress = "";


            try {

                const accounts =
                    await window.ethereum.request({

                        method:
                            "eth_accounts"

                    });


                if (
                    accounts &&
                    accounts.length
                ) {

                    walletAddress =
                        accounts[0];

                }

            } catch (walletError) {

                console.warn(
                    "Could not read wallet address:",
                    walletError
                );

            }


            try {

                localStorage.setItem(
                    "web3jobs_auth_method",
                    "wallet"
                );

                localStorage.setItem(
                    "web3jobs_user_id",
                    user.id
                );


                if (walletAddress) {

                    localStorage.setItem(
                        "web3jobs_wallet_address",
                        walletAddress
                    );

                }

            } catch (storageError) {

                console.warn(
                    "Wallet localStorage error:",
                    storageError
                );

            }


            showMessage(
                "تم تسجيل الدخول بالمحفظة بنجاح. جاري فتح لوحة التحكم...",
                "Wallet login successful. Opening dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                "Wallet Login Error:",
                error
            );


            const errorText =
                String(
                    error &&
                    error.message
                        ? error.message
                        : error
                );


            const lower =
                errorText.toLowerCase();


            if (
                lower.includes(
                    "user rejected"
                ) ||
                lower.includes(
                    "user denied"
                ) ||
                lower.includes(
                    "rejected"
                )
            ) {

                showMessage(
                    "تم إلغاء طلب تسجيل الدخول من المحفظة.",
                    "Wallet login was cancelled.",
                    "error"
                );

            } else {

                showMessage(
                    "تعذر تسجيل الدخول بالمحفظة: " +
                    errorText,

                    "Wallet login failed: " +
                    errorText,

                    "error"
                );

            }


            walletLoginButton.disabled =
                false;

            githubLoginButton.disabled =
                false;

            emailMethodButton.disabled =
                false;

            walletLoginButton.innerHTML =
                '<span class="wallet-icon">🔐</span> Login with Wallet';

        }

    }
);


/* =====================================================
   GET ACCOUNT TYPE
===================================================== */

async function getAccountType(
    client,
    user
) {

    let accountType = "";


    /* -------------------------------------------------
       PROFILE TABLE
    ------------------------------------------------- */

    try {

        const {
            data: profile,
            error
        } =
            await client
                .from("profiles")
                .select(
                    "account_type,role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (
            !error &&
            profile
        ) {

            const role =
                String(
                    profile.role || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                role === "admin"
            ) {

                return "admin";

            }


            accountType =
                String(
                    profile.account_type || ""
                )
                    .trim()
                    .toLowerCase();

        }

    } catch (error) {

        console.warn(
            "Profile lookup skipped:",
            error
        );

    }


    /* -------------------------------------------------
       USER METADATA
    ------------------------------------------------- */

    if (!accountType) {

        const metadata =
            user.user_metadata || {};


        accountType =
            String(
                metadata.account_type ||
                metadata.accountType ||
                metadata.role ||
                ""
            )
                .trim()
                .toLowerCase();

    }


    /* -------------------------------------------------
       PENDING ACCOUNT TYPE
    ------------------------------------------------- */

    if (!accountType) {

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_pending_account_type"
                ) || "";

            accountType =
                accountType
                    .trim()
                    .toLowerCase();

        } catch (error) {

            console.warn(
                "Pending account type unavailable:",
                error
            );

        }

    }


    /* -------------------------------------------------
       LOCAL ACCOUNT TYPE
    ------------------------------------------------- */

    if (!accountType) {

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_account_type"
                ) || "";

            accountType =
                accountType
                    .trim()
                    .toLowerCase();

        } catch (error) {

            console.warn(
                "Local account type unavailable:",
                error
            );

        }

    }


    /* -------------------------------------------------
       COMPANY PROFILE FALLBACK
    ------------------------------------------------- */

    if (!accountType) {

        try {

            const {
                data: companyProfile,
                error
            } =
                await client
                    .from("company_profiles")
                    .select("id")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (
                !error &&
                companyProfile
            ) {

                accountType =
                    "company";

            }

        } catch (error) {

            console.warn(
                "Company profile lookup skipped:",
                error
            );

        }

    }


    /* -------------------------------------------------
       NORMALIZE COMPANY
    ------------------------------------------------- */

    if (
        accountType === "business" ||
        accountType === "employer" ||
        accountType === "organization" ||
        accountType === "organizations" ||
        accountType === "companies"
    ) {

        accountType =
            "company";

    }


    /* -------------------------------------------------
       NORMALIZE INDIVIDUAL
    ------------------------------------------------- */

    if (
        accountType === "person" ||
        accountType === "user" ||
        accountType === "candidate" ||
        accountType === "freelancer" ||
        accountType === "individuals"
    ) {

        accountType =
            "individual";

    }


    return accountType;

}


/* =====================================================
   SAVE LOGIN DATA
===================================================== */

function saveLoginData(
    accountType,
    userId
) {

    try {

        localStorage.setItem(
            "web3jobs_account_type",
            accountType
        );

        localStorage.setItem(
            "web3jobs_user_id",
            userId
        );

        localStorage.removeItem(
            "web3jobs_pending_account_type"
        );

    } catch (error) {

        console.warn(
            "localStorage error:",
            error
        );

    }

}


/* =====================================================
   REDIRECT
===================================================== */

function redirectUser(
    accountType
) {

    if (
        accountType ===
        "admin"
    ) {

        window.location.replace(
            "admin-dashboard.html"
        );

        return;

    }


    if (
        accountType ===
        "company"
    ) {

        window.location.replace(
            "company-dashboard.html"
        );

        return;

    }


    window.location.replace(
        "dashboard.html"
    );

}
