<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Web3Jobs."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Login | Web3Jobs</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #102d4a 0%,
                    #06101d 45%,
                    #030912 100%
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .login-container {

            width: 100%;
            max-width: 430px;
        }


        .logo {

            text-align: center;

            margin-bottom: 24px;
        }


        .logo a {

            color: #ffffff;

            text-decoration: none;

            font-size: 30px;

            font-weight: 800;
        }


        .logo span {

            color: #3b9cff;
        }


        .login-card {

            background:
                rgba(8, 22, 38, 0.97);

            border:
                1px solid
                rgba(80, 150, 220, 0.18);

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.45);
        }


        .login-header {

            text-align: center;

            margin-bottom: 28px;
        }


        .login-header h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }


        .login-header p {

            color: #91a5ba;

            font-size: 14px;
        }


        /* =========================
           STATUS
        ========================== */

        .status-message {

            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.5;
        }


        .status-message.error {

            display: block;

            color: #ff8c8c;

            background:
                rgba(220, 60, 60, 0.10);

            border:
                1px solid
                rgba(220, 60, 60, 0.25);
        }


        .status-message.success {

            display: block;

            color: #78e0a4;

            background:
                rgba(40, 180, 100, 0.10);

            border:
                1px solid
                rgba(40, 180, 100, 0.25);
        }


        .status-message.info {

            display: block;

            color: #8fc7ff;

            background:
                rgba(59, 156, 255, 0.10);

            border:
                1px solid
                rgba(59, 156, 255, 0.25);
        }


        /* =========================
           WALLET LOGIN
        ========================== */

        .wallet-section {

            margin-bottom: 26px;
        }


        .wallet-button {

            width: 100%;

            min-height: 54px;

            border:
                1px solid #31516d;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #102b45,
                    #0a1b2d
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .wallet-button:hover {

            border-color: #3b9cff;

            background:
                linear-gradient(
                    135deg,
                    #153a5d,
                    #0c2238
                );

            box-shadow:
                0 10px 25px
                rgba(59, 156, 255, 0.12);
        }


        .wallet-button:active {

            transform:
                translateY(1px);
        }


        .wallet-icon {

            width: 24px;

            height: 24px;

            border-radius: 6px;

            background:
                linear-gradient(
                    135deg,
                    #f6851b,
                    #e2761b
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 13px;

            font-weight: 900;

            color: #ffffff;
        }


        /* =========================
           DIVIDER
        ========================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin:
                4px 0 24px;

            color: #60778d;

            font-size: 12px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                #20384f;
        }


        /* =========================
           EMAIL LOGIN
        ========================== */

        .email-title {

            font-size: 14px;

            font-weight: 700;

            color: #dce9f5;

            margin-bottom: 16px;
        }


        .field {

            margin-bottom: 18px;
        }


        .field label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #dce9f5;
        }


        .field input {

            width: 100%;

            height: 48px;

            border:
                1px solid #20384f;

            border-radius: 10px;

            background: #071727;

            color: #ffffff;

            padding:
                0 14px;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .field input:focus {

            border-color: #3b9cff;

            box-shadow:
                0 0 0 3px
                rgba(59, 156, 255, 0.10);
        }


        .field input::placeholder {

            color: #60778d;
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {

            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #248cff,
                    #1769c7
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 2px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .login-button:hover {

            box-shadow:
                0 10px 25px
                rgba(36, 140, 255, 0.25);
        }


        .login-button:active {

            transform:
                translateY(1px);
        }


        .login-button:disabled,
        .wallet-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =========================
           FORGOT PASSWORD
        ========================== */

        .forgot-password {

            text-align: center;

            margin-top: 20px;
        }


        .forgot-password a {

            color: #4da3ff;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }


        .forgot-password a:hover {

            text-decoration: underline;
        }


        /* =========================
           REGISTER
        ========================== */

        .register-link {

            text-align: center;

            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid #20384f;

            color: #71869a;

            font-size: 13px;
        }


        .register-link a {

            color: #4da3ff;

            font-weight: 600;

            text-decoration: none;
        }


        .register-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            body {

                padding: 14px;
            }


            .login-card {

                padding:
                    25px 18px;
            }


            .login-header h1 {

                font-size: 24px;
            }


            .logo a {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <main class="login-container">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                Web3<span>Jobs</span>

            </a>

        </div>


        <!-- LOGIN CARD -->

        <section class="login-card">


            <!-- HEADER -->

            <div class="login-header">

                <h1>
                    Login
                </h1>

                <p>
                    Login to your Web3Jobs account
                </p>

            </div>


            <!-- STATUS -->

            <div
                id="loginStatus"
                class="status-message"
                aria-live="polite"
            ></div>


            <!-- WALLET -->

            <div class="wallet-section">

                <button
                    type="button"
                    id="walletLoginButton"
                    class="wallet-button"
                >

                    <span
                        class="wallet-icon"
                        aria-hidden="true"
                    >
                        W
                    </span>

                    <span>
                        Login with Web3 Wallet
                    </span>

                </button>

            </div>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    OR
                </span>

            </div>


            <!-- EMAIL -->

            <div class="email-title">

                Login with Email

            </div>


            <form
                id="loginForm"
                autocomplete="on"
                novalidate
            >


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <a href="reset-password.html">

                    Forgot your password?

                </a>

            </div>


            <!-- REGISTER -->

            <div class="register-link">

                Don't have an account?

                <a href="register.html">

                    Create an account

                </a>

            </div>


        </section>


    </main>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4.112.4"
    ></script>


    <!-- =====================================================
         WEB3JOBS SUPABASE CLIENT
    ====================================================== -->

    <script src="js/supabase.js"></script>


    <!-- =====================================================
         WEB3JOBS AUTH
    ====================================================== -->

    <script src="js/auth.js"></script>


    <!-- =====================================================
         LOGIN CONTROLLER
    ====================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const loginForm =
                    document.getElementById(
                        "loginForm"
                    );


                const emailInput =
                    document.getElementById(
                        "email"
                    );


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );


                const loginStatus =
                    document.getElementById(
                        "loginStatus"
                    );


                const walletButton =
                    document.getElementById(
                        "walletLoginButton"
                    );


                /* =================================================
                   STATUS
                ================================================= */

                function showStatus(
                    message,
                    type
                ) {

                    if (!loginStatus) {
                        return;
                    }


                    loginStatus.textContent =
                        message;


                    loginStatus.className =
                        "status-message " +
                        (
                            type ||
                            "info"
                        );


                    loginStatus.style.display =
                        "block";
                }


                /* =================================================
                   CLEAR STATUS
                ================================================= */

                function clearStatus() {

                    if (!loginStatus) {
                        return;
                    }


                    loginStatus.textContent =
                        "";


                    loginStatus.className =
                        "status-message";


                    loginStatus.style.display =
                        "none";
                }


                /* =================================================
                   ACCOUNT TYPE
                ================================================= */

                async function detectAccountType(
                    user
                ) {

                    if (
                        !user ||
                        !user.id
                    ) {

                        return null;
                    }


                    /*
                     * IMPORTANT:
                     *
                     * We ONLY use profiles.
                     *
                     * company_profiles is NOT used.
                     */

                    const client =
                        window.Web3JobsSupabase &&
                        typeof window.Web3JobsSupabase.getClient ===
                            "function"
                            ? window.Web3JobsSupabase.getClient()
                            : window.supabaseClient;


                    if (!client) {

                        return null;
                    }


                    try {

                        const result =
                            await client
                                .from("profiles")
                                .select("*")
                                .eq(
                                    "id",
                                    user.id
                                )
                                .maybeSingle();


                        if (
                            !result.error &&
                            result.data
                        ) {

                            const profile =
                                result.data;


                            const values = [

                                profile.role,

                                profile.account_type,

                                profile.accountType,

                                profile.user_type,

                                profile.userType,

                                profile.type

                            ];


                            for (
                                const value
                                of values
                            ) {

                                if (
                                    value ===
                                    null ||
                                    value ===
                                    undefined
                                ) {

                                    continue;
                                }


                                const type =
                                    String(
                                        value
                                    )
                                        .trim()
                                        .toLowerCase();


                                if (
                                    [
                                        "admin",
                                        "administrator",
                                        "superadmin",
                                        "super_admin"
                                    ].includes(type)
                                ) {

                                    return "admin";
                                }


                                if (
                                    [
                                        "company",
                                        "companies",
                                        "business",
                                        "employer",
                                        "organization"
                                    ].includes(type)
                                ) {

                                    return "company";
                                }


                                if (
                                    [
                                        "individual",
                                        "person",
                                        "user",
                                        "candidate",
                                        "freelancer"
                                    ].includes(type)
                                ) {

                                    return "individual";
                                }

                            }

                        }

                    } catch (error) {

                        console.warn(
                            "Web3Jobs profile detection:",
                            error
                        );

                    }


                    /*
                     * Also try user_metadata.
                     */

                    const metadata =
                        user.user_metadata ||
                        {};


                    const metadataValues = [

                        metadata.role,

                        metadata.account_type,

                        metadata.accountType,

                        metadata.user_type,

                        metadata.userType,

                        metadata.type

                    ];


                    for (
                        const value
                        of metadataValues
                    ) {

                        if (
                            value ===
                            null ||
                            value ===
                            undefined
                        ) {

                            continue;
                        }


                        const type =
                            String(
                                value
                            )
                                .trim()
                                .toLowerCase();


                        if (
                            [
                                "admin",
                                "administrator",
                                "superadmin",
                                "super_admin"
                            ].includes(type)
                        ) {

                            return "admin";
                        }


                        if (
                            [
                                "company",
                                "business",
                                "employer",
                                "organization"
                            ].includes(type)
                        ) {

                            return "company";
                        }


                        if (
                            [
                                "individual",
                                "person",
                                "user",
                                "candidate",
                                "freelancer"
                            ].includes(type)
                        ) {

                            return "individual";
                        }

                    }


                    return null;
                }


                /* =================================================
                   DASHBOARD
                ================================================= */

                function getDashboard(
                    accountType
                ) {

                    const type =
                        String(
                            accountType ||
                            ""
                        )
                            .trim()
                            .toLowerCase();


                    if (
                        type ===
                        "admin"
                    ) {

                        return "admin-dashboard.html";
                    }


                    if (
                        type ===
                        "company"
                    ) {

                        return "company-dashboard.html";
                    }


                    if (
                        type ===
                        "individual"
                    ) {

                        return "dashboard.html";
                    }


                    /*
                     * Fallback.
                     *
                     * This prevents the login page from
                     * being reloaded.
                     */

                    return "dashboard.html";
                }


                /* =================================================
                   LOGIN
                ================================================= */

                if (!loginForm) {

                    console.error(
                        "Web3Jobs: loginForm not found."
                    );

                    return;
                }


                loginForm.addEventListener(
                    "submit",
                    async function (event) {


                        /*
                         * VERY IMPORTANT
                         *
                         * Stop normal browser form submit.
                         *
                         * This is what prevents:
                         *
                         * email/password
                         * disappearing
                         * after pressing Login.
                         */

                        event.preventDefault();

                        event.stopPropagation();


                        clearStatus();


                        const email =
                            emailInput
                                ? emailInput.value
                                    .trim()
                                    .toLowerCase()
                                : "";


                        const password =
                            passwordInput
                                ? passwordInput.value
                                : "";


                        if (
                            !email ||
                            !password
                        ) {

                            showStatus(
                                "Please enter your email and password.",
                                "error"
                            );

                            return;
                        }


                        if (loginButton) {

                            loginButton.disabled =
                                true;

                            loginButton.textContent =
                                "Signing in...";
                        }


                        showStatus(
                            "Signing in...",
                            "info"
                        );


                        try {


                            /* =========================================
                               GET SAME SUPABASE CLIENT
                            ========================================== */

                            let client =
                                null;


                            if (
                                window.Web3JobsSupabase &&
                                typeof window.Web3JobsSupabase.getClient ===
                                    "function"
                            ) {

                                client =
                                    window.Web3JobsSupabase.getClient();

                            } else if (
                                window.supabaseClient
                            ) {

                                client =
                                    window.supabaseClient;
                            }


                            if (
                                !client ||
                                !client.auth
                            ) {

                                throw new Error(
                                    "Supabase client is unavailable."
                                );
                            }


                            console.log(
                                "Web3Jobs: Starting Supabase login..."
                            );


                            /* =========================================
                               REAL SUPABASE LOGIN
                            ========================================== */

                            const result =
                                await client.auth
                                    .signInWithPassword({

                                        email:
                                            email,

                                        password:
                                            password

                                    });


                            console.log(
                                "Web3Jobs: Supabase login response:",
                                result
                            );


                            /* =========================================
                               LOGIN ERROR
                            ========================================== */

                            if (
                                result.error
                            ) {

                                const error =
                                    result.error;


                                const message =
                                    String(
                                        error.message ||
                                        ""
                                    );


                                const lower =
                                    message.toLowerCase();


                                if (
                                    lower.includes(
                                        "invalid login credentials"
                                    )
                                ) {

                                    showStatus(
                                        "Invalid email or password.",
                                        "error"
                                    );

                                } else if (
                                    lower.includes(
                                        "email not confirmed"
                                    )
                                ) {

                                    showStatus(
                                        "Your email is not confirmed. Please confirm your email first.",
                                        "error"
                                    );

                                } else if (
                                    lower.includes(
                                        "too many"
                                    ) ||
                                    lower.includes(
                                        "rate limit"
                                    )
                                ) {

                                    showStatus(
                                        "Too many login attempts. Please wait and try again.",
                                        "error"
                                    );

                                } else if (
                                    lower.includes(
                                        "failed to fetch"
                                    ) ||
                                    lower.includes(
                                        "network"
                                    )
                                ) {

                                    showStatus(
                                        "Could not connect to Supabase.",
                                        "error"
                                    );

                                } else {

                                    showStatus(
                                        "Login failed: " +
                                        message,
                                        "error"
                                    );

                                }


                                if (loginButton) {

                                    loginButton.disabled =
                                        false;

                                    loginButton.textContent =
                                        "Login";
                                }


                                return;
                            }


                            /* =========================================
                               VERIFY SESSION
                            ========================================== */

                            const session =
                                result.data &&
                                result.data.session
                                    ? result.data.session
                                    : null;


                            const user =
                                result.data &&
                                result.data.user
                                    ? result.data.user
                                    : null;


                            if (
                                !session ||
                                !user
                            ) {

                                showStatus(
                                    "Login completed but no active session was created.",
                                    "error"
                                );


                                if (loginButton) {

                                    loginButton.disabled =
                                        false;

                                    loginButton.textContent =
                                        "Login";
                                }


                                return;
                            }


                            console.log(
                                "Web3Jobs: User authenticated:",
                                user.id
                            );


                            /* =========================================
                               SAVE USER ID
                            ========================================== */

                            try {

                                localStorage.setItem(
                                    "web3jobs_user_id",
                                    user.id
                                );

                            } catch (storageError) {

                                console.warn(
                                    "Web3Jobs localStorage error:",
                                    storageError
                                );
                            }


                            /* =========================================
                               ACCOUNT TYPE
                            ========================================== */

                            let accountType =
                                await detectAccountType(
                                    user
                                );


                            /*
                             * If the profile does not contain
                             * a recognized role, use metadata.
                             */

                            if (!accountType) {

                                const metadata =
                                    user.user_metadata ||
                                    {};


                                const metadataRole =
                                    metadata.role ||
                                    metadata.account_type ||
                                    metadata.accountType;


                                if (
                                    metadataRole
                                ) {

                                    const normalized =
                                        String(
                                            metadataRole
                                        )
                                            .trim()
                                            .toLowerCase();


                                    if (
                                        [
                                            "admin",
                                            "administrator",
                                            "superadmin",
                                            "super_admin"
                                        ].includes(
                                            normalized
                                        )
                                    ) {

                                        accountType =
                                            "admin";

                                    } else if (
                                        [
                                            "company",
                                            "business",
                                            "employer",
                                            "organization"
                                        ].includes(
                                            normalized
                                        )
                                    ) {

                                        accountType =
                                            "company";

                                    } else if (
                                        [
                                            "individual",
                                            "person",
                                            "user",
                                            "candidate",
                                            "freelancer"
                                        ].includes(
                                            normalized
                                        )
                                    ) {

                                        accountType =
                                            "individual";
                                    }

                                }

                            }


                            console.log(
                                "Web3Jobs: Account type:",
                                accountType
                            );


                            /* =========================================
                               SAVE ACCOUNT TYPE
                            ========================================== */

                            if (
                                accountType
                            ) {

                                try {

                                    localStorage.setItem(
                                        "web3jobs_account_type",
                                        accountType
                                    );

                                } catch (storageError) {

                                    console.warn(
                                        "Web3Jobs account type storage:",
                                        storageError
                                    );
                                }

                            }


                            /* =========================================
                               SUCCESS
                            ========================================== */

                            showStatus(
                                "Login successful. Redirecting...",
                                "success"
                            );


                            if (loginButton) {

                                loginButton.disabled =
                                    true;

                                loginButton.textContent =
                                    "Logged in";
                            }


                            /*
                             * Wait briefly so Supabase has time
                             * to persist the session.
                             */

                            setTimeout(
                                function () {

                                    window.location.replace(
                                        getDashboard(
                                            accountType
                                        )
                                    );

                                },
                                500
                            );


                        } catch (error) {


                            console.error(
                                "Web3Jobs login exception:",
                                error
                            );


                            const message =
                                String(
                                    error?.message ||
                                    error ||
                                    "Login failed."
                                );


                            showStatus(
                                message,
                                "error"
                            );


                            if (loginButton) {

                                loginButton.disabled =
                                    false;

                                loginButton.textContent =
                                    "Login";
                            }

                        }

                    }
                );


                /* =================================================
