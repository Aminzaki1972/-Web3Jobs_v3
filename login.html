<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Web3Jobs - Login to your Web3Jobs account."
>

<title>Login - Web3Jobs</title>

<style>

:root {
    --bg: #06101d;
    --bg2: #09182a;
    --card: #0d1b2e;
    --text: #f5f8ff;
    --muted: #9db0c8;
    --line: #1d3553;
    --accent: #6ee7b7;
    --blue: #60a5fa;
    --danger: #fb7185;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            rgba(96,165,250,.14),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );

    color: var(--text);

    font-family:
        Arial,
        system-ui,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
    text-decoration: none;
}

.login-wrapper {
    width: 100%;
    max-width: 440px;
}

.brand {
    text-align: center;
    margin-bottom: 22px;
}

.brand-logo {
    width: 82px;
    height: 82px;
    object-fit: cover;
    border-radius: 18px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
}

.brand-name {
    color: white;
    font-size: 26px;
    font-weight: 800;
}

.brand-name span {
    color: var(--accent);
}

.login-card {
    padding: 30px;
    background: rgba(13,27,46,.98);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow:
        0 25px 70px
        rgba(0,0,0,.38);
}

.login-card h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 28px;
}

.subtitle {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

#auth-message {
    display: none;
    margin-bottom: 18px;
    border-radius: 9px;
    font-size: 12px;
    line-height: 1.7;
}

.auth-message-box {
    padding: 12px 14px;
    border-radius: 9px;
}

.auth-message-error {
    border: 1px solid rgba(251,113,133,.35);
    background: rgba(251,113,133,.08);
    color: #fda4af;
}

.auth-message-success {
    border: 1px solid rgba(110,231,183,.35);
    background: rgba(110,231,183,.08);
    color: var(--accent);
}

.auth-message-info {
    border: 1px solid rgba(96,165,250,.35);
    background: rgba(96,165,250,.08);
    color: #93c5fd;
}

.login-methods {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.method-button {
    width: 100%;
    min-height: 50px;
    padding: 13px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    border: 1px solid transparent;
}

.method-button:active {
    transform: scale(.99);
}

.method-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.wallet-button {
    border-color: rgba(110,231,183,.45);

    background:
        linear-gradient(
            135deg,
            rgba(110,231,183,.18),
            rgba(96,165,250,.14)
        );

    color: #dffdf1;
}

.email-method {
    border-color: rgba(96,165,250,.25);
    background: rgba(96,165,250,.08);
    color: #bfdbfe;
}

.method-icon {
    margin-right: 8px;
    font-size: 17px;
}

.method-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    color: #71869e;
    font-size: 10px;
}

.method-divider::before,
.method-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
}

#emailLoginSection {
    display: none;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #dbe7f4;
    font-size: 13px;
    font-weight: 700;
}

.form-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #284563;
    border-radius: 9px;
    outline: none;
    background: #071423;
    color: white;
    font-size: 14px;
}

.form-group input:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 3px
        rgba(96,165,250,.08);
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: auto;
    padding: 5px;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
}

.login-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: var(--bg);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.login-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.forgot {
    display: block;
    margin-top: 15px;
    text-align: center;
    color: #8dbdf3;
    font-size: 12px;
}

.signup {
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
    font-size: 12px;
}

.signup a {
    color: var(--accent);
    font-weight: 800;
}

.back-home {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #8da1b8;
    font-size: 11px;
}

@media (max-width:500px) {

    body {
        padding: 12px;
    }

    .login-card {
        padding: 24px 18px;
    }

}

</style>

</head>


<body>

<div class="login-wrapper">

    <div class="brand">

        <img
            class="brand-logo"
            src="IMG_20260809_214500_497.jpg"
            alt="Web3Jobs Logo"
        >

        <div class="brand-name">
            Web3<span>Jobs</span>
        </div>

    </div>


    <div class="login-card">

        <h1>Login</h1>

        <p class="subtitle">
            Choose how you want to login to Web3Jobs
        </p>


        <div
            id="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <div class="login-methods">

            <!-- WALLET -->

            <button
                type="button"
                id="walletLoginButton"
                class="method-button wallet-button"
            >

                <span class="method-icon">
                    🔐
                </span>

                Login with Wallet

            </button>


            <!-- EMAIL -->

            <button
                type="button"
                id="emailMethodButton"
                class="method-button email-method"
            >

                <span class="method-icon">
                    📧
                </span>

                Login with Email

            </button>

        </div>


        <!-- EMAIL LOGIN -->

        <div id="emailLoginSection">

            <div class="method-divider">
                EMAIL LOGIN
            </div>


            <form
                id="loginForm"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <a
                href="forgot-password.html"
                class="forgot"
            >
                Forgot your password?
            </a>

        </div>


        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Web3Jobs
    </a>

</div>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="js/supabase.js?v=20260814"
></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const togglePassword =
    document.getElementById("togglePassword");

const messageElement =
    document.getElementById("auth-message");

const walletButton =
    document.getElementById("walletLoginButton");

const emailButton =
    document.getElementById("emailMethodButton");

const emailSection =
    document.getElementById("emailLoginSection");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    arabic,
    english,
    type
) {

    messageElement.innerHTML = "";

    const box =
        document.createElement("div");

    box.className =
        "auth-message-box auth-message-" +
        (type || "info");


    const ar =
        document.createElement("div");

    ar.textContent =
        arabic;


    const en =
        document.createElement("div");

    en.textContent =
        english;


    box.appendChild(ar);
    box.appendChild(en);

    messageElement.appendChild(box);

    messageElement.style.display =
        "block";

}


function hideMessage() {

    messageElement.style.display =
        "none";

    messageElement.innerHTML = "";

}


/* =====================================================
   SUPABASE
===================================================== */

function getClient() {

    if (
        window.Web3JobsSupabase &&
        typeof
        window.Web3JobsSupabase.getClient ===
        "function"
    ) {

        const client =
            window.Web3JobsSupabase.getClient();

        if (client) {

            return client;

        }

    }


    if (
        window.supabaseClient &&
        window.supabaseClient.auth
    ) {

        return window.supabaseClient;

    }


    throw new Error(
        "Supabase client is not available."
    );

}


/* =====================================================
   RESET
===================================================== */

function resetButtons() {

    walletButton.disabled =
        false;

    emailButton.disabled =
        false;


    walletButton.innerHTML =
        '<span class="method-icon">🔐</span> Login with Wallet';


    emailButton.innerHTML =
        '<span class="method-icon">📧</span> Login with Email';

}


/* =====================================================
   PASSWORD
===================================================== */

togglePassword.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁";

        }

    }
);


/* =====================================================
   EMAIL METHOD
===================================================== */

emailButton.addEventListener(
    "click",
    function() {

        hideMessage();

        emailSection.style.display =
            "block";

        emailInput.focus();

    }
);


/* =====================================================
   NORMALIZE ACCOUNT TYPE
===================================================== */

function normalizeAccountType(
    value
) {

    const type =
        String(value || "")
            .trim()
            .toLowerCase();


    if (
        type === "business" ||
        type === "employer" ||
        type === "organization" ||
        type === "organizations"
    ) {

        return "company";

    }


    if (
        type === "person" ||
        type === "candidate" ||
        type === "freelancer" ||
        type === "individuals"
    ) {

        return "individual";

    }


    if (
        type === "company" ||
        type === "individual" ||
        type === "admin"
    ) {

        return type;

    }


    return "";

}


/* =====================================================
   GET ACCOUNT TYPE
===================================================== */

async function getAccountType(
    client,
    user
) {

    if (
        !client ||
        !user ||
        !user.id
    ) {

        return "";

    }


    /*
     * First check profiles.
     */

    try {

        const result =
            await client
                .from("profiles")
                .select(
                    "account_type,role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (
            !result.error &&
            result.data
        ) {

            const role =
                String(
                    result.data.role || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                role === "admin"
            ) {

                return "admin";

            }


            const profileType =
                normalizeAccountType(
                    result.data.account_type
                );


            if (profileType) {

                return profileType;

            }


            const roleType =
                normalizeAccountType(
                    result.data.role
                );


            if (roleType) {

                return roleType;

            }

        }

    } catch (error) {

        console.warn(
            "Profile lookup error:",
            error
        );

    }


    /*
     * Check authenticated user metadata.
     */

    const metadataType =
        normalizeAccountType(

            user.user_metadata?.account_type ||
            user.user_metadata?.accountType ||
            user.user_metadata?.role

        );


    if (metadataType) {

        return metadataType;

    }


    return "";

}


/* =====================================================
   REDIRECT USER
===================================================== */

function redirectUser(
    accountType
) {

    const type =
        normalizeAccountType(
            accountType
        );


    if (
        type === "admin"
    ) {

        window.location.replace(
            "admin-dashboard.html"
        );

        return true;

    }


    if (
        type === "company"
    ) {

        window.location.replace(
            "company-dashboard.html"
        );

        return true;

    }


    if (
        type === "individual"
    ) {

        window.location.replace(
            "dashboard.html"
        );

        return true;

    }


    return false;

}


/* =====================================================
   FINALIZE LOGIN
===================================================== */

async function finalizeLogin(
    client,
    user,
    methodName
) {

    if (
        !client ||
        !user
    ) {

        throw new Error(
            "Authenticated user was not found."
        );

    }


    const accountType =
        await getAccountType(
            client,
            user
        );


    /*
     * No profile = not registered.
     */

    if (!accountType) {

        try {

            await client.auth.signOut();

        } catch (signOutError) {

            console.warn(
                "Sign out error:",
                signOutError
            );

        }


        try {

            localStorage.removeItem(
                "web3jobs_account_type"
            );

            localStorage.removeItem(
                "web3jobs_user_id"
            );

            localStorage.removeItem(
                "web3jobs_auth_method"
            );

        } catch (storageError) {

            console.warn(
                "Storage cleanup:",
                storageError
            );

        }


        showMessage(
            "هذا الحساب غير مسجل في Web3Jobs. يرجى إنشاء حساب جديد أولاً.",
            "This account is not registered with Web3Jobs. Please create an account first.",
            "error"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "signup.html"
                );

            },
            2200
        );


        return false;

    }


    /*
     * Save verified account data.
     */

    try {

        localStorage.setItem(
            "web3jobs_account_type",
            accountType
        );

        localStorage.setItem(
            "web3jobs_user_id",
            user.id
        );

        localStorage.setItem(
            "web3jobs_auth_method",
            methodName
        );

    } catch (storageError) {

        console.warn(
            "Storage error:",
            storageError
        );

    }


    showMessage(
        "تم تسجيل الدخول بنجاح. جاري فتح الحساب...",
        "Login successful. Opening your account...",
        "success"
    );


    setTimeout(
        function() {

            redirectUser(
                accountType
            );

        },
        700
    );


    return true;

}


/* =====================================================
   WALLET LOGIN
===================================================== */

walletButton.addEventListener(
    "click",
    async function() {

        hideMessage();


        walletButton.disabled =
            true;

        emailButton.disabled =
            true;


        walletButton.innerHTML =
            '<span class="method-icon">🔐</span> Connecting Wallet...';


        try {

            const client =
                getClient();


            if (
                !client.auth ||
                typeof
                client.auth.signInWithWeb3 !==
                "function"
            ) {

                throw new Error(
                    "Supabase Web3 authentication is not available."
                );

            }


            const result =
                await client.auth.signInWithWeb3({

                    chain:
                        "ethereum",

                    statement:
                        "Sign in to Web3Jobs"

                });


            if (result.error) {

                throw result.error;

            }


            if (
                !result.data ||
                !result.data.user
            ) {

                throw new Error(
                    "Wallet authentication did not return a user."
                );

            }


            const user =
                result.data.user;


            /*
             * Verify account before redirect.
             */

            await finalizeLogin(
                client,
                user,
                "wallet"
            );


        } catch (error) {

            console.error(
                "Wallet login error:",
                error
            );


            showMessage(
                "تعذر تسجيل الدخول بالمحفظة.",
                "Wallet login failed: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );


            resetButtons();

        }

    }
);


/* =====================================================
   EMAIL LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!email) {

            showMessage(
                "يرجى إدخال البريد الإلكتروني.",
                "Please enter your email address.",
                "error"
            );

            return;

        }


        if (!password) {

            showMessage(
                "يرجى إدخال كلمة المرور.",
                "Please enter your password.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        try {

            const client =
                getClient();


            const result =
                await client.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (result.error) {

                throw result.error;

            }


            const user =
                result.data?.user;


            const session =
                result.data?.session;


            if (
                !user ||
                !session
            ) {

                throw new Error(
                    "No authenticated session was created."
                );

            }


            await finalizeLogin(
                client,
                user,
                "email"
            );


        } catch (error) {

            console.error(
                "Email login error:",
                error
            );


            showMessage(
                "تعذر تسجيل الدخول: " +
                (
                    error.message ||
                    "خطأ غير معروف"
                ),

                "Login failed: " +
                (
                    error.message ||
                    "Unknown error"
                ),

                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>

                </html>
