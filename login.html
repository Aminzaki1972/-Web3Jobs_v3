<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Web3Jobs."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Login | Web3Jobs</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #102d4a 0%,
                    #06101d 45%,
                    #030912 100%
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo a {
            color: #ffffff;
            text-decoration: none;
            font-size: 30px;
            font-weight: 800;
        }

        .logo span {
            color: #3b9cff;
        }

        .login-card {
            background: rgba(8, 22, 38, 0.97);

            border:
                1px solid rgba(80, 150, 220, 0.18);

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #91a5ba;
            font-size: 14px;
        }

        /* =========================
           STATUS
        ========================== */

        .status-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.5;
        }

        .status-message.error {
            display: block;

            color: #ff8c8c;

            background:
                rgba(220, 60, 60, 0.10);

            border:
                1px solid rgba(220, 60, 60, 0.25);
        }

        .status-message.success {
            display: block;

            color: #78e0a4;

            background:
                rgba(40, 180, 100, 0.10);

            border:
                1px solid rgba(40, 180, 100, 0.25);
        }

        /* =========================
           WALLET LOGIN
        ========================== */

        .wallet-section {
            margin-bottom: 26px;
        }

        .wallet-button {
            width: 100%;

            min-height: 54px;

            border:
                1px solid #31516d;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #102b45,
                    #0a1b2d
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .wallet-button:hover {
            border-color: #3b9cff;

            background:
                linear-gradient(
                    135deg,
                    #153a5d,
                    #0c2238
                );

            box-shadow:
                0 10px 25px rgba(59, 156, 255, 0.12);
        }

        .wallet-button:active {
            transform: translateY(1px);
        }

        .wallet-icon {
            width: 24px;
            height: 24px;

            border-radius: 6px;

            background:
                linear-gradient(
                    135deg,
                    #f6851b,
                    #e2761b
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: 900;

            color: #ffffff;
        }

        /* =========================
           DIVIDER
        ========================== */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 4px 0 24px;

            color: #60778d;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                #20384f;
        }

        /* =========================
           EMAIL LOGIN
        ========================== */

        .email-title {
            font-size: 14px;
            font-weight: 700;

            color: #dce9f5;

            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #dce9f5;
        }

        .field input {
            width: 100%;
            height: 48px;

            border:
                1px solid #20384f;

            border-radius: 10px;

            background: #071727;

            color: #ffffff;

            padding:
                0 14px;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field input:focus {
            border-color: #3b9cff;

            box-shadow:
                0 0 0 3px
                rgba(59, 156, 255, 0.10);
        }

        .field input::placeholder {
            color: #60778d;
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #248cff,
                    #1769c7
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 2px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .login-button:hover {
            box-shadow:
                0 10px 25px
                rgba(36, 140, 255, 0.25);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled,
        .wallet-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            box-shadow: none;
        }

        /* =========================
           FORGOT PASSWORD
        ========================== */

        .forgot-password {
            text-align: center;

            margin-top: 20px;
        }

        .forgot-password a {
            color: #4da3ff;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* =========================
           REGISTER
        ========================== */

        .register-link {
            text-align: center;

            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid #20384f;

            color: #71869a;

            font-size: 13px;
        }

        .register-link a {
            color: #4da3ff;

            font-weight: 600;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            body {
                padding: 14px;
            }

            .login-card {
                padding:
                    25px 18px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .logo a {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <!-- Logo -->

        <div class="logo">
            <a href="index.html">
                Web3<span>Jobs</span>
            </a>
        </div>


        <!-- Login Card -->

        <section class="login-card">

            <!-- Header -->

            <div class="login-header">

                <h1>
                    Login
                </h1>

                <p>
                    Login to your Web3Jobs account
                </p>

            </div>


            <!-- Status -->

            <div
                id="loginStatus"
                class="status-message"
                aria-live="polite"
            ></div>


            <!-- =========================
                 WALLET LOGIN
            ========================== -->

            <div class="wallet-section">

                <button
                    type="button"
                    id="walletLoginButton"
                    class="wallet-button"
                >

                    <span
                        class="wallet-icon"
                        aria-hidden="true"
                    >
                        W
                    </span>

                    <span>
                        Login with Web3 Wallet
                    </span>

                </button>

            </div>


            <!-- Divider -->

            <div class="divider">
                <span>OR</span>
            </div>


            <!-- =========================
                 EMAIL LOGIN
            ========================== -->

            <div class="email-title">
                Login with Email
            </div>


            <form
                id="loginForm"
                autocomplete="on"
            >

                <!-- Email -->

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Forgot Password -->

            <div class="forgot-password">

                <a href="reset-password.html">
                    Forgot your password?
                </a>

            </div>


            <!-- Register -->

            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </div>

        </section>

    </main>


    <!--
        Web3Jobs Authentication

        auth.js is the ONLY authentication controller.

        It handles:
        - Email Login
        - Wallet Login
        - Session
        - Account Type
        - Redirect
        - Logout
    -->

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

</body>

                        </html>
