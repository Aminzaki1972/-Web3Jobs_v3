<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Web3Jobs</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="logo">
        Web3Jobs
    </div>


    <div class="subtitle">
        Login to your account
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <form id="login-form">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            id="login-button"
            type="submit"
        >
            Login
        </button>


    </form>


    <div class="links">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


</div>


<script>

"use strict";


const SUPABASE_URL =
    "https://jqhemwskrnlycximjpag.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JZuODPmD72gqSauHBTGNYg_cbN7gVsp";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "login-form"
    );


const button =
    document.getElementById(
        "login-button"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        button.disabled =
            true;

        button.textContent =
            "Logging in...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email:

                        email,

                    password:

                        password

                });


            if (error) {

                throw error;
            }


            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            /*
             * Read account type from
             * Supabase user metadata.
             */

            const accountType =
                data.user?.user_metadata?.account_type;


            setTimeout(
                function() {

                    if (
                        accountType ===
                        "company"
                    ) {

                        window.location.href =
                            "company-dashboard.html";

                    } else {

                        window.location.href =
                            "dashboard.html";
                    }

                },
                700
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            showMessage(
                error.message ||
                "Invalid email or password.",
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "Login";
        }

    }
);

</script>


</body>

</html>
