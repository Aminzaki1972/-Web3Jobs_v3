<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Web3Jobs Login - Sign in to your Web3Jobs account."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>
        Login | Web3Jobs
    </title>


    <!-- =====================================================
         STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >


    <style>

        .auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

        }


        .auth-container {

            width: 100%;

            max-width: 460px;

        }


        .auth-card {

            background: rgba(10, 25, 42, 0.95);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);

        }


        .auth-header {

            text-align: center;

            margin-bottom: 28px;

        }


        .auth-header h1 {

            margin: 0 0 10px;

        }


        .auth-header p {

            margin: 0;

            opacity: 0.75;

        }


        .auth-form-group {

            margin-bottom: 18px;

        }


        .auth-form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

        }


        .auth-form-group input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.04);

            color: inherit;

            outline: none;

        }


        .auth-form-group input:focus {

            border-color: #6ee7b7;

        }


        .auth-submit {

            width: 100%;

            padding: 13px 18px;

            border: 0;

            border-radius: 10px;

            background: #6ee7b7;

            color: #06101d;

            font-weight: 800;

            cursor: pointer;

            transition: opacity 0.2s ease;

        }


        .auth-submit:hover {

            opacity: 0.9;

        }


        .auth-submit:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .auth-links {

            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-top: 16px;

            font-size: 14px;

        }


        .auth-links a {

            color: #6ee7b7;

            text-decoration: none;

        }


        .auth-links a:hover {

            text-decoration: underline;

        }


        .auth-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            opacity: 0.65;

        }


        .auth-divider::before,

        .auth-divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background: rgba(255,255,255,0.12);

        }


        .wallet-button {

            width: 100%;

            padding: 13px 18px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            background: transparent;

            color: inherit;

            font-weight: 800;

            cursor: pointer;

        }


        .wallet-button:hover {

            border-color: #6ee7b7;

        }


        .auth-message {

            margin-bottom: 20px;

        }


        .auth-message-box {

            padding: 13px 15px;

            border-radius: 10px;

            line-height: 1.6;

        }


        .auth-message-error {

            background: rgba(239,68,68,0.12);

            border: 1px solid rgba(239,68,68,0.25);

        }


        .auth-message-success {

            background: rgba(110,231,183,0.10);

            border: 1px solid rgba(110,231,183,0.25);

        }


        .auth-message-info {

            background: rgba(59,130,246,0.10);

            border: 1px solid rgba(59,130,246,0.25);

        }


        .auth-footer {

            text-align: center;

            margin-top: 22px;

            opacity: 0.8;

            font-size: 14px;

        }


        .auth-footer a {

            color: #6ee7b7;

            text-decoration: none;

            font-weight: 700;

        }


        .loading-state {

            display: none;

            text-align: center;

            margin-top: 14px;

            font-size: 14px;

            opacity: 0.75;

        }


        .back-home {

            display: inline-block;

            margin-bottom: 20px;

            color: #6ee7b7;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         AUTH PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Web3Jobs
            </a>


            <section class="auth-card">


                <!-- =================================================
                     HEADER
                ================================================== -->

                <div class="auth-header">

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Sign in to your Web3Jobs account
                    </p>

                </div>


                <!-- =================================================
                     AUTH MESSAGE
                ================================================== -->

                <div
                    id="auth-message"
                    class="auth-message"
                    style="display:none;"
                ></div>


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form
                    id="login-form"
                    novalidate
                >


                    <div class="auth-form-group">

                        <label
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        id="login-button"
                        class="auth-submit"
                        type="submit"
                    >
                        Login
                    </button>


                    <div
                        id="login-loading"
                        class="loading-state"
                    >
                        Signing in...
                    </div>


                </form>


                <!-- =================================================
                     LINKS
                ================================================== -->

                <div class="auth-links">

                    <a
                        href="#"
                        id="forgot-password"
                    >
                        Forgot password?
                    </a>


                    <a
                        href="signup.html"
                    >
                        Create Account
                    </a>

                </div>


                <!-- =================================================
                     DIVIDER
                ================================================== -->

                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <!-- =================================================
                     WALLET LOGIN
                ================================================== -->

                <button
                    type="button"
                    id="wallet-login-button"
                    class="wallet-button"
                >
                    Connect Wallet
                </button>


                <!-- =================================================
                     FOOTER
                ================================================== -->

                <div class="auth-footer">

                    Don't have an account?

                    <a
                        href="signup.html"
                    >
                        Create one
                    </a>

                </div>


            </section>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         UNIFIED SUPABASE CLIENT
    ====================================================== -->

    <script
        src="js/supabase.js?v=20260817"
    ></script>


    <!-- =====================================================
         UNIFIED AUTHENTICATION
    ====================================================== -->

    <script
        src="js/auth.js?v=20260817"
    ></script>


    <!-- =====================================================
         LOGIN PAGE ONLY
         
         IMPORTANT:
         This script does NOT create another Supabase client.
         It only calls Web3JobsAuth.login().
    ====================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const form =
                    document.getElementById(
                        "login-form"
                    );


                const emailInput =
                    document.getElementById(
                        "email"
                    );


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const loginButton =
                    document.getElementById(
                        "login-button"
                    );


                const loading =
                    document.getElementById(
                        "login-loading"
                    );


                const forgotPassword =
                    document.getElementById(
                        "forgot-password"
                    );


                const walletButton =
                    document.getElementById(
                        "wallet-login-button"
                    );


                /* =================================================
                   LOGIN
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();


                            if (
                                !window.Web3JobsAuth ||
                                typeof window.Web3JobsAuth.login !== "function"
                            ) {

                                console.error(
                                    "Web3Jobs Auth is unavailable."
                                );


                                window.Web3JobsAuth?.showMessage?.(
                                    "تعذر تحميل نظام تسجيل الدخول.",
                                    "Authentication system is unavailable.",
                                    "error"
                                );

                                return;
                            }


                            const email =
                                emailInput
                                    ?.value
                                    ?.trim();


                            const password =
                                passwordInput
                                    ?.value ||
                                "";


                            if (
                                !email ||
                                !password
                            ) {

                                window.Web3JobsAuth.showMessage(
                                    "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
                                    "Please enter your email and password.",
                                    "error"
                                );

                                return;
                            }


                            /*
                             * Prevent duplicate requests.
                             */

                            loginButton.disabled =
                                true;


                            if (loading) {

                                loading.style.display =
                                    "block";
                            }


                            try {

                                const result =
                                    await window.Web3JobsAuth.login(
                                        email,
                                        password
                                    );


                                console.log(
                                    "Web3Jobs Login Result:",
                                    result
                                );


                                if (
                                    !result ||
                                    !result.success
                                ) {

                                    return;
                                }


                                /*
                                 * Login succeeded.
                                 *
                                 * auth.js has already:
                                 *
                                 * - authenticated the user
                                 * - verified email
                                 * - detected account type
                                 * - saved localStorage
                                 * - generated dashboard URL
                                 */


                                const dashboardUrl =
                                    result.dashboardUrl;


                                if (
                                    dashboardUrl
                                ) {

                                    window.location.replace(
                                        dashboardUrl
                                    );

                                } else {

                                    window.location.replace(
                                        "index.html"
                                    );

                                }

                            } catch (error) {

                                console.error(
                                    "Web3Jobs login page error:",
                                    error
                                );


                                if (
                                    window.Web3JobsAuth &&
                                    typeof window.Web3JobsAuth.showError === "function"
                                ) {

                                    window.Web3JobsAuth.showError(
                                        error
                                    );

                                }

                            } finally {

                                loginButton.disabled =
                                    false;


                                if (loading) {

                                    loading.style.display =
                                        "none";
                                }

                            }

                        }
                    );

                }


                /* =================================================
                   FORGOT PASSWORD
                ================================================== */

                if (forgotPassword) {

                    forgotPassword.addEventListener(
                        "click",
                        async function (event) {

                            event.preventDefault();


                            if (
                                !window.Web3JobsAuth ||
                                typeof window.Web3JobsAuth.resetPassword !== "function"
                            ) {

                                return;
                            }


                            const email =
                                emailInput
                                    ?.value
                                    ?.trim();


                            if (!email) {

                                window.Web3JobsAuth.showMessage(
                                    "أدخل بريدك الإلكتروني أولاً.",
                                    "Enter your email address first.",
                                    "error"
                                );

                                emailInput?.focus();

                                return;
                            }


                            await window.Web3JobsAuth.resetPassword(
                                email
                            );

                        }
                    );

                }


                /* =================================================
                   WALLET LOGIN
                   
                   Wallet authentication is intentionally
                   separate from email/password authentication.
                   
                   It does NOT create another Supabase client.
                ================================================== */

                if (walletButton) {

                    walletButton.addEventListener(
                        "click",
                        async function () {

                            if (
                                typeof window.ethereum ===
                                "undefined"
                            ) {

                                window.Web3JobsAuth?.showMessage?.(
                                    "يرجى تثبيت MetaMask أولاً.",
                                    "Please install MetaMask first.",
                                    "error"
                                );

                                return;
                            }


                            try {

                                walletButton.disabled =
                                    true;


                                walletButton.textContent =
                                    "Connecting...";


                                const accounts =
                                    await window.ethereum.request({
                                        method:
                                            "eth_requestAccounts"
                                    });


                                const address =
                                    accounts?.[0];


                                if (!address) {

                                    throw new Error(
                                        "No wallet account was returned."
                                    );

                                }


                                console.log(
                                    "Web3Jobs Wallet Connected:",
                                    address
                                );


                                window.Web3JobsAuth?.showMessage?.(
                                    "تم الاتصال بالمحفظة بنجاح.",
                                    "Wallet connected successfully.",
                                    "success"
                                );


                            } catch (error) {

                                console.error(
                                    "Web3Jobs wallet login:",
                                    error
                                );


                                window.Web3JobsAuth?.showError?.(
                                    error
                                );


                            } finally {

                                walletButton.disabled =
                                    false;


                                walletButton.textContent =
                                    "Connect Wallet";

                            }

                        }
                    );

                }


                /* =================================================
                   AUTO FOCUS
                ================================================== */

                if (emailInput) {

                    emailInput.focus();

                }


                console.log(
                    "Web3Jobs Login Page initialized."
                );


                console.log(
                    "Unified Authentication:",
                    Boolean(
                        window.Web3JobsAuth
                    )
                );


                console.log(
                    "Unified Supabase:",
                    Boolean(
                        window.Web3JobsSupabase
                    )
                );


            }
        );

    </script>


</body>

                    </html>
