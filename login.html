<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
    name="description"
    content="Web3Jobs - Login to your Web3Jobs account."
>

<title>Login - Web3Jobs</title>

<style>

:root {
    --bg: #06101d;
    --bg2: #09182a;
    --card: #0d1b2e;
    --text: #f5f8ff;
    --muted: #9db0c8;
    --line: #1d3553;
    --accent: #6ee7b7;
    --blue: #60a5fa;
    --danger: #fb7185;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            circle at top,
            rgba(96, 165, 250, 0.14),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );

    color: var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font: inherit;
}

.login-wrapper {
    width: 100%;
    max-width: 440px;
}

.brand {

    display: flex;
    flex-direction: column;
    align-items: center;

    margin-bottom: 24px;

    text-align: center;
}

.brand-logo {

    width: 92px;
    height: 92px;

    object-fit: cover;

    border-radius: 20px;

    margin-bottom: 14px;

    border:
        1px solid
        var(--line);

    box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.35);
}

.brand-name {

    color: white;

    font-size: 25px;

    font-weight: 850;
}

.brand-name span {
    color: var(--accent);
}

.login-card {

    padding: 32px;

    background:
        rgba(13, 27, 46, 0.97);

    border:
        1px solid
        var(--line);

    border-radius: 20px;

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.38);
}

.login-card h1 {

    margin: 0 0 8px;

    text-align: center;

    font-size: 28px;
}

.subtitle {

    margin: 0 0 25px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;
}

#auth-message {

    display: none;

    margin-bottom: 18px;

    border-radius: 10px;

    font-size: 12px;

    line-height: 1.7;
}

.auth-message-box {

    padding: 12px 14px;

    border-radius: 9px;
}

.auth-message-error {

    border:
        1px solid
        rgba(251, 113, 133, 0.35);

    background:
        rgba(251, 113, 133, 0.08);

    color: #fda4af;
}

.auth-message-success {

    border:
        1px solid
        rgba(110, 231, 183, 0.35);

    background:
        rgba(110, 231, 183, 0.08);

    color: var(--accent);
}

.auth-message-info {

    border:
        1px solid
        rgba(96, 165, 250, 0.35);

    background:
        rgba(96, 165, 250, 0.08);

    color: #93c5fd;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {

    display: block;

    margin-bottom: 7px;

    color: #dbe7f4;

    font-size: 13px;

    font-weight: 700;
}

.form-group input {

    width: 100%;

    padding: 13px 14px;

    border:
        1px solid
        #284563;

    border-radius: 10px;

    outline: none;

    background: #071423;

    color: white;

    font-size: 14px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.form-group input:focus {

    border-color:
        var(--blue);

    box-shadow:
        0 0 0 3px
        rgba(96, 165, 250, 0.08);
}

.form-group input::placeholder {
    color: #60758d;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 50px;
}

.toggle-password {

    position: absolute;

    top: 50%;
    right: 10px;

    transform:
        translateY(-50%);

    border: 0;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 16px;

    width: auto;

    padding: 5px;
}

.login-button {

    width: 100%;

    margin-top: 5px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background:
        var(--accent);

    color: var(--bg);

    font-size: 14px;

    font-weight: 850;

    cursor: pointer;

    transition:
        transform .2s,
        opacity .2s;
}

.login-button:hover {

    transform:
        translateY(-1px);

    opacity: .92;
}

.login-button:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;
}

.forgot {

    display: block;

    margin: 16px 0;

    text-align: center;

    color: #8dbdf3;

    font-size: 12px;
}

.forgot:hover {
    color: var(--accent);
}

.divider {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 23px 0;

    color: #71869e;

    font-size: 10px;
}

.divider::before,
.divider::after {

    content: "";

    flex: 1;

    height: 1px;

    background:
        var(--line);
}

.signup {

    text-align: center;

    color: var(--muted);

    font-size: 12px;
}

.signup a {

    color: var(--accent);

    font-weight: 800;
}

.back-home {

    display: block;

    margin-top: 20px;

    text-align: center;

    color: #8da1b8;

    font-size: 11px;
}

.back-home:hover {
    color: white;
}

.social-section {

    margin-top: 22px;

    text-align: center;
}

.social-title {

    margin-bottom: 10px;

    color: #71869e;

    font-size: 10px;

    letter-spacing: .5px;
}

.social-links {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;
}

.social-links a {

    padding:
        7px 10px;

    border:
        1px solid
        var(--line);

    border-radius: 8px;

    background:
        rgba(13, 27, 46, .7);

    color: #9db0c8;

    font-size: 10px;

    transition: .2s;
}

.social-links a:hover {

    border-color:
        var(--accent);

    color:
        var(--accent);
}

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

    .login-card {
        padding: 25px 20px;
    }

    .brand-logo {
        width: 76px;
        height: 76px;
    }

    .brand-name {
        font-size: 22px;
    }

}

</style>

</head>


<body>

<div class="login-wrapper">


    <div class="brand">

        <img
            class="brand-logo"
            src="IMG_20260809_214500_497.jpg"
            alt="Web3Jobs Logo"
        >

        <div class="brand-name">
            Web3<span>Jobs</span>
        </div>

    </div>


    <div class="login-card">

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your Web3Jobs account
        </p>


        <div
            id="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <form
            id="loginForm"
            novalidate
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

        </form>


        <a
            href="forgot-password.html"
            class="forgot"
        >
            Forgot your password?
        </a>


        <div class="divider">
            OR
        </div>


        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>


    <div class="social-section">

        <div class="social-title">
            FOLLOW WEB3JOBS
        </div>

        <div class="social-links">

            <a
                href="https://t.me/web3jop"
                target="_blank"
                rel="noopener noreferrer"
            >
                Telegram
            </a>

            <a
                href="https://whatsapp.com/channel/0029Vb8kCXR5q08ftEh9Dc1u"
                target="_blank"
                rel="noopener noreferrer"
            >
                WhatsApp
            </a>

            <a
                href="https://x.com/crypto1680620"
                target="_blank"
                rel="noopener noreferrer"
            >
                X
            </a>

            <a
                href="https://www.linkedin.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

        </div>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Web3Jobs
    </a>

</div>


<!-- =====================================================
     SUPABASE LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     WEB3JOBS UNIFIED SUPABASE CLIENT
===================================================== -->

<script src="js/supabase.js?v=20260814"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const togglePassword =
    document.getElementById("togglePassword");

const messageElement =
    document.getElementById("auth-message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    arabic,
    english,
    type = "info"
) {

    if (!messageElement) {
        return;
    }

    messageElement.innerHTML = "";

    const box =
        document.createElement("div");

    box.className =
        "auth-message-box auth-message-" +
        type;


    const ar =
        document.createElement("div");

    ar.textContent =
        arabic;


    const en =
        document.createElement("div");

    en.textContent =
        english;


    box.appendChild(ar);

    box.appendChild(en);

    messageElement.appendChild(box);

    messageElement.style.display =
        "block";
}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

if (togglePassword) {

    togglePassword.addEventListener(
        "click",
        function() {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                togglePassword.textContent =
                    "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type =
                    "password";

                togglePassword.textContent =
                    "👁";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );

}


/* =====================================================
   GET ACCOUNT TYPE
   IMPORTANT:
   We do NOT require profiles to exist.
===================================================== */

async function getAccountType(
    client,
    user
) {

    let accountType = "";


    /* -------------------------------------------------
       1. PROFILE TABLE
    ------------------------------------------------- */

    try {

        const {
            data: profile,
            error
        } =
            await client
                .from("profiles")
                .select(
                    "account_type,role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (
            !error &&
            profile
        ) {

            const role =
                String(
                    profile.role || ""
                )
                    .trim()
                    .toLowerCase();


            /* ADMIN */

            if (
                role === "admin"
            ) {

                return "admin";
            }


            accountType =
                String(
                    profile.account_type || ""
                )
                    .trim()
                    .toLowerCase();

        }

    } catch (error) {

        console.warn(
            "Profile lookup skipped:",
            error
        );

    }


    /* -------------------------------------------------
       2. USER METADATA
    ------------------------------------------------- */

    if (!accountType) {

        const metadata =
            user.user_metadata || {};


        accountType =
            String(
                metadata.account_type ||
                metadata.accountType ||
                metadata.role ||
                ""
            )
                .trim()
                .toLowerCase();

    }


    /* -------------------------------------------------
       3. PENDING ACCOUNT TYPE
       Used especially after wallet signup.
    ------------------------------------------------- */

    if (!accountType) {

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_pending_account_type"
                ) || "";

            accountType =
                accountType
                    .trim()
                    .toLowerCase();

        } catch (error) {

            console.warn(
                "Pending account type unavailable:",
                error
            );

        }

    }


    /* -------------------------------------------------
       4. LOCAL ACCOUNT TYPE
    ------------------------------------------------- */

    if (!accountType) {

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_account_type"
                ) || "";

            accountType =
                accountType
                    .trim()
                    .toLowerCase();

        } catch (error) {

            console.warn(
                "Local account type unavailable:",
                error
            );

        }

    }


    /* -------------------------------------------------
       5. COMPANY PROFILE FALLBACK
    ------------------------------------------------- */

    if (!accountType) {

        try {

            const {
                data: companyProfile,
                error
            } =
                await client
                    .from("company_profiles")
                    .select("id")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (
                !error &&
                companyProfile
            ) {

                accountType =
                    "company";

            }

        } catch (error) {

            console.warn(
                "Company profile lookup skipped:",
                error
            );

        }

    }


    /* -------------------------------------------------
       NORMALIZE COMPANY
    ------------------------------------------------- */

    if (
        accountType === "business" ||
        accountType === "employer" ||
        accountType === "organization" ||
        accountType === "organizations" ||
        accountType === "companies"
    ) {

        accountType =
            "company";
    }


    /* -------------------------------------------------
       NORMALIZE INDIVIDUAL
    ------------------------------------------------- */

    if (
        accountType === "person" ||
        accountType === "user" ||
        accountType === "candidate" ||
        accountType === "freelancer" ||
        accountType === "individuals"
    ) {

        accountType =
            "individual";
    }


    return accountType;

}


/* =====================================================
   SAVE LOCAL DATA
===================================================== */

function saveLoginData(
    accountType,
    userId
) {

    try {

        localStorage.setItem(
            "web3jobs_account_type",
            accountType
        );

        localStorage.setItem(
            "web3jobs_user_id",
            userId
        );


        /*
         * Pending account type is no longer needed.
         */

        localStorage.removeItem(
            "web3jobs_pending_account_type"
        );

    } catch (error) {

        console.warn(
            "localStorage error:",
            error
        );

    }

}


/* =====================================================
   REDIRECT
===================================================== */

function redirectUser(
    accountType
) {

    if (
        accountType ===
        "admin"
    ) {

        window.location.replace(
            "admin-dashboard.html"
        );

        return;
    }


    if (
        accountType ===
        "company"
    ) {

        window.location.replace(
            "company-dashboard.html"
        );

        return;
    }


    window.location.replace(
        "dashboard.html"
    );

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        /* -------------------------------------------------
           VALIDATION
        ------------------------------------------------- */

        if (!email) {

            showMessage(
                "يرجى إدخال البريد الإلكتروني.",
                "Please enter your email address.",
                "error"
            );

            return;
        }


        if (!password) {

            showMessage(
                "يرجى إدخال كلمة المرور.",
                "Please enter your password.",
                "error"
            );

            return;
        }


        /* -------------------------------------------------
           GET SINGLE SUPABASE CLIENT
        ------------------------------------------------- */

        let client = null;


        try {

            if (
                window.Web3JobsSupabase &&
                typeof
                window.Web3JobsSupabase.getClient ===
                "function"
            ) {

                client =
                    window.Web3JobsSupabase.getClient();

            } else if (
                window.supabaseClient
            ) {

                client =
                    window.supabaseClient;

            }


            if (
                !client ||
                !client.auth
            ) {

                throw new Error(
                    "Supabase client is not available."
                );

            }


            /* -------------------------------------------------
               DISABLE BUTTON
            ------------------------------------------------- */

            loginButton.disabled =
                true;

            loginButton.textContent =
                "Signing in...";


            /* -------------------------------------------------
               SIGN IN
            ------------------------------------------------- */

            const {
                data,
                error
            } =
                await client.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {
                throw error;
            }


            const user =
                data &&
                data.user
                    ? data.user
                    : null;


            const session =
                data &&
                data.session
                    ? data.session
                    : null;


            if (
                !user ||
                !session
            ) {

                throw new Error(
                    "No authenticated session was created."
                );

            }


            /* -------------------------------------------------
               EMAIL CONFIRMATION
            ------------------------------------------------- */

            if (
                !user.email_confirmed_at &&
                !user.confirmed_at
            ) {

                await client.auth.signOut();


                showMessage(
                    "البريد الإلكتروني غير مؤكد. يرجى تأكيد البريد أولاً.",
                    "Your email is not confirmed. Please confirm it first.",
                    "error"
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";


                return;
            }


            /* -------------------------------------------------
               DETERMINE ACCOUNT TYPE
            ------------------------------------------------- */

            const accountType =
                await getAccountType(
                    client,
                    user
                );


            console.log(
                "Web3Jobs account type:",
                accountType
            );


            /* -------------------------------------------------
               ADMIN
            ------------------------------------------------- */

            if (
                accountType ===
                "admin"
            ) {

                saveLoginData(
                    "admin",
                    user.id
                );


                showMessage(
                    "تم تسجيل الدخول كمسؤول. جاري فتح لوحة الإدارة...",
                    "Administrator login successful. Opening admin dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        redirectUser(
                            "admin"
                        );

                    },
                    500
                );


                return;
            }


            /* -------------------------------------------------
               IMPORTANT WALLET/GITHUB FIX
               
               If profiles does not exist yet, DO NOT FAIL.
               Use metadata / local storage instead.
            ------------------------------------------------- */

            let finalAccountType =
                accountType;


            /*
             * If account type is still unknown,
             * default to individual instead of producing
             * a blank/error page.
             *
             * This prevents wallet-created accounts from
             * getting stuck at login.
             */

            if (
                finalAccountType !==
                "company" &&
                finalAccountType !==
                "individual"
            ) {

                console.warn(
                    "Account type not found. Defaulting to individual.",
                    user
                );


                finalAccountType =
                    "individual";

            }


            /* -------------------------------------------------
               SAVE LOGIN DATA
            ------------------------------------------------- */

            saveLoginData(
                finalAccountType,
                user.id
            );


            /* -------------------------------------------------
               REDIRECT COMPANY
            ------------------------------------------------- */

            if (
                finalAccountType ===
                "company"
            ) {

                showMessage(
                    "تم تسجيل الدخول بنجاح. جاري فتح لوحة الشركة...",
                    "Login successful. Opening company dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        redirectUser(
                            "company"
                        );

                    },
                    500
                );


                return;
            }


            /* -------------------------------------------------
               REDIRECT INDIVIDUAL
            ------------------------------------------------- */

            showMessage(
                "تم تسجيل الدخول بنجاح. جاري فتح لوحة الأفراد...",
                "Login successful. Opening individual dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    redirectUser(
                        "individual"
                    );

                },
                500
            );

        } catch (error) {

            console.error(
                "Web3Jobs Login Error:",
                error
            );


            const errorText =
                String(
                    error &&
                    error.message
                        ? error.message
                        : error
                ).toLowerCase();


            /* -------------------------------------------------
               INVALID LOGIN
            ------------------------------------------------- */

            if (
                errorText.includes(
                    "invalid login credentials"
                )
            ) {

                showMessage(
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
                    "Invalid email or password.",
                    "error"
                );

            }


            /* -------------------------------------------------
               EMAIL NOT CONFIRMED
            ------------------------------------------------- */

            else if (
                errorText.includes(
                    "email not confirmed"
                )
            ) {

                showMessage(
                    "البريد الإلكتروني غير مؤكد.",
                    "Your email is not confirmed.",
                    "error"
                );

            }


            /* -------------------------------------------------
               NETWORK / SUPABASE
            ------------------------------------------------- */

            else {

                showMessage(
                    "حدث خطأ أثناء تسجيل الدخول: " +
                    (
                        error &&
                        error.message
                            ? error.message
                            : "Unknown error"
                    ),

                    "Login error: " +
                    (
                        error &&
                        error.message
                            ? error.message
                            : "Unknown error"
                    ),

                    "error"
                );

            }


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>


</body>

</html>
