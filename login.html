<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Web3Jobs."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Login | Web3Jobs</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #102d4a 0%,
                    #06101d 45%,
                    #030912 100%
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo a {
            color: #ffffff;
            text-decoration: none;

            font-size: 30px;
            font-weight: 800;
        }

        .logo span {
            color: #3b9cff;
        }

        .login-card {
            background: rgba(8, 22, 38, 0.97);

            border:
                1px solid rgba(80, 150, 220, 0.18);

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #91a5ba;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #dce9f5;
        }

        .field input {
            width: 100%;
            height: 48px;

            border: 1px solid #20384f;

            border-radius: 10px;

            background: #071727;

            color: #ffffff;

            padding: 0 14px;

            font-size: 14px;

            outline: none;
        }

        .field input:focus {
            border-color: #3b9cff;

            box-shadow:
                0 0 0 3px rgba(59, 156, 255, 0.10);
        }

        .field input::placeholder {
            color: #60778d;
        }

        .wallet-button {
            width: 100%;
            height: 52px;

            border: 1px solid #20384f;

            border-radius: 10px;

            background: #0a1b2d;

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

            margin-bottom: 24px;
        }

        .wallet-button:hover {
            border-color: #3b9cff;
            background: #0c2035;
        }

        .email-title {
            font-size: 14px;
            font-weight: 700;

            color: #dce9f5;

            margin-bottom: 16px;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #248cff,
                    #1769c7
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 2px;
        }

        .login-button:hover {
            box-shadow:
                0 10px 25px rgba(36, 140, 255, 0.25);
        }

        .forgot-password {
            text-align: center;

            margin-top: 18px;
        }

        .forgot-password a {
            color: #4da3ff;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .status-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;
        }

        .status-message.error {
            display: block;

            color: #ff8c8c;

            background: rgba(220, 60, 60, 0.10);

            border:
                1px solid rgba(220, 60, 60, 0.25);
        }

        .status-message.success {
            display: block;

            color: #78e0a4;

            background: rgba(40, 180, 100, 0.10);

            border:
                1px solid rgba(40, 180, 100, 0.25);
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px 18px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">
            <a href="index.html">
                Web3<span>Jobs</span>
            </a>
        </div>

        <section class="login-card">

            <div class="login-header">
                <h1>Login</h1>

                <p>
                    Login to your Web3Jobs account
                </p>
            </div>

            <div
                id="loginStatus"
                class="status-message"
                aria-live="polite"
            ></div>


            <!-- Wallet Login -->

            <button
                type="button"
                id="walletLoginButton"
                class="wallet-button"
            >
                Login with Web3 Wallet
            </button>


            <!-- Email Login -->

            <div class="email-title">
                Login with Email
            </div>

            <form
                id="loginForm"
                autocomplete="on"
            >

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Forgot Password -->

            <div class="forgot-password">

                <a href="reset-password.html">
                    Forgot your password?
                </a>

            </div>

        </section>

    </main>


    <!--
        auth.js is the only authentication controller.
    -->

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
