<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Web3Jobs."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Login | Web3Jobs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #10263d 0%,
                    #06101d 48%,
                    #030912 100%
                );

            color: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand a {
            color: #ffffff;
            text-decoration: none;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .brand span {
            color: #6ee7b7;
        }

        .login-card {
            width: 100%;

            background:
                rgba(10, 24, 39, 0.92);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(14px);
        }

        .login-card h1 {
            margin: 0 0 8px;

            font-size: 28px;
            line-height: 1.2;

            text-align: center;
        }

        .login-subtitle {
            margin: 0 0 28px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #e2e8f0;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                1px solid #26384b;

            background: #081522;

            color: #ffffff;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #6ee7b7;

            box-shadow:
                0 0 0 3px
                rgba(110, 231, 183, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 60px;
        }

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #64748b;

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;

            padding: 5px;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .forgot-password {
            display: flex;

            justify-content: flex-end;

            margin-top: -5px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #6ee7b7;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 14px 18px;

            background: #6ee7b7;

            color: #06101d;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .auth-message {
            display: none;

            margin-bottom: 18px;
        }

        .auth-message-box {
            border-radius: 10px;

            padding: 13px 14px;

            font-size: 13px;

            line-height: 1.6;

            border: 1px solid transparent;
        }

        .auth-message-box div + div {
            margin-top: 4px;

            opacity: 0.85;
        }

        .auth-message-error {
            background:
                rgba(239, 68, 68, 0.10);

            border-color:
                rgba(239, 68, 68, 0.25);

            color: #fecaca;
        }

        .auth-message-success {
            background:
                rgba(34, 197, 94, 0.10);

            border-color:
                rgba(34, 197, 94, 0.25);

            color: #bbf7d0;
        }

        .auth-message-info {
            background:
                rgba(59, 130, 246, 0.10);

            border-color:
                rgba(59, 130, 246, 0.25);

            color: #bfdbfe;
        }

        .register-link {
            margin-top: 24px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .register-link a {
            color: #6ee7b7;

            font-weight: 800;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;

            margin-top: 18px;
        }

        .back-home a {
            color: #64748b;

            font-size: 13px;

            text-decoration: none;
        }

        .back-home a:hover {
            color: #cbd5e1;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;

            border:
                2px solid rgba(6, 16, 29, 0.25);

            border-top-color: #06101d;

            border-radius: 50%;

            display: inline-block;

            vertical-align: middle;

            animation:
                login-spin 0.7s linear infinite;

            margin-right: 7px;
        }

        @keyframes login-spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 24px 20px;
            }

            .brand a {
                font-size: 26px;
            }

            .login-card h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <main class="login-wrapper">

        <div class="brand">

            <a href="index.html">
                Web3<span>Jobs</span>
            </a>

        </div>


        <section class="login-card">

            <h1>
                Login
            </h1>

            <p class="login-subtitle">
                Sign in to your Web3Jobs account.
            </p>


            <!-- =================================================
                 AUTH MESSAGE
                 Controlled by auth.js
            ================================================== -->

            <div
                id="auth-message"
                class="auth-message"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="login-form"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="forgot-password">

                    <a href="reset-password.html">
                        Forgot your password?
                    </a>

                </div>


                <button
                    type="submit"
                    id="login-button"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Web3Jobs
                </a>

            </div>

        </section>

    </main>


    <!-- =========================================================
         IMPORTANT SCRIPT ORDER

         1. Supabase JavaScript library
         2. Web3Jobs unified Supabase client
         3. Web3Jobs unified authentication
         4. Login page logic

         IMPORTANT:
         login.html does NOT create a Supabase client.
    ========================================================== -->


    <!-- =========================================================
         1. SUPABASE LIBRARY
    ========================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================================================
         2. SINGLE WEB3JOBS SUPABASE CLIENT
    ========================================================== -->

    <script
        src="js/supabase.js"
    ></script>


    <!-- =========================================================
         3. SINGLE WEB3JOBS AUTH SYSTEM
    ========================================================== -->

    <script
        src="js/auth.js"
    ></script>


    <!-- =========================================================
         4. LOGIN PAGE LOGIC
    ========================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const form =
                    document.getElementById(
                        "login-form"
                    );


                const emailInput =
                    document.getElementById(
                        "email"
                    );


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const loginButton =
                    document.getElementById(
                        "login-button"
                    );


                const togglePassword =
                    document.getElementById(
                        "toggle-password"
                    );


                /* =================================================
                   CHECK REQUIRED ELEMENTS
                ================================================== */

                if (!form) {

                    console.error(
                        "Web3Jobs Login: login form not found."
                    );

                    return;
                }


                if (!emailInput || !passwordInput) {

                    console.error(
                        "Web3Jobs Login: required input fields not found."
                    );

                    return;
                }


                if (!loginButton) {

                    console.error(
                        "Web3Jobs Login: login button not found."
                    );

                    return;
                }


                /* =================================================
                   CHECK AUTH SYSTEM
                ================================================== */

                if (
                    !window.Web3JobsAuth ||
                    typeof window.Web3JobsAuth.login !==
                        "function"
                ) {

                    console.error(
                        "Web3Jobs Login: Web3JobsAuth is unavailable."
                    );

                    return;
                }


                /* =================================================
                   PASSWORD VISIBILITY
                ================================================== */

                if (togglePassword) {

                    togglePassword.addEventListener(
                        "click",
                        function () {

                            const isPassword =
                                passwordInput.type ===
                                "password";


                            passwordInput.type =
                                isPassword
                                    ? "text"
                                    : "password";


                            togglePassword.textContent =
                                isPassword
                                    ? "Hide"
                                    : "Show";


                            togglePassword.setAttribute(
                                "aria-label",
                                isPassword
                                    ? "Hide password"
                                    : "Show password"
                            );

                        }
                    );

                }


                /* =================================================
                   LOGIN SUBMIT
                ================================================== */

                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const email =
                            emailInput.value
                                .trim()
                                .toLowerCase();


                        const password =
                            passwordInput.value;


                        /* =========================================
                           BASIC VALIDATION
                        ========================================== */

                        if (!email || !password) {

                            window.Web3JobsAuth.showMessage(
                                "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
                                "Please enter your email and password.",
                                "error"
                            );

                            return;
                        }


                        /* =========================================
                           DISABLE LOGIN BUTTON
                        ========================================== */

                        loginButton.disabled =
                            true;


                        loginButton.innerHTML = `
                            <span
                                class="loading-spinner"
                                aria-hidden="true"
                            ></span>
                            Signing in...
                        `;


                        try {

                            /* =====================================
                               AUTH.JS IS THE ONLY LOGIN SYSTEM
                            ====================================== */

                            const result =
                                await window.Web3JobsAuth.login(
                                    email,
                                    password
                                );


                            console.log(
                                "Web3Jobs Login Result:",
                                result
                            );


                            /* =====================================
                               SUCCESS
                            ====================================== */

                            if (
                                result &&
                                result.success === true
                            ) {

                                const dashboardUrl =
                                    result.dashboardUrl;


                                if (dashboardUrl) {

                                    /*
                                     * auth.js already determined:
                                     *
                                     * admin
                                     * company
                                     * individual
                                     */

                                    window.location.replace(
                                        dashboardUrl
                                    );

                                    return;
                                }


                                window.Web3JobsAuth.showMessage(
                                    "تم تسجيل الدخول ولكن لم يتم تحديد صفحة الحساب.",
                                    "Login succeeded but no dashboard was determined.",
                                    "error"
                                );

                                return;
                            }


                            /* =====================================
                               LOGIN FAILED
                               auth.js already displays the error.
                            ====================================== */

                            console.warn(
                                "Web3Jobs Login failed:",
                                result
                            );

                        } catch (error) {

                            console.error(
                                "Web3Jobs Login Page Error:",
                                error
                            );


                            if (
                                window.Web3JobsAuth &&
                                typeof window.Web3JobsAuth.showError ===
                                    "function"
                            ) {

                                window.Web3JobsAuth.showError(
                                    error
                                );

                            }

                        } finally {

                            /*
                             * If login succeeded and navigation
                             * happened, the page will unload.
                             */

                            loginButton.disabled =
                                false;


                            loginButton.textContent =
                                "Login";

                        }

                    }
                );

            }
        );

    </script>

</body>

                    </html>
