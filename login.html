<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Web3Jobs password."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Reset Password | Web3Jobs</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: rgba(10,25,42,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            margin: 0 0 10px;
        }

        .auth-header p {
            margin: 0;
            opacity: 0.75;
        }

        .auth-form-group {
            margin-bottom: 18px;
        }

        .auth-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: inherit;
            outline: none;
        }

        .auth-form-group input:focus {
            border-color: #6ee7b7;
        }

        .auth-submit {
            width: 100%;
            padding: 13px 18px;
            border: 0;
            border-radius: 10px;
            background: #6ee7b7;
            color: #06101d;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .auth-message {
            margin-bottom: 20px;
        }

        .auth-message-box {
            padding: 13px 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .auth-message-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
        }

        .auth-message-success {
            background: rgba(110,231,183,0.10);
            border: 1px solid rgba(110,231,183,0.25);
        }

        .auth-message-info {
            background: rgba(59,130,246,0.10);
            border: 1px solid rgba(59,130,246,0.25);
        }

        .loading-state {
            display: none;
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            opacity: 0.75;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #6ee7b7;
            text-decoration: none;
            font-size: 14px;
        }

        .password-note {
            font-size: 12px;
            opacity: 0.65;
            margin-top: 6px;
        }
    </style>

</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <a
            href="login.html"
            class="back-home"
        >
            ← Back to Login
        </a>

        <section class="auth-card">

            <div class="auth-header">

                <h1>Reset Password</h1>

                <p>
                    Create a new password for your Web3Jobs account
                </p>

            </div>

            <div
                id="auth-message"
                class="auth-message"
                style="display:none;"
            ></div>

            <form
                id="reset-password-form"
                novalidate
            >

                <div class="auth-form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="auth-form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Enter your new password"
                        required
                    >

                </div>

                <div class="auth-form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Re-enter your new password"
                        required
                    >

                </div>

                <button
                    id="reset-button"
                    class="auth-submit"
                    type="submit"
                >
                    Reset Password
                </button>

                <div
                    id="reset-loading"
                    class="loading-state"
                >
                    Updating password...
                </div>

            </form>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js?v=20260817"></script>

<script src="js/auth.js?v=20260817"></script>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", async function () {

    const form =
        document.getElementById(
            "reset-password-form"
        );

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirm-password");

    const resetButton =
        document.getElementById("reset-button");

    const loading =
        document.getElementById("reset-loading");


    /* =====================================================
       GET SUPABASE CLIENT
    ====================================================== */

    const client =
        window.Web3JobsAuth?.getClient?.();


    if (!client) {

        window.Web3JobsAuth.showMessage(
            "تعذر الاتصال بخدمة المصادقة.",
            "Authentication service is unavailable.",
            "error"
        );

        return;
    }


    /* =====================================================
       CHECK CURRENT USER
    ====================================================== */

    try {

        const sessionResult =
            await client.auth.getSession();

        const session =
            sessionResult?.data?.session;

        if (
            !session ||
            !session.user
        ) {

            window.Web3JobsAuth.showMessage(
                "رابط إعادة تعيين كلمة السر غير صالح أو انتهت صلاحيته.",
                "The password reset link is invalid or has expired.",
                "error"
            );

            resetButton.disabled = true;

            return;
        }

        emailInput.value =
            session.user.email || "";

    } catch (error) {

        console.error(
            "Web3Jobs reset session:",
            error
        );

        window.Web3JobsAuth.showError(error);

        resetButton.disabled = true;

        return;
    }


    /* =====================================================
       RESET PASSWORD
    ====================================================== */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (!email) {

                window.Web3JobsAuth.showMessage(
                    "يرجى إدخال البريد الإلكتروني.",
                    "Please enter your email address.",
                    "error"
                );

                emailInput.focus();

                return;
            }


            if (!password) {

                window.Web3JobsAuth.showMessage(
                    "يرجى إدخال كلمة السر الجديدة.",
                    "Please enter your new password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (!confirmPassword) {

                window.Web3JobsAuth.showMessage(
                    "يرجى إعادة كتابة كلمة السر.",
                    "Please confirm your new password.",
                    "error"
                );

                confirmPasswordInput.focus();

                return;
            }


            if (password !== confirmPassword) {

                window.Web3JobsAuth.showMessage(
                    "كلمتا السر غير متطابقتين.",
                    "Passwords do not match.",
                    "error"
                );

                confirmPasswordInput.focus();

                return;
            }


            resetButton.disabled = true;

            if (loading) {
                loading.style.display = "block";
            }


            try {

                const result =
                    await client.auth.updateUser({
                        password: password
                    });


                if (result.error) {
                    throw result.error;
                }


                window.Web3JobsAuth.showMessage(
                    "تم تغيير كلمة السر بنجاح. يمكنك الآن تسجيل الدخول.",
                    "Your password has been changed successfully. You can now log in.",
                    "success"
                );


                try {
                    await client.auth.signOut();
                } catch (signOutError) {
                    console.warn(
                        "Web3Jobs reset signout:",
                        signOutError
                    );
                }


                setTimeout(function () {

                    window.location.replace(
                        "login.html"
                    );

                }, 1800);


            } catch (error) {

                console.error(
                    "Web3Jobs password update:",
                    error
                );

                window.Web3JobsAuth.showError(
                    error
                );

                resetButton.disabled = false;

            } finally {

                if (loading) {
                    loading.style.display = "none";
                }

            }

        }
    );

});
</script>

</body>
</html>
