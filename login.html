<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to Web3Jobs - Web3 and Blockchain Jobs Platform"
    >

    <title>Login - Web3Jobs</title>

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #1d3557 0%,
                    #0b1220 45%,
                    #050810 100%
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;
        }

        .login-page {
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            width: 100%;

            background: rgba(15, 23, 42, 0.96);

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 22px;

            padding: 38px 34px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(12px);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand a {
            color: #ffffff;
            text-decoration: none;
        }

        .brand-title {
            margin: 0;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .brand-title span {
            color: #38bdf8;
        }

        .brand-subtitle {
            margin: 8px 0 0;

            color: #94a3b8;

            font-size: 14px;
        }

        .form-title {
            margin: 0 0 8px;

            font-size: 25px;
            font-weight: 700;

            text-align: center;
        }

        .form-description {
            margin: 0 0 25px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border-radius: 10px;

            border: 1px solid #334155;

            outline: none;

            background: #0f172a;

            color: #ffffff;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .login-button {
            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0ea5e9,
                    #2563eb
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .login-button:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        .message {
            display: none;

            margin: 16px 0 0;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #fecaca;

            background: rgba(127, 29, 29, 0.35);

            border: 1px solid rgba(248, 113, 113, 0.35);
        }

        .message.success {
            color: #bbf7d0;

            background: rgba(20, 83, 45, 0.35);

            border: 1px solid rgba(74, 222, 128, 0.30);
        }

        .confirmation-box {
            display: none;

            margin-top: 18px;

            padding: 16px;

            border-radius: 12px;

            background: rgba(30, 41, 59, 0.75);

            border: 1px solid rgba(148, 163, 184, 0.18);

            text-align: center;
        }

        .confirmation-box.show {
            display: block;
        }

        .confirmation-box p {
            margin: 0 0 12px;

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.6;
        }

        #resend-button {
            border: none;

            background: transparent;

            color: #38bdf8;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            padding: 5px;
        }

        #resend-button:hover {
            text-decoration: underline;
        }

        #resend-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .register-link {
            margin-top: 24px;

            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }

        .register-link a {
            color: #38bdf8;

            font-weight: 700;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }

        .back-home:hover {
            color: #cbd5e1;
        }

        .loading {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }

        .spinner {
            width: 16px;

            height: 16px;

            border: 2px solid rgba(255, 255, 255, 0.35);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                loginSpin 0.8s linear infinite;
        }

        @keyframes loginSpin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @media (max-width: 520px) {

            body {
                padding: 18px 12px;
            }

            .login-card {
                padding: 30px 22px;

                border-radius: 18px;
            }

            .brand-title {
                font-size: 30px;
            }

            .form-title {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <a href="index.html">

                    <h1 class="brand-title">
                        Web<span>3</span>Jobs
                    </h1>

                    <p class="brand-subtitle">
                        Web3 & Blockchain Jobs Platform
                    </p>

                </a>

            </div>


            <h2 class="form-title">
                Welcome Back
            </h2>


            <p class="form-description">
                Login to your Web3Jobs account
            </p>


            <form
                id="login-form"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="login-button"
                    class="login-button"
                >
                    Login
                </button>


                <div
                    id="login-message"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <div
                    id="confirmation-box"
                    class="confirmation-box"
                >

                    <p>
                        Your email address has not been confirmed yet.
                        Please check your inbox and confirm your email
                        before logging in.
                    </p>

                    <button
                        type="button"
                        id="resend-button"
                    >
                        Resend confirmation email
                    </button>

                </div>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Web3Jobs
            </a>

        </section>

    </main>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         WEB3JOBS SUPABASE CONFIG
         ===================================================== -->

    <script src="js/supabase.js"></script>


    <!-- =====================================================
         WEB3JOBS AUTHENTICATION
         ===================================================== -->

    <script src="js/auth.js"></script>


    <!-- =====================================================
         LOGIN PAGE INITIALIZATION
         ===================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const loginForm =
                    document.getElementById("login-form");

                const emailInput =
                    document.getElementById("email");

                const passwordInput =
                    document.getElementById("password");

                const loginButton =
                    document.getElementById("login-button");

                const loginMessage =
                    document.getElementById("login-message");

                const confirmationBox =
                    document.getElementById("confirmation-box");

                const resendButton =
                    document.getElementById("resend-button");


                /*
                 * Show message
                 */

                function showMessage(
                    message,
                    type
                ) {

                    if (!loginMessage) {
                        return;
                    }

                    loginMessage.textContent =
                        message || "";

                    loginMessage.className =
                        "message show " +
                        (type || "error");

                }


                /*
                 * Hide message
                 */

                function hideMessage() {

                    if (!loginMessage) {
                        return;
                    }

                    loginMessage.textContent = "";

                    loginMessage.className =
                        "message";

                }


                /*
                 * Show email confirmation area
                 */

                function showConfirmationBox() {

                    if (!confirmationBox) {
                        return;
                    }

                    confirmationBox.classList.add(
                        "show"
                    );

                }


                /*
                 * Hide email confirmation area
                 */

                function hideConfirmationBox() {

                    if (!confirmationBox) {
                        return;
                    }

                    confirmationBox.classList.remove(
                        "show"
                    );

                }


                /*
                 * Login button loading state
                 */

                function setLoading(
                    loading
                ) {

                    if (!loginButton) {
                        return;
                    }

                    loginButton.disabled =
                        loading;

                    if (loading) {

                        loginButton.innerHTML =
                            '<span class="loading">' +
                            '<span class="spinner"></span>' +
                            'Signing in...' +
                            '</span>';

                    } else {

                        loginButton.textContent =
                            "Login";

                    }

                }


                /*
                 * Login form
                 */

                if (loginForm) {

                    loginForm.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();

                            hideMessage();

                            hideConfirmationBox();


                            const email =
                                emailInput
                                    ? emailInput.value.trim()
                                    : "";

                            const password =
                                passwordInput
                                    ? passwordInput.value
                                    : "";


                            if (!email) {

                                showMessage(
                                    "Please enter your email address.",
                                    "error"
                                );

                                if (emailInput) {
                                    emailInput.focus();
                                }

                                return;
                            }


                            if (!password) {

                                showMessage(
                                    "Please enter your password.",
                                    "error"
                                );

                                if (passwordInput) {
                                    passwordInput.focus();
                                }

                                return;
                            }


                            setLoading(true);


                            try {

                                /*
                                 * auth.js should provide
                                 * loginUser(email, password)
                                 */

                                if (
                                    typeof window.loginUser !==
                                    "function"
                                ) {

                                    throw new Error(
                                        "Authentication system is not available."
                                    );

                                }


                                const result =
                                    await window.loginUser(
                                        email,
                                        password
                                    );


                                /*
                                 * auth.js may return an object
                                 * containing an error.
                                 */

                                if (
                                    result &&
                                    result.error
                                ) {

                                    const errorMessage =
                                        result.error.message ||
                                        result.error ||
                                        "Login failed.";

                                    const lowerMessage =
                                        String(
                                            errorMessage
                                        ).toLowerCase();


                                    if (
                                        lowerMessage.includes(
                                            "confirm"
                                        ) ||
                                        lowerMessage.includes(
                                            "email not confirmed"
                                        ) ||
                                        lowerMessage.includes(
                                            "not confirmed"
                                        )
                                    ) {

                                        showMessage(
                                            "Please confirm your email address before logging in.",
                                            "error"
                                        );

                                        showConfirmationBox();

                                    } else {

                                        showMessage(
                                            String(
                                                errorMessage
                                            ),
                                            "error"
                                        );

                                    }

                                    return;
                                }


                                /*
                                 * If auth.js handles the redirect,
                                 * the page will automatically change.
                                 */

                                if (
                                    result === false
                                ) {

                                    showMessage(
                                        "Login failed. Please check your email and password.",
                                        "error"
                                    );

                                }

                            } catch (error) {

                                console.error(
                                    "Login error:",
                                    error
                                );


                                const errorText =
                                    error &&
                                    error.message
                                        ? error.message
                                        : "Unable to login. Please try again.";


                                const lowerMessage =
                                    String(
                                        errorText
                                    ).toLowerCase();


                                if (
                                    lowerMessage.includes(
                                        "confirm"
                                    ) ||
                                    lowerMessage.includes(
                                        "email not confirmed"
                                    ) ||
                                    lowerMessage.includes(
                                        "not confirmed"
                                    )
                                ) {

                                    showMessage(
                                        "Please confirm your email address before logging in.",
                                        "error"
                                    );

                                    showConfirmationBox();

                                } else {

                                    showMessage(
                                        errorText,
                                        "error"
                                    );

                                }

                            } finally {

                                setLoading(false);

                            }

                        }
                    );

                }


                /*
                 * Resend confirmation email
                 */

                if (resendButton) {

                    resendButton.addEventListener(
                        "click",
                        async function () {

                            const email =
                                emailInput
                                    ? emailInput.value.trim()
                                    : "";


                            if (!email) {

                                showMessage(
                                    "Please enter your email address first.",
                                    "error"
                                );

                                if (emailInput) {
                                    emailInput.focus();
                                }

                                return;

                            }


                            resendButton.disabled =
                                true;


                            resendButton.textContent =
                                "Sending...";


                            try {

                                /*
                                 * auth.js should provide
                                 * resendConfirmationEmail(email)
                                 */

                                if (
                                    typeof window.resendConfirmationEmail !==
                                    "function"
                                ) {

                                    throw new Error(
                                        "Email confirmation service is not available."
                                    );

                                }


                                const result =
                                    await window.resendConfirmationEmail(
                                        email
                                    );


                                if (
                                    result &&
                                    result.error
                                ) {

                                    throw new Error(
                                        result.error.message ||
                                        String(
                                            result.error
                                        )
                                    );

                                }


                                showMessage(
                                    "A new confirmation email has been sent. Please check your inbox.",
                                    "success"
                                );


                            } catch (error) {

                                console.error(
                                    "Resend confirmation error:",
                                    error
                                );


                                showMessage(
                                    error &&
                                    error.message
                                        ? error.message
                                        : "Unable to resend the confirmation email.",
                                    "error"
                                );

                            } finally {

                                resendButton.disabled =
                                    false;

                                resendButton.textContent =
                                    "Resend confirmation email";

                            }

                        }
                    );

                }

            }
        );

    </script>

</body>

        </html>
