    <!-- =====================================================
         JOBS PAGE STYLE
         ===================================================== -->

    <style>

        .jobs-page {
            min-height: 100vh;
        }


        /* =====================================================
           HERO
           ===================================================== */

        .jobs-hero {
            padding: 90px 20px 50px;
            text-align: center;
        }

        .jobs-hero h1 {
            margin: 0 0 15px;
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 800;
        }

        .jobs-hero p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.7;
            opacity: .8;
        }


        /* =====================================================
           SEARCH
           ===================================================== */

        .jobs-search-section {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto 45px;
        }

        .job-search-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            padding: 15px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(12px);
        }

        .job-search-form input {
            width: 100%;
            min-height: 52px;
            padding: 0 18px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(0,0,0,.2);
            color: inherit;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .job-search-form input:focus {
            border-color: #6366f1;
        }

        .job-search-form button {
            min-height: 52px;
            padding: 0 25px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            background: #6366f1;
            color: #fff;
        }


        /* =====================================================
           FILTERS
           ===================================================== */

        .jobs-filters {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto 35px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .jobs-filter {
            min-height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.05);
            color: inherit;
            cursor: pointer;
            box-sizing: border-box;
        }

        .jobs-filter:focus {
            outline: 2px solid #6366f1;
        }

        .clear-filters {
            margin-left: auto;
            border: 0;
            background: transparent;
            color: #818cf8;
            cursor: pointer;
            font-weight: 700;
        }


        /* =====================================================
           JOBS SECTION
           ===================================================== */

        .jobs-section {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto 80px;
        }

        .jobs-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .jobs-section-header h2 {
            margin: 0;
            font-size: 28px;
        }

        .jobs-section-header p {
            margin-top: 8px;
            opacity: .7;
        }


        /* =====================================================
           JOBS LIST
           ===================================================== */

        #jobs-list {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 20px;
        }


        /* =====================================================
           JOB CARD
           ===================================================== */

        .job-card {
            padding: 25px;
            border-radius: 18px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.10);

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .job-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,102,241,.6);
            box-shadow:
                0 15px 40px rgba(0,0,0,.18);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .job-card-title h3 {
            margin: 0 0 7px;
            font-size: 21px;
            line-height: 1.35;
        }

        .job-company {
            font-size: 14px;
            opacity: .7;
            font-weight: 600;
        }


        /* =====================================================
           JOB META
           ===================================================== */

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .job-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;

            padding: 6px 9px;

            border-radius: 8px;

            background:
                rgba(255,255,255,.06);

            font-size: 12px;
            opacity: .85;
        }


        /* =====================================================
           SKILLS
           ===================================================== */

        .job-skills {
            margin-bottom: 15px;
            padding: 9px 12px;

            border-radius: 9px;

            background:
                rgba(99,102,241,.10);

            font-size: 13px;
            line-height: 1.5;
        }


        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .job-description {
            margin: 0 0 20px;

            line-height: 1.7;
            font-size: 14px;
            opacity: .75;

            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =====================================================
           BUTTONS
           ===================================================== */

        .job-card-actions {
            display: flex;
            gap: 10px;
        }

        .job-view-button,
        .job-apply-button {
            width: 100%;
            min-height: 45px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            border: 0;
            border-radius: 10px;

            cursor: pointer;

            background: #6366f1;
            color: #fff;

            font-weight: 700;
            text-decoration: none;
        }

        .job-view-button:hover,
        .job-apply-button:hover {
            filter: brightness(1.1);
        }


        /* =====================================================
           LOADING / EMPTY
           ===================================================== */

        .jobs-loading,
        .no-jobs {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            border-radius: 18px;

            background:
                rgba(255,255,255,.04);

            border:
                1px solid rgba(255,255,255,.08);
        }

        .jobs-loading p,
        .no-jobs p {
            opacity: .7;
        }


        /* =====================================================
           JOB DETAILS MODAL
           ===================================================== */

        #jobs-detail-modal {
            font-family: inherit;
        }

        #jobs-detail-modal .jobs-modal-overlay {
            position: absolute;
            inset: 0;
        }

        #jobs-detail-modal .jobs-modal {
            position: relative;

            width:
                min(720px, 100%);

            max-height:
                90vh;

            overflow-y:
                auto;

            padding:
                35px;

            border-radius:
                20px;

            background:
                #111827;

            color:
                #ffffff;

            box-shadow:
                0 30px 80px rgba(0,0,0,.5);

            box-sizing:
                border-box;
        }

        #jobs-detail-modal .jobs-modal-close {

            position: absolute;

            top: 12px;
            right: 15px;

            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            color: #ffffff;

            font-size: 26px;

            cursor: pointer;
        }

        #jobs-detail-modal .jobs-modal-close:hover {
            background:
                rgba(255,255,255,.15);
        }

        #jobs-detail-modal .jobs-modal-body h2 {

            margin:
                0 45px 25px 0;

            font-size:
                30px;

            line-height:
                1.3;
        }


        /* =====================================================
           DETAILS
           ===================================================== */

        .job-details-meta {

            display:
                grid;

            gap:
                10px;

            margin-bottom:
                20px;
        }

        .job-details-meta p {

            margin:
                0;

            line-height:
                1.6;
        }

        .job-full-description {

            white-space:
                pre-line;

            line-height:
                1.8;

            opacity:
                .85;
        }


        /* =====================================================
           APPLY
           ===================================================== */

        .job-application-area {

            margin-top:
                30px;
        }

        .job-apply-button {

            min-height:
                52px;

            border:
                0;

            border-radius:
                12px;

            background:
                #6366f1;

            color:
                #ffffff;

            font-weight:
                800;

            font-size:
                16px;

            cursor:
                pointer;
        }

        .job-apply-button:hover {
            filter:
                brightness(1.1);
        }

        .job-apply-button:disabled {

            opacity:
                .6;

            cursor:
                wait;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #jobs-message {
            z-index:
                100000;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 800px) {

            .jobs-hero {
                padding-top: 60px;
            }

            .job-search-form {
                grid-template-columns: 1fr;
            }

            #jobs-list {
                grid-template-columns: 1fr;
            }

            .jobs-section-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

            .clear-filters {

                margin-left:
                    0;
            }

            #jobs-detail-modal .jobs-modal {

                padding:
                    25px;
            }

        }


        @media (max-width: 500px) {

            .jobs-search-section,
            .jobs-filters,
            .jobs-section {

                width:
                    min(
                        calc(100% - 24px),
                        1150px
                    );
            }

            .jobs-hero {

                padding-left:
                    12px;

                padding-right:
                    12px;
            }

            .job-card {

                padding:
                    20px;
            }

            .job-meta {

                flex-direction:
                    column;

                align-items:
                    flex-start;
            }

            .job-card-actions {
                flex-direction: column;
            }

        }

    </style>

    <!-- =====================================================
         FILTER CONTROLLER
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const typeFilter =
                    document.getElementById(
                        "job-type-filter"
                    );


                const locationFilter =
                    document.getElementById(
                        "location-filter"
                    );


                const clearButton =
                    document.getElementById(
                        "clear-job-filters"
                    );


                /*
                 * Job type filter
                 */

                if (typeFilter) {

                    typeFilter.addEventListener(
                        "change",
                        function () {

                            if (
                                window.Web3JobsJobs &&
                                typeof window.Web3JobsJobs.filterJobsByType ===
                                "function"
                            ) {

                                window.Web3JobsJobs
                                    .filterJobsByType(
                                        this.value
                                    );
                            }

                        }
                    );

                }


                /*
                 * Location filter
                 */

                if (locationFilter) {

                    locationFilter.addEventListener(
                        "input",
                        function () {

                            if (
                                window.Web3JobsJobs &&
                                typeof window.Web3JobsJobs.filterJobsByLocation ===
                                "function"
                            ) {

                                window.Web3JobsJobs
                                    .filterJobsByLocation(
                                        this.value
                                    );
                            }

                        }
                    );

                }


                /*
                 * Clear filters
                 */

                if (clearButton) {

                    clearButton.addEventListener(
                        "click",
                        function () {

                            if (typeFilter) {
                                typeFilter.value = "";
                            }


                            if (locationFilter) {
                                locationFilter.value = "";
                            }


                            const searchInput =
                                document.getElementById(
                                    "job-search"
                                );


                            if (searchInput) {
                                searchInput.value = "";
                            }


                            if (
                                window.Web3JobsJobs &&
                                typeof window.Web3JobsJobs.clearJobFilters ===
                                "function"
                            ) {

                                window.Web3JobsJobs
                                    .clearJobFilters();
                            }

                        }
                    );

                }

            }
        );

    </script>


    <!-- =====================================================
         UNIFIED SUPABASE CLIENT
         MUST LOAD BEFORE jobs.js
         ===================================================== -->

    <script
        src="./js/supabase.js"
    ></script>


    <!-- =====================================================
         JOBS SYSTEM
         ===================================================== -->

    <script
        src="./js/jobs.js"
    ></script>


    <!-- =====================================================
         JOBS BOOT / SAFE INITIALIZATION
         ===================================================== -->

    <script>

        (function () {

            "use strict";


            function bootJobsPage() {

                /*
                 * jobs.js exposes:
                 *
                 * window.Web3JobsJobs.initializeJobs()
                 */

                if (
                    window.Web3JobsJobs &&
                    typeof window.Web3JobsJobs.initializeJobs ===
                    "function"
                ) {

                    window.Web3JobsJobs
                        .initializeJobs();

                    return true;
                }


                return false;
            }


            function waitForJobsSystem(
                attempts = 0
            ) {

                if (
                    bootJobsPage()
                ) {

                    return;
                }


                /*
                 * Give supabase.js / jobs.js time
                 * to finish loading.
                 */

                if (
                    attempts >= 20
                ) {

                    console.error(
                        "Web3Jobs: Jobs system could not be initialized."
                    );

                    const container =
                        document.getElementById(
                            "jobs-list"
                        );


                    if (container) {

                        container.innerHTML = `

                            <div class="no-jobs">

                                <h3>
                                    Unable to load jobs
                                </h3>

                                <p>
                                    Please refresh the page and try again.
                                </p>

                            </div>

                        `;
                    }

                    return;
                }


                setTimeout(
                    function () {

                        waitForJobsSystem(
                            attempts + 1
                        );

                    },
                    300
                );
            }


            /*
             * Start after DOM is ready.
             */

            if (
                document.readyState ===
                "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    function () {

                        waitForJobsSystem();

                    },
                    {
                        once: true
                    }
                );

            } else {

                waitForJobsSystem();

            }

        })();

    </script>
