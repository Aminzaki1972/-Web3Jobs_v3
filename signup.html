<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Web3Jobs account."
    >

    <title>Create Account - Web3Jobs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                180deg,
                #06101d,
                #09182a
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: #0d1b2e;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #1d3553;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo span {
            color: #6ee7b7;
        }

        .subtitle {
            text-align: center;
            color: #9db0c8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .section-title {
            text-align: center;
            color: #9db0c8;
            font-size: 12px;
            font-weight: 700;
            margin: 20px 0 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #dbe7f4;
            font-weight: 600;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #284563;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: #071423;
            color: white;
        }

        input:focus,
        select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96,165,250,.08);
        }

        select option {
            background: #071423;
            color: white;
        }

        button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .email-button {
            background: #6ee7b7;
            color: #06101d;
        }

        .wallet-button {
            background: #111827;
            color: white;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }

        .github-button {
            background: #24292f;
            color: white;
        }

        .wallet-button,
        .github-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .button-icon {
            font-size: 19px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 23px 0;
            color: #71869e;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1d3553;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .success {
            background: rgba(110,231,183,.10);
            border: 1px solid rgba(110,231,183,.3);
            color: #6ee7b7;
        }

        .error {
            background: rgba(251,113,133,.10);
            border: 1px solid rgba(251,113,133,.3);
            color: #fda4af;
        }

        .info {
            background: rgba(96,165,250,.10);
            border: 1px solid rgba(96,165,250,.3);
            color: #93c5fd;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #9db0c8;
            font-size: 13px;
        }

        .login-link a {
            color: #6ee7b7;
            text-decoration: none;
            font-weight: 700;
        }

        .small-note {
            text-align: center;
            color: #71869e;
            font-size: 11px;
            margin-top: 12px;
            line-height: 1.5;
        }

        .wallet-address {
            display: none;
            margin-top: 10px;
            padding: 9px;
            background: #071423;
            border: 1px solid #1d3553;
            border-radius: 8px;
            color: #9db0c8;
            font-size: 10px;
            word-break: break-all;
            text-align: center;
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .auth-container {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="logo">
        Web3<span>Jobs</span>
    </div>

    <div class="subtitle">
        Create your account
    </div>

    <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
    ></div>

    <!-- ACCOUNT TYPE -->

    <div class="form-group">

        <label for="account-type">
            Account Type
        </label>

        <select id="account-type">

            <option value="">
                Select account type
            </option>

            <option value="individual">
                Individual
            </option>

            <option value="company">
                Company
            </option>

        </select>

    </div>

    <!-- WALLET -->

    <div class="section-title">
        Create account with
    </div>

    <button
        type="button"
        id="wallet-button"
        class="wallet-button"
    >
        <span class="button-icon">🦊</span>
        Continue with Web3 Wallet
    </button>

    <div
        id="wallet-address"
        class="wallet-address"
    ></div>

    <!-- GITHUB -->

    <button
        type="button"
        id="github-button"
        class="github-button"
    >
        <span class="button-icon">🐙</span>
        Continue with GitHub
    </button>

    <div class="divider">
        OR
    </div>

    <!-- EMAIL -->

    <div class="section-title">
        Create account with Email
    </div>

    <form id="signup-form">

        <div class="form-group">

            <label for="full-name">
                Full Name
            </label>

            <input
                id="full-name"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >

        </div>

        <button
            id="signup-button"
            class="email-button"
            type="submit"
        >
            Create Account with Email
        </button>

    </form>

    <div class="small-note">

        Wallet and GitHub accounts will be connected
        securely through Supabase.

    </div>

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>

<!-- SUPABASE LIBRARY -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<!-- WEB3JOBS UNIFIED SUPABASE CLIENT -->

<script
    src="js/supabase.js?v=20260814"
></script>

<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("signup-form");

const button =
    document.getElementById("signup-button");

const walletButton =
    document.getElementById("wallet-button");

const githubButton =
    document.getElementById("github-button");

const accountTypeSelect =
    document.getElementById("account-type");

const message =
    document.getElementById("message");

const walletAddress =
    document.getElementById("wallet-address");


/* =====================================================
   SUPABASE CLIENT
===================================================== */

function getClient() {

    if (
        window.Web3JobsSupabase &&
        typeof window.Web3JobsSupabase.getClient === "function"
    ) {

        return window.Web3JobsSupabase.getClient();

    }

    if (
        window.supabaseClient &&
        typeof window.supabaseClient.from === "function"
    ) {

        return window.supabaseClient;

    }

    return null;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    if (!message) {
        return;
    }

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


/* =====================================================
   ACCOUNT TYPE
===================================================== */

function getAccountType() {

    return String(
        accountTypeSelect.value || ""
    )
        .trim()
        .toLowerCase();
}


/* =====================================================
   SAVE ACCOUNT TYPE
===================================================== */

function saveAccountType(accountType) {

    try {

        localStorage.setItem(
            "web3jobs_pending_account_type",
            accountType
        );

    } catch (error) {

        console.warn(
            "Storage error:",
            error
        );

    }
}


/* =====================================================
   RESET BUTTONS
===================================================== */

function resetButtons() {

    button.disabled = false;

    walletButton.disabled = false;

    githubButton.disabled = false;

    button.textContent =
        "Create Account with Email";

    walletButton.innerHTML =
        '<span class="button-icon">🦊</span> Continue with Web3 Wallet';

    githubButton.innerHTML =
        '<span class="button-icon">🐙</span> Continue with GitHub';
}


/* =====================================================
   DISABLE ALL
===================================================== */

function disableAll() {

    button.disabled = true;

    walletButton.disabled = true;

    githubButton.disabled = true;
}


/* =====================================================
   EMAIL SIGNUP
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const client =
            getClient();

        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;
        }

        const fullName =
            document
                .getElementById("full-name")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("password")
                .value;

        const accountType =
            getAccountType();

        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            return;
        }

        if (!fullName) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }

        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;
        }

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }

        disableAll();

        button.textContent =
            "Creating account...";

        try {

            const {
                data,
                error
            } =
                await client.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            account_type:
                                accountType

                        }

                    }

                });

            if (error) {
                throw error;
            }

            showMessage(
                "Account created successfully. Please check your email if confirmation is required.",
                "success"
            );

            setTimeout(
                function() {

                    window.location.replace(
                        "login.html"
                    );

                },
                1800
            );

        } catch (error) {

            console.error(
                "Email signup error:",
                error
            );

            showMessage(
                "Unable to create account: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );

            resetButtons();
        }

    }
);


/* =====================================================
   GITHUB
===================================================== */

githubButton.addEventListener(
    "click",
    async function() {

        const client =
            getClient();

        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;
        }

        const accountType =
            getAccountType();

        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            return;
        }

        saveAccountType(accountType);

        disableAll();

        githubButton.textContent =
            "Connecting to GitHub...";

        try {

            const {
                error
            } =
                await client.auth.signInWithOAuth({

                    provider: "github",

                    options: {

                        redirectTo:
                            window.location.origin +
                            window.location.pathname

                    }

                });

            if (error) {
                throw error;
            }

        } catch (error) {

            console.error(
                "GitHub OAuth error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to connect to GitHub.",
                "error"
            );

            resetButtons();
        }

    }
);


/* =====================================================
   WALLET
   FIXED VERSION
===================================================== */

walletButton.addEventListener(
    "click",
    async function() {

        const client =
            getClient();

        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;
        }


        /* ---------------------------------------------
           ACCOUNT TYPE
        --------------------------------------------- */

        const accountType =
            getAccountType();

        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            accountTypeSelect.focus();

            return;
        }


        /* ---------------------------------------------
           CHECK WALLET
        --------------------------------------------- */

        if (
            typeof window.ethereum === "undefined"
        ) {

            showMessage(
                "No Web3 wallet was detected. Please open Web3Jobs inside MetaMask or another compatible wallet browser.",
                "error"
            );

            return;
        }


        saveAccountType(accountType);


        /*
         * IMPORTANT:
         *
         * We do NOT call disableAll()
         * before signInWithWeb3().
         *
         * The wallet must be allowed to
         * open its signature request.
         */

        walletButton.disabled = true;

        githubButton.disabled = true;

        button.disabled = true;

        walletButton.innerHTML =
            '<span class="button-icon">🦊</span> Waiting for wallet...';


        try {

            /* -----------------------------------------
               SUPABASE WEB3 SIGN IN
            ----------------------------------------- */

            const {
                data,
                error
            } =
                await client.auth.signInWithWeb3({

                    chain: "ethereum",

                    statement:
                        "Sign in to Web3Jobs"

                });


            if (error) {
                throw error;
            }


            /* -----------------------------------------
               CHECK USER
            ----------------------------------------- */

            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Wallet authentication did not create a user."
                );

            }


            const user =
                data.user;


            /* -----------------------------------------
               GET WALLET ADDRESS
            ----------------------------------------- */

            let wallet = "";


            wallet =
                user.user_metadata?.wallet_address ||
                user.user_metadata?.address ||
                user.identities?.[0]?.identity_data?.address ||
                "";


            /*
             * Fallback to connected wallet.
             */

            if (
                !wallet &&
                window.ethereum
            ) {

                try {

                    const accounts =
                        await window.ethereum.request({
                            method: "eth_accounts"
                        });

                    if (
                        accounts &&
                        accounts.length > 0
                    ) {

                        wallet =
                            accounts[0];

                    }

                } catch (walletError) {

                    console.warn(
                        "Unable to read wallet address:",
                        walletError
                    );

                }

            }


            /* -----------------------------------------
               DISPLAY WALLET
            ----------------------------------------- */

            if (wallet) {

                walletAddress.textContent =
                    "Wallet: " + wallet;

                walletAddress.style.display =
                    "block";

            }


            /* -----------------------------------------
               UPDATE USER METADATA
            ----------------------------------------- */

            const {
                error: updateError
            } =
                await client.auth.updateUser({

                    data: {

                        account_type:
                            accountType,

                        wallet_connected:
                            true,

                        wallet_address:
                            wallet || null

                    }

                });


            if (updateError) {

                console.warn(
                    "Metadata update warning:",
                    updateError
                );

            }


            /* -----------------------------------------
               SAVE LOCAL DATA
            ----------------------------------------- */

            try {

                localStorage.setItem(
                    "web3jobs_account_type",
                    accountType
                );

                localStorage.setItem(
                    "web3jobs_user_id",
                    user.id
                );

                localStorage.removeItem(
                    "web3jobs_pending_account_type"
                );

            } catch (storageError) {

                console.warn(
                    "localStorage error:",
                    storageError
                );

            }


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                "Wallet connected and account created successfully. Opening login page...",
                "success"
            );


            walletButton.innerHTML =
                '<span class="button-icon">✓</span> Wallet Connected';


            /* -----------------------------------------
               SIGN OUT
            ----------------------------------------- */

            setTimeout(
                async function() {

                    try {

                        await client.auth.signOut();

                    } catch (logoutError) {

                        console.warn(
                            "Sign out warning:",
                            logoutError
                        );

                    }

                    window.location.replace(
                        "login.html"
                    );

                },
                1500
            );


        } catch (error) {

            console.error(
                "Wallet signup error:",
                error
            );


            /* -----------------------------------------
               USER CANCELLED SIGNATURE
            ----------------------------------------- */

            if (
                error &&
                (
                    error.code === 4001 ||
                    String(
                        error.message || ""
                    )
                        .toLowerCase()
                        .includes("user rejected")
                )
            ) {

                showMessage(
                    "Wallet signature was cancelled.",
                    "error"
                );

            } else {

                showMessage(
                    "Wallet signup failed: " +
                    (
                        error.message ||
                        "Unknown error"
                    ),
                    "error"
                );

            }


            resetButtons();

        }

    }
);


/* =====================================================
   GITHUB CALLBACK
===================================================== */

async function handleGitHubCallback() {

    const client =
        getClient();

    if (!client) {
        return;
    }

    try {

        const {
            data,
            error
        } =
            await client.auth.getSession();

        if (error) {
            throw error;
        }

        const session =
            data?.session;

        if (!session) {
            return;
        }

        const user =
            session.user;

        const provider =
            String(
                user.app_metadata?.provider ||
                ""
            )
                .toLowerCase();

        if (
            provider !== "github"
        ) {

            return;
        }

        let accountType = "";

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_pending_account_type"
                ) || "";

        } catch (error) {

            console.warn(
                "Storage read error:",
                error
            );

        }

        accountType =
            String(accountType)
                .trim()
                .toLowerCase();

        if (
            accountType !== "company" &&
            accountType !== "individual"
        ) {

            accountType =
                "individual";
        }

        const {
            error: updateError
        } =
            await client.auth.updateUser({

                data: {

                    account_type:
                        accountType

                }

            });

        if (updateError) {

            console.warn(
                "GitHub metadata update:",
                updateError
            );

        }

        try {

            localStorage.setItem(
                "web3jobs_account_type",
                accountType
            );

            localStorage.setItem(
                "web3jobs_user_id",
                user.id
            );

            localStorage.removeItem(
                "web3jobs_pending_account_type"
            );

        } catch (storageError) {

            console.warn(
                "Storage cleanup:",
                storageError
            );

        }

        showMessage(
            "GitHub account connected successfully.",
            "success"
        );

        setTimeout(
            function() {

                if (
                    accountType === "company"
                ) {

                    window.location.replace(
                        "company-dashboard.html"
                    );

                } else {

                    window.location.replace(
                        "dashboard.html"
                    );

                }

            },
            1000
        );

    } catch (error) {

        console.error(
            "GitHub callback error:",
            error
        );

        showMessage(
            "Unable to complete GitHub authentication: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }

}


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        handleGitHubCallback();

    }
);

</script>

</body>

    </html>
