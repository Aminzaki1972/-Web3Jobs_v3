    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"

    src="js/supabase.js?v=20260814"
></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("signup-form");

const button =
    document.getElementById("signup-button");

const walletButton =
    document.getElementById("wallet-button");

const githubButton =
    document.getElementById("github-button");

const accountTypeSelect =
    document.getElementById("account-type");

const message =
    document.getElementById("message");

const walletAddress =
    document.getElementById("wallet-address");


/* =====================================================
   SUPABASE
===================================================== */

function getClient() {

    if (
        window.Web3JobsSupabase &&
        typeof
        window.Web3JobsSupabase.getClient ===
        "function"
    ) {

        const client =
            window.Web3JobsSupabase.getClient();

        if (client) {

            return client;

        }

    }


    if (
        window.supabaseClient &&
        typeof
        window.supabaseClient.from ===
        "function"
    ) {

        return window.supabaseClient;

    }


    return null;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


function hideMessage() {

    message.style.display =
        "none";

    message.textContent =
        "";
}


/* =====================================================
   ACCOUNT TYPE
===================================================== */

function getAccountType() {

    return String(
        accountTypeSelect.value || ""
    )
        .trim()
        .toLowerCase();
}


/* =====================================================
   SAVE PENDING ACCOUNT TYPE
===================================================== */

function savePendingAccountType(
    accountType
) {

    localStorage.setItem(
        "web3jobs_pending_account_type",
        accountType
    );
}


/* =====================================================
   RESET BUTTONS
===================================================== */

function resetButtons() {

    button.disabled =
        false;

    walletButton.disabled =
        false;

    githubButton.disabled =
        false;


    button.textContent =
        "Create Account with Email";


    walletButton.innerHTML =
        '<span class="button-icon">🦊</span> Continue with Web3 Wallet';


    githubButton.innerHTML =
        '<span class="button-icon">🐙</span> Continue with GitHub';

}


/* =====================================================
   DISABLE ALL
===================================================== */

function disableAll() {

    button.disabled =
        true;

    walletButton.disabled =
        true;

    githubButton.disabled =
        true;

}


/* =====================================================
   CREATE / UPDATE PROFILE
===================================================== */

async function createOrUpdateProfile(
    client,
    user,
    accountType
) {

    if (
        !client ||
        !user ||
        !user.id
    ) {

        throw new Error(
            "User information is missing."
        );

    }


    const metadata =
        user.user_metadata || {};


    const fullName =
        metadata.full_name ||
        metadata.name ||
        "";


    const avatarUrl =
        metadata.avatar_url ||
        metadata.picture ||
        null;


    /*
     * First check whether profile exists.
     */

    const existing =
        await client
            .from("profiles")
            .select(
                "id,email,full_name,account_type,avatar_url,role"
            )
            .eq(
                "id",
                user.id
            )
            .maybeSingle();


    if (existing.error) {

        throw existing.error;

    }


    /*
     * Profile already exists.
     */

    if (existing.data) {

        const updateData = {

            email:
                user.email ||
                existing.data.email ||
                null,

            account_type:
                accountType,

            updated_at:
                new Date().toISOString()

        };


        if (
            fullName &&
            !existing.data.full_name
        ) {

            updateData.full_name =
                fullName;

        }


        if (
            avatarUrl &&
            !existing.data.avatar_url
        ) {

            updateData.avatar_url =
                avatarUrl;

        }


        const updated =
            await client
                .from("profiles")
                .update(
                    updateData
                )
                .eq(
                    "id",
                    user.id
                );


        if (updated.error) {

            throw updated.error;

        }


        return updated.data;

    }


    /*
     * Profile does not exist.
     * Create it.
     */

    const profile = {

        id:
            user.id,

        email:
            user.email ||
            null,

        full_name:
            fullName ||
            null,

        account_type:
            accountType,

        avatar_url:
            avatarUrl,

        bio:
            null,

        location:
            null,

        website:
            null,

        role:
            accountType,

        created_at:
            new Date().toISOString(),

        updated_at:
            new Date().toISOString()

    };


    const inserted =
        await client
            .from("profiles")
            .insert(
                profile
            );


    if (inserted.error) {

        throw inserted.error;

    }


    return inserted.data;

}


/* =====================================================
   SAVE LOCAL ACCOUNT
===================================================== */

function saveLocalAccount(
    user,
    accountType,
    method
) {

    localStorage.setItem(
        "web3jobs_account_type",
        accountType
    );

    localStorage.setItem(
        "web3jobs_user_id",
        user.id
    );

    localStorage.setItem(
        "web3jobs_auth_method",
        method
    );

    localStorage.removeItem(
        "web3jobs_pending_account_type"
    );

}


/* =====================================================
   REDIRECT
===================================================== */

function redirectToDashboard(
    accountType
) {

    if (
        accountType ===
        "company"
    ) {

        window.location.replace(
            "company-dashboard.html"
        );

        return;

    }


    window.location.replace(
        "dashboard.html"
    );

}


/* =====================================================
   EMAIL SIGNUP
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        hideMessage();


        const client =
            getClient();


        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;

        }


        const fullName =
            document
                .getElementById("full-name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const accountType =
            getAccountType();


        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            return;

        }


        if (!fullName) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;

        }


        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        disableAll();

        button.textContent =
            "Creating account...";


        try {

            const result =
                await client.auth.signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            account_type:
                                accountType

                        }

                    }

                });


            if (result.error) {

                throw result.error;

            }


            /*
             * If Supabase immediately created
             * an authenticated session, create profile.
             */

            if (
                result.data &&
                result.data.user &&
                result.data.session
            ) {

                await createOrUpdateProfile(
                    client,
                    result.data.user,
                    accountType
                );

                saveLocalAccount(
                    result.data.user,
                    accountType,
                    "email"
                );

                showMessage(
                    "Account created successfully. Opening your account...",
                    "success"
                );


                setTimeout(
                    function() {

                        redirectToDashboard(
                            accountType
                        );

                    },
                    1000
                );

                return;

            }


            /*
             * Email confirmation is enabled.
             */

            showMessage(
                "Account created. Please check your email to confirm your account.",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        "login.html"
                    );

                },
                2000
            );


        } catch (error) {

            console.error(
                "Email signup error:",
                error
            );


            showMessage(
                "Unable to create account: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );


            resetButtons();

        }

    }
);


/* =====================================================
   GITHUB SIGNUP
===================================================== */

githubButton.addEventListener(
    "click",
    async function() {

        hideMessage();


        const client =
            getClient();


        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;

        }


        const accountType =
            getAccountType();


        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            accountTypeSelect.focus();

            return;

        }


        /*
         * VERY IMPORTANT:
         * Save the selected type before leaving
         * the page for GitHub.
         */

        savePendingAccountType(
            accountType
        );


        disableAll();


        githubButton.innerHTML =
            '<span class="button-icon">🐙</span> Connecting to GitHub...';


        showMessage(
            "Connecting to GitHub...",
            "info"
        );


        try {

            const redirectUrl =
                "https://aminzaki1972.github.io/-Web3Jobs_v3/signup.html";


            const result =
                await client.auth.signInWithOAuth({

                    provider:
                        "github",

                    options: {

                        redirectTo:
                            redirectUrl

                    }

                });


            if (result.error) {

                throw result.error;

            }


            /*
             * Supabase normally redirects automatically.
             */

            if (
                result.data &&
                result.data.url
            ) {

                window.location.assign(
                    result.data.url
                );

            }

        } catch (error) {

            console.error(
                "GitHub OAuth error:",
                error
            );


            showMessage(
                "Unable to connect to GitHub: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );


            resetButtons();

        }

    }
);


/* =====================================================
   GITHUB CALLBACK
===================================================== */

async function handleGitHubCallback() {

    const client =
        getClient();


    if (!client) {

        return;

    }


    try {

        /*
         * Wait briefly for Supabase to process
         * the OAuth URL.
         */

        const {
            data,
            error
        } =
            await client.auth.getSession();


        if (error) {

            throw error;

        }


        const session =
            data &&
            data.session
                ? data.session
                : null;


        /*
         * No session = normal signup page.
         */

        if (
            !session ||
            !session.user
        ) {

            return;

        }


        const user =
            session.user;


        const provider =
            String(
                user.app_metadata?.provider ||
                ""
            )
                .trim()
                .toLowerCase();


        /*
         * Only process GitHub callback.
         */

        if (
            provider !==
            "github"
        ) {

            return;

        }


        /*
         * Get the account type selected
         * BEFORE going to GitHub.
         */

        let accountType =
            localStorage.getItem(
                "web3jobs_pending_account_type"
            ) || "";


        accountType =
            String(accountType)
                .trim()
                .toLowerCase();


        if (
            accountType !== "individual" &&
            accountType !== "company"
        ) {

            /*
             * Try metadata as a secondary source.
             */

            accountType =
                String(
                    user.user_metadata?.account_type ||
                    ""
                )
                    .trim()
                    .toLowerCase();

        }


        /*
         * Do NOT silently select individual.
         */

        if (
            accountType !== "individual" &&
            accountType !== "company"
        ) {

            await client.auth.signOut();


            showMessage(
                "Please return and select Individual or Company before continuing with GitHub.",
                "error"
            );


            resetButtons();

            return;

        }


        /*
         * Save account type in Auth metadata.
         */

        const metadataUpdate =
            await client.auth.updateUser({

                data: {

                    full_name:
                        user.user_metadata?.name ||
                        user.user_metadata?.full_name ||
                        null,

                    account_type:
                        accountType,

                    auth_provider:
                        "github"

                }

            });


        if (
            metadataUpdate.error
        ) {

            console.warn(
                "GitHub metadata warning:",
                metadataUpdate.error
            );

        }


        /*
         * CREATE THE PROFILES ROW.
         */

        await createOrUpdateProfile(
            client,
            user,
            accountType
        );


        /*
         * Save verified local account data.
         */

        saveLocalAccount(
            user,
            accountType,
            "github"
        );


        /*
         * Clean the URL.
         */

        try {

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        } catch (historyError) {

            console.warn(
                "URL cleanup warning:",
                historyError
            );

        }


        /*
         * Success.
         */

        showMessage(
            "GitHub account created successfully. Opening your account...",
            "success"
        );


        /*
         * Redirect.
         */

        setTimeout(
            function() {

                redirectToDashboard(
                    accountType
                );

            },
            1000
        );


    } catch (error) {

        console.error(
            "GitHub callback error:",
            error
        );


        showMessage(
            "Unable to complete GitHub account creation: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );


        resetButtons();

    }

}


/* =====================================================
   WALLET SIGNUP
===================================================== */

walletButton.addEventListener(
    "click",
    async function() {

        hideMessage();


        const client =
            getClient();


        if (!client) {

            showMessage(
                "Supabase connection is unavailable.",
                "error"
            );

            return;

        }


        const accountType =
            getAccountType();


        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            accountTypeSelect.focus();

            return;

        }


        savePendingAccountType(
            accountType
        );


        disableAll();


        walletButton.innerHTML =
            '<span class="button-icon">🦊</span> Waiting for signature...';


        try {

            if (
                !client.auth ||
                typeof client.auth.signInWithWeb3 !==
                "function"
            ) {

                throw new Error(
                    "Supabase Web3 authentication is not available."
                );

            }


            const result =
                await client.auth.signInWithWeb3({

                    chain:
                        "ethereum",

                    statement:
                        "Create your Web3Jobs account"

                });


            if (result.error) {

                throw result.error;

            }


            const user =
                result.data?.user;


            if (!user) {

                throw new Error(
                    "Wallet authentication did not return a user."
                );

            }


            const wallet =
                user.user_metadata?.wallet_address ||
                user.user_metadata?.address ||
                user.identities?.[0]?.identity_data?.address ||
                "";


            if (wallet) {

                walletAddress.textContent =
                    "Wallet: " + wallet;

                walletAddress.style.display =
                    "block";

            }


            await client.auth.updateUser({

                data: {

                    account_type:
                        accountType,

                    wallet_connected:
                        true,

                    wallet_address:
                        wallet || null

                }

            });


            await createOrUpdateProfile(
                client,
                user,
                accountType
            );


            saveLocalAccount(
                user,
                accountType,
                "wallet"
            );


            showMessage(
                "Wallet account created successfully. Opening your account...",
                "success"
            );


            setTimeout(
                function() {

                    redirectToDashboard(
                        accountType
                    );

                },
                1000
            );


        } catch (error) {

            console.error(
                "Wallet signup error:",
                error
            );


            showMessage(
                "Wallet signup failed: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );


            resetButtons();

        }

    }
);


/* =====================================================
   PAGE START
