<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Web3Jobs</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .section-title {
            text-align: center;
            color: #555;
            font-size: 14px;
            font-weight: 700;
            margin: 20px 0 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: .92;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .email-button {
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        .wallet-button {
            background: #111827;
            color: white;
            margin-bottom: 10px;
        }

        .github-button {
            background: #24292f;
            color: white;
        }

        .wallet-button,
        .github-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .button-icon {
            font-size: 19px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 23px 0;
            color: #888;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .small-note {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin-top: 10px;
            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="logo">
        Web3Jobs
    </div>

    <div class="subtitle">
        Create your account
    </div>

    <div
        id="message"
        class="message"
    ></div>

    <!-- ACCOUNT TYPE -->

    <div class="form-group">

        <label for="account-type">
            Account Type
        </label>

        <select id="account-type">

            <option value="">
                Select account type
            </option>

            <option value="individual">
                Individual
            </option>

            <option value="company">
                Company
            </option>

        </select>

    </div>

    <!-- WEB3 WALLET -->

    <div class="section-title">
        Create account with
    </div>

    <button
        type="button"
        id="wallet-button"
        class="wallet-button"
    >
        <span class="button-icon">🦊</span>
        Continue with Web3 Wallet
    </button>

    <!-- GITHUB -->

    <button
        type="button"
        id="github-button"
        class="github-button"
    >
        <span class="button-icon">🐙</span>
        Continue with GitHub
    </button>

    <div class="divider">
        OR
    </div>

    <!-- EMAIL -->

    <div class="section-title">
        Create account with Email
    </div>

    <form id="signup-form">

        <div class="form-group">

            <label for="full-name">
                Full Name
            </label>

            <input
                id="full-name"
                type="text"
                placeholder="Enter your full name"
                required
            >

        </div>

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

        </div>

        <button
            id="signup-button"
            class="email-button"
            type="submit"
        >
            Create Account with Email
        </button>

    </form>

    <div class="small-note">
        For Wallet and GitHub accounts, you will be asked to authorize the login.
    </div>

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>

<script>

"use strict";

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jqhemwskrnlycximjpag.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JZuODPmD72gqSauHBTGNYg_cbN7gVsp";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================
   ELEMENTS
========================================= */

const form =
    document.getElementById("signup-form");

const button =
    document.getElementById("signup-button");

const walletButton =
    document.getElementById("wallet-button");

const githubButton =
    document.getElementById("github-button");

const accountTypeSelect =
    document.getElementById("account-type");

const message =
    document.getElementById("message");

/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}

/* =========================================
   ACCOUNT TYPE
========================================= */

function getAccountType() {

    return accountTypeSelect.value
        .trim()
        .toLowerCase();
}

/* =========================================
   SAVE ACCOUNT TYPE
========================================= */

function saveAccountType() {

    const accountType =
        getAccountType();

    if (!accountType) {
        return false;
    }

    try {

        localStorage.setItem(
            "web3jobs_pending_account_type",
            accountType
        );

    } catch (error) {

        console.warn(
            "Unable to save account type:",
            error
        );

    }

    return true;
}

/* =========================================
   EMAIL SIGNUP
========================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const fullName =
            document
                .getElementById("full-name")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const accountType =
            getAccountType();

        if (!fullName) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }

        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;
        }

        if (!password) {

            showMessage(
                "Please create a password.",
                "error"
            );

            return;
        }

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }

        if (!accountType) {

            showMessage(
                "Please select Individual or Company.",
                "error"
            );

            return;
        }

        button.disabled = true;
        walletButton.disabled = true;
        githubButton.disabled = true;

        button.textContent =
            "Creating account...";

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            account_type:
                                accountType

                        }

                    }

                });

            if (error) {
                throw error;
            }

            showMessage(
                "Account created successfully. Please check your email if confirmation is required.",
                "success"
            );

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                2000
            );

        } catch (error) {

            console.error(
                "Signup error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );

            button.disabled = false;
            walletButton.disabled = false;
            githubButton.disabled = false;

            button.textContent =
                "Create Account with Email";
        }

    }
);

/* =========================================
   GITHUB SIGNUP
========================================= */

githubButton.addEventListener(
    "click",
    async function() {

        const accountType =
            getAccountType();

        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            return;
        }

        saveAccountType();

        githubButton.disabled = true;
        walletButton.disabled = true;
        button.disabled = true;

        githubButton.textContent =
            "Connecting to GitHub...";

        try {

            const {
                error
            } =
                await supabaseClient.auth.signInWithOAuth({

                    provider: "github",

                    options: {

                        redirectTo:
                            "https://aminzaki1972.github.io/web3jobs-v2/sign-in.html"

                    }

                });

            if (error) {
                throw error;
            }

        } catch (error) {

            console.error(
                "GitHub OAuth error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to connect to GitHub.",
                "error"
            );

            githubButton.disabled = false;
            walletButton.disabled = false;
            button.disabled = false;

            githubButton.textContent =
                "🐙 Continue with GitHub";
        }

    }
);

/* =========================================
   WEB3 WALLET
========================================= */

walletButton.addEventListener(
    "click",
    async function() {

        const accountType =
            getAccountType();

        if (!accountType) {

            showMessage(
                "Please select Individual or Company first.",
                "error"
            );

            return;
        }

        saveAccountType();

        walletButton.disabled = true;
        githubButton.disabled = true;
        button.disabled = true;

        walletButton.textContent =
            "Connecting Wallet...";

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithWeb3({

                    chain: "ethereum",

                    statement:
                        "Sign in to Web3Jobs"

                });

            if (error) {
                throw error;
            }

            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Wallet authentication did not create a user."
                );

            }

            const {
                error: updateError
            } =
                await supabaseClient.auth.updateUser({

                    data: {

                        account_type:
                            accountType

                    }

                });

            if (updateError) {

                console.warn(
                    "Metadata update:",
                    updateError
                );

            }

            showMessage(
                "Wallet connected successfully. Your account has been created.",
                "success"
            );

            setTimeout(
                function() {

                    if (
                        accountType ===
                        "company"
                    ) {

                        window.location.href =
                            "company-dashboard.html";

                    } else {

                        window.location.href =
                            "dashboard.html";

                    }

                },
                1200
            );

        } catch (error) {

            console.error(
                "Wallet signup error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to connect your Web3 wallet.",
                "error"
            );

            walletButton.disabled = false;
            githubButton.disabled = false;
            button.disabled = false;

            walletButton.textContent =
                "🦊 Continue with Web3 Wallet";
        }

    }
);

/* =========================================
   GITHUB CALLBACK
========================================= */

async function handleOAuthCallback() {

    try {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();

        if (!session) {
            return;
        }

        const user =
            session.user;

        const provider =
            user.app_metadata?.provider;

        if (
            provider !==
            "github"
        ) {

            return;
        }

        let accountType = "";

        try {

            accountType =
                localStorage.getItem(
                    "web3jobs_pending_account_type"
                ) || "";

        } catch (error) {

            console.warn(
                "Unable to read account type:",
                error
            );

        }

        accountType =
            accountType
                .trim()
                .toLowerCase();

        if (
            accountType !== "company" &&
            accountType !== "individual"
        ) {

            accountType =
                "individual";
        }

        const {
            error: updateError
        } =
            await supabaseClient.auth.updateUser({

                data: {

                    account_type:
                        accountType

                }

            });

        if (updateError) {

            console.warn(
                "Unable to update GitHub account type:",
                updateError
            );

        }

        try {

            localStorage.removeItem(
                "web3jobs_pending_account_type"
            );

        } catch (error) {

            console.warn(
                "localStorage cleanup:",
                error
            );

        }

        showMessage(
            "GitHub account connected successfully.",
            "success"
        );

        setTimeout(
            function() {

                if (
                    accountType ===
                    "company"
                ) {

                    window.location.replace(
                        "company-dashboard.html"
                    );

                } else {

                    window.location.replace(
                        "dashboard.html"
                    );

                }

            },
            1000
        );

    } catch (error) {

        console.error(
            "OAuth callback error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to complete GitHub login.",
            "error"
        );

    }

}

/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        handleOAuthCallback();

    }
);

</script>

</body>

    </html>
