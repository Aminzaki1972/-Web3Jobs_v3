<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Web3Jobs</title>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: 0;
            padding: 14px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: .92;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>


<body>


<div class="auth-container">

    <div class="logo">
        Web3Jobs
    </div>

    <div class="subtitle">
        Create your account
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <form id="signup-form">


        <div class="form-group">

            <label for="full-name">
                Full Name
            </label>

            <input
                id="full-name"
                type="text"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="account-type">
                Account Type
            </label>

            <select
                id="account-type"
                required
            >

                <option value="">
                    Select account type
                </option>

                <option value="individual">
                    Individual
                </option>

                <option value="company">
                    Company
                </option>

            </select>

        </div>


        <button
            id="signup-button"
            type="submit"
        >
            Create Account
        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>

"use strict";


const SUPABASE_URL =
    "https://jqhemwskrnlycximjpag.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JZuODPmD72gqSauHBTGNYg_cbN7gVsp";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "signup-form"
    );


const button =
    document.getElementById(
        "signup-button"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            document
                .getElementById(
                    "full-name"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        const accountType =
            document
                .getElementById(
                    "account-type"
                )
                .value;


        if (!fullName) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (!accountType) {

            showMessage(
                "Please select your account type.",
                "error"
            );

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "Creating account...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email:

                        email,

                    password:

                        password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            account_type:
                                accountType

                        }

                    }

                });


            if (error) {

                throw error;
            }


            /*
             * If email confirmation is enabled,
             * Supabase will ask the user
             * to confirm their email.
             */

            showMessage(
                "Account created successfully. Please check your email if confirmation is required.",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                2000
            );


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>


</body>

</html>
