<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Web3Jobs account."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>إنشاء حساب | Web3Jobs</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #10263d 0%,
                    #06101d 48%,
                    #030912 100%
                );

            color: #f8fafc;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;
        }


        .register-wrapper {

            width: 100%;

            max-width: 480px;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 24px;
        }


        .brand a {

            color: #ffffff;

            text-decoration: none;

            font-size: 30px;

            font-weight: 900;

            letter-spacing: -1px;
        }


        .brand span {

            color: #6ee7b7;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .register-card {

            width: 100%;

            background:
                rgba(10, 24, 39, 0.94);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(14px);
        }


        .register-card h1 {

            margin: 0 0 8px;

            text-align: center;

            font-size: 28px;

            line-height: 1.2;
        }


        .subtitle {

            margin: 0 0 28px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           METHOD TITLE
        ===================================================== */

        .section-title {

            margin-bottom: 14px;

            font-size: 14px;

            font-weight: 800;

            color: #e2e8f0;
        }


        /* =====================================================
           WEB3 WALLET
        ===================================================== */

        .wallet-button {

            width: 100%;

            padding: 14px 18px;

            border: 1px solid
                rgba(110, 231, 183, 0.35);

            border-radius: 11px;

            background:
                rgba(110, 231, 183, 0.08);

            color: #6ee7b7;

            font-size: 15px;

            font-weight: 900;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease,
                border-color 0.2s ease;
        }


        .wallet-button:hover {

            background:
                rgba(110, 231, 183, 0.14);

            border-color:
                rgba(110, 231, 183, 0.60);

            transform: translateY(-1px);
        }


        .wallet-icon {

            margin-left: 7px;

            font-size: 18px;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255, 255, 255, 0.09);
        }


        .divider span {

            color: #64748b;

            font-size: 12px;

            white-space: nowrap;
        }


        /* =====================================================
           ACCOUNT TYPE
        ===================================================== */

        .account-type {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-bottom: 20px;
        }


        .account-option {

            position: relative;
        }


        .account-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .account-option label {

            display: block;

            padding: 14px;

            text-align: center;

            border: 1px solid #26384b;

            border-radius: 11px;

            background: #081522;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }


        .account-option input:checked + label {

            border-color: #6ee7b7;

            background:
                rgba(110, 231, 183, 0.10);

            color: #6ee7b7;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 17px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 700;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                1px solid #26384b;

            background: #081522;

            color: #ffffff;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input::placeholder {

            color: #64748b;
        }


        input:focus {

            border-color: #6ee7b7;

            box-shadow:
                0 0 0 3px
                rgba(110, 231, 183, 0.10);
        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-left: 60px;
        }


        .toggle-password {

            position: absolute;

            left: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            font-size: 12px;

            padding: 6px;
        }


        .toggle-password:hover {

            color: #ffffff;
        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        .create-button {

            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 14px 18px;

            background: #6ee7b7;

            color: #06101d;

            font-size: 15px;

            font-weight: 900;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .create-button:hover {

            transform: translateY(-1px);
        }


        .create-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .register-message {

            display: none;

            margin-bottom: 18px;

            padding: 13px 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        .login-link {

            margin-top: 24px;

            text-align: center;

            color: #94a3b8;

            font-size: 14px;
        }


        .login-link a {

            color: #6ee7b7;

            font-weight: 800;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           HOME
        ===================================================== */

        .back-home {

            margin-top: 18px;

            text-align: center;
        }


        .back-home a {

            color: #64748b;

            font-size: 13px;

            text-decoration: none;
        }


        .back-home a:hover {

            color: #cbd5e1;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 520px) {

            body {

                padding: 16px;
            }


            .register-card {

                padding: 24px 20px;
            }


            .brand a {

                font-size: 26px;
            }


            .register-card h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <main class="register-wrapper">


        <!-- BRAND -->

        <div class="brand">

            <a href="index.html">

                Web3<span>Jobs</span>

            </a>

        </div>


        <!-- CARD -->

        <section class="register-card">


            <h1>
                إنشاء حساب
            </h1>


            <p class="subtitle">
                أنشئ حسابك على Web3Jobs
            </p>


            <!-- =================================================
                 WEB3 WALLET
            ================================================== -->

            <div class="section-title">

                طريقة إنشاء الحساب

            </div>


            <button
                type="button"
                id="wallet-register-button"
                class="wallet-button"
            >

                <span class="wallet-icon">
                    🔗
                </span>

                إنشاء حساب بمحفظة Web3

            </button>


            <!-- DIVIDER -->

            <div class="divider">

                <span>
                    أو إنشاء حساب بالبريد الإلكتروني
                </span>

            </div>


            <!-- =================================================
                 ACCOUNT TYPE
            ================================================== -->

            <div class="section-title">

                نوع الحساب

            </div>


            <div class="account-type">


                <div class="account-option">

                    <input
                        type="radio"
                        id="account-individual"
                        name="account-type"
                        value="individual"
                        checked
                    >

                    <label
                        for="account-individual"
                    >
                        👤 فرد
                    </label>

                </div>


                <div class="account-option">

                    <input
                        type="radio"
                        id="account-company"
                        name="account-type"
                        value="company"
                    >

                    <label
                        for="account-company"
                    >
                        🏢 شركة
                    </label>

                </div>


            </div>


            <!-- MESSAGE -->

            <div
                id="register-message"
                class="register-message"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 EMAIL REGISTRATION
            ================================================== -->

            <form
                id="register-form"
                novalidate
            >


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="full-name">
                        الاسم الكامل
                    </label>


                    <input
                        id="full-name"
                        name="full_name"
                        type="text"
                        autocomplete="name"
                        placeholder="أدخل الاسم الكامل"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>


                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        كلمة السر
                    </label>


                    <div class="password-wrapper">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="أدخل كلمة السر"
                            required
                        >


                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                        >
                            إظهار
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm-password">
                        تأكيد كلمة السر
                    </label>


                    <div class="password-wrapper">

                        <input
                            id="confirm-password"
                            name="confirm_password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="أعد إدخال كلمة السر"
                            required
                        >


                        <button
                            type="button"
                            id="toggle-confirm-password"
                            class="toggle-password"
                        >
                            إظهار
                        </button>

                    </div>

                </div>


                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    id="create-account-button"
                    class="create-button"
                >
                    إنشاء الحساب
                </button>


            </form>


            <!-- LOGIN -->

            <div class="login-link">

                لديك حساب بالفعل؟

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </div>


            <!-- HOME -->

            <div class="back-home">

                <a href="index.html">
                    ← العودة إلى وظائف Web3
                </a>

            </div>


        </section>


    </main>


    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const form =
                    document.getElementById(
                        "register-form"
                    );


                const fullName =
                    document.getElementById(
                        "full-name"
                    );


                const email =
                    document.getElementById(
                        "email"
                    );


                const password =
                    document.getElementById(
                        "password"
                    );


                const confirmPassword =
                    document.getElementById(
                        "confirm-password"
                    );


                const createButton =
                    document.getElementById(
                        "create-account-button"
                    );


                const walletButton =
                    document.getElementById(
                        "wallet-register-button"
                    );


                const message =
                    document.getElementById(
                        "register-message"
                    );


                const togglePassword =
                    document.getElementById(
                        "toggle-password"
                    );


                const toggleConfirmPassword =
                    document.getElementById(
                        "toggle-confirm-password"
                    );


                /* =================================================
                   MESSAGE
                ================================================== */

                function showMessage(
                    text,
                    type = "error"
                ) {

                    if (!message) {
                        return;
                    }


                    message.textContent =
                        text;


                    message.style.display =
                        "block";


                    if (type === "success") {

                        message.style.background =
                            "rgba(34,197,94,0.10)";

                        message.style.border =
                            "1px solid rgba(34,197,94,0.25)";

                        message.style.color =
                            "#bbf7d0";

                    } else {

                        message.style.background =
                            "rgba(239,68,68,0.10)";

                        message.style.border =
                            "1px solid rgba(239,68,68,0.25)";

                        message.style.color =
                            "#fecaca";
                    }

                }


                /* =================================================
                   PASSWORD TOGGLE
                ================================================== */

                function setupPasswordToggle(
                    button,
                    input
                ) {

                    if (
                        !button ||
                        !input
                    ) {

                        return;
                    }


                    button.addEventListener(
                        "click",
                        function () {

                            const hidden =
                                input.type ===
                                "password";


                            input.type =
                                hidden
                                    ? "text"
                                    : "password";


                            button.textContent =
                                hidden
                                    ? "إخفاء"
                                    : "إظهار";

                        }
                    );

                }


                setupPasswordToggle(
                    togglePassword,
                    password
                );


                setupPasswordToggle(
                    toggleConfirmPassword,
                    confirmPassword
                );


                /* =================================================
                   WEB3 WALLET

                   TEMPORARILY UI ONLY.

                   We will connect this to MetaMask/Web3
                   in a separate step.
                ================================================== */

                if (walletButton) {

                    walletButton.addEventListener(
                        "click",
                        function () {

                            showMessage(
                                "سيتم تفعيل إنشاء الحساب بالمحفظة في الخطوة التالية.",
                                "info"
                            );

                        }
                    );

                }


                /* =================================================
                   EMAIL REGISTRATION

                   TEMPORARILY VALIDATION ONLY.

                   Supabase registration will be connected
                   after we verify this page first.
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        function (event) {

                            event.preventDefault();


                            if (
                                !fullName.value.trim()
                            ) {

                                showMessage(
                                    "يرجى إدخال الاسم الكامل."
                                );

                                fullName.focus();

                                return;
                            }


                            if (
                                !email.value.trim()
                            ) {

                                showMessage(
                                    "يرجى إدخال البريد الإلكتروني."
                                );

                                email.focus();

                                return;
                            }


                            if (
                                !password.value
                            ) {

                                showMessage(
                                    "يرجى إدخال كلمة السر."
                                );

                                password.focus();

                                return;
                            }


                            if (
                                password.value.length < 6
                            ) {

                                showMessage(
                                    "كلمة السر يجب أن تحتوي على 6 أحرف على الأقل."
                                );

                                password.focus();

                                return;
                            }


                            if (
                                password.value !==
                                confirmPassword.value
                            ) {

                                showMessage(
                                    "كلمتا السر غير متطابقتين."
                                );

                                confirmPassword.focus();

                                return;
                            }


                            const selectedType =
                                document.querySelector(
                                    'input[name="account-type"]:checked'
                                );


                            if (!selectedType) {

                                showMessage(
                                    "يرجى اختيار نوع الحساب."
                                );

                                return;
                            }


                            /*
                             * لا يتم إنشاء الحساب فعليًا الآن.
                             *
                             * سنربط Supabase في الخطوة التالية
                             * بعد التأكد أن واجهة التسجيل تعمل.
                             */

                            showMessage(
                                "تم التحقق من البيانات. سيتم ربط إنشاء الحساب بقاعدة البيانات في الخطوة التالية.",
                                "success"
                            );


                            console.log(
                                "Registration data:",
                                {
                                    accountType:
                                        selectedType.value,

                                    fullName:
                                        fullName.value.trim(),

                                    email:
                                        email.value.trim()
                                }
                            );

                        }
                    );

                }

            }
        );

    </script>


</body>

                        </html>
