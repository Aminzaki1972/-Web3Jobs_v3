<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Web3Jobs Login - Sign in to your Web3Jobs account."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>
        Login | Web3Jobs
    </title>


    <!-- =====================================================
         STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >


    <style>

        .auth-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

        }


        .auth-container {

            width: 100%;

            max-width: 460px;

        }


        .auth-card {

            background: rgba(10, 25, 42, 0.95);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);

        }


        .auth-header {

            text-align: center;

            margin-bottom: 28px;

        }


        .auth-header h1 {

            margin: 0 0 10px;

        }


        .auth-header p {

            margin: 0;

            opacity: 0.75;

        }


        .auth-message {

            margin-bottom: 20px;

        }


        .auth-message-box {

            padding: 13px 15px;

            border-radius: 10px;

            line-height: 1.6;

        }


        .auth-message-error {

            background: rgba(239,68,68,0.12);

            border: 1px solid rgba(239,68,68,0.25);

        }


        .auth-message-success {

            background: rgba(110,231,183,0.10);

            border: 1px solid rgba(110,231,183,0.25);

        }


        .auth-message-info {

            background: rgba(59,130,246,0.10);

            border: 1px solid rgba(59,130,246,0.25);

        }


        .wallet-section {

            margin-bottom: 24px;

        }


        .wallet-button {

            width: 100%;

            padding: 14px 18px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            background: transparent;

            color: inherit;

            font-weight: 800;

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                opacity 0.2s ease;

        }


        .wallet-button:hover {

            border-color: #6ee7b7;

        }


        .wallet-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .auth-divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            opacity: 0.65;

        }


        .auth-divider::before,

        .auth-divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background: rgba(255,255,255,0.12);

        }


        .auth-divider span {

            font-size: 13px;

        }


        .auth-form-group {

            margin-bottom: 18px;

        }


        .auth-form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;

        }


        .auth-form-group input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.04);

            color: inherit;

            outline: none;

        }


        .auth-form-group input:focus {

            border-color: #6ee7b7;

        }


        .auth-submit {

            width: 100%;

            padding: 13px 18px;

            border: 0;

            border-radius: 10px;

            background: #6ee7b7;

            color: #06101d;

            font-weight: 800;

            cursor: pointer;

            transition: opacity 0.2s ease;

        }


        .auth-submit:hover {

            opacity: 0.9;

        }


        .auth-submit:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .forgot-password {

            display: block;

            margin-top: 16px;

            text-align: center;

            color: #6ee7b7;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

        }


        .forgot-password:hover {

            text-decoration: underline;

        }


        .reset-panel {

            display: none;

            margin-top: 22px;

            padding: 20px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.08);

            background: rgba(255,255,255,0.025);

        }


        .reset-panel h3 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        .reset-panel p {

            margin-top: 0;

            margin-bottom: 18px;

            opacity: 0.75;

            font-size: 14px;

            line-height: 1.6;

        }


        .reset-submit {

            width: 100%;

            padding: 12px 16px;

            border: 0;

            border-radius: 10px;

            background: #6ee7b7;

            color: #06101d;

            font-weight: 800;

            cursor: pointer;

        }


        .reset-submit:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .reset-close {

            width: 100%;

            margin-top: 10px;

            padding: 10px;

            border: 0;

            background: transparent;

            color: inherit;

            opacity: 0.7;

            cursor: pointer;

        }


        .loading-state {

            display: none;

            text-align: center;

            margin-top: 14px;

            font-size: 14px;

            opacity: 0.75;

        }


        .auth-footer {

            text-align: center;

            margin-top: 24px;

            opacity: 0.8;

            font-size: 14px;

        }


        .auth-footer a {

            color: #6ee7b7;

            text-decoration: none;

            font-weight: 700;

        }


        .auth-footer a:hover {

            text-decoration: underline;

        }


        .back-home {

            display: inline-block;

            margin-bottom: 20px;

            color: #6ee7b7;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <main class="auth-page">

        <div class="auth-container">


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Web3Jobs
            </a>


            <section class="auth-card">


                <!-- =================================================
                     HEADER
                ================================================== -->

                <div class="auth-header">

                    <h1>
                        Login
                    </h1>

                    <p>
                        Sign in to your Web3Jobs account
                    </p>

                </div>


                <!-- =================================================
                     AUTH MESSAGE
                ================================================== -->

                <div
                    id="auth-message"
                    class="auth-message"
                    style="display:none;"
                ></div>


                <!-- =================================================
                     WALLET LOGIN
                ================================================== -->

                <div class="wallet-section">

                    <button
                        type="button"
                        id="wallet-login-button"
                        class="wallet-button"
                    >
                        Connect Wallet
                    </button>

                </div>


                <!-- =================================================
                     DIVIDER
                ================================================== -->

                <div class="auth-divider">

                    <span>
                        OR
                    </span>

                </div>


                <!-- =================================================
                     EMAIL LOGIN
                ================================================== -->

                <form
                    id="login-form"
                    novalidate
                >


                    <div class="auth-form-group">

                        <label
                            for="email"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="auth-form-group">

                        <label
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        id="login-button"
                        class="auth-submit"
                        type="submit"
                    >
                        Login
                    </button>


                    <div
                        id="login-loading"
                        class="loading-state"
                    >
                        Signing in...
                    </div>


                </form>


                <!-- =================================================
                     FORGOT PASSWORD
                ================================================== -->

                <a
                    href="#"
                    id="forgot-password"
                    class="forgot-password"
                >
                    Forgot your password?
                </a>


                <!-- =================================================
                     PASSWORD RESET PANEL
                ================================================== -->

                <div
                    id="reset-panel"
                    class="reset-panel"
                >

                    <h3>
                        Reset Password
                    </h3>

                    <p>
                        Enter your account email and we will send you
                        a password reset link.
                    </p>


                    <div class="auth-form-group">

                        <label
                            for="reset-email"
                        >
                            Email
                        </label>

                        <input
                            id="reset-email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                        >

                    </div>


                    <button
                        type="button"
                        id="reset-submit"
                        class="reset-submit"
                    >
                        Send Reset Link
                    </button>


                    <button
                        type="button"
                        id="reset-close"
                        class="reset-close"
                    >
                        Cancel
                    </button>

                </div>


                <!-- =================================================
                     FOOTER
                ================================================== -->

                <div class="auth-footer">

                    Don't have an account?

                    <a
                        href="signup.html"
                    >
                        Create one
                    </a>

                </div>


            </section>

        </div>

    </main>


    <!-- =====================================================
         SUPABASE LIBRARY
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         UNIFIED SUPABASE CLIENT
    ====================================================== -->

    <script
        src="js/supabase.js?v=20260817"
    ></script>


    <!-- =====================================================
         UNIFIED AUTHENTICATION
    ====================================================== -->

    <script
        src="js/auth.js?v=20260817"
    ></script>


    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <script>

        "use strict";


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTS
                ================================================== */

                const form =
                    document.getElementById(
                        "login-form"
                    );


                const emailInput =
                    document.getElementById(
                        "email"
                    );


                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                const loginButton =
                    document.getElementById(
                        "login-button"
                    );


                const loading =
                    document.getElementById(
                        "login-loading"
                    );


                const walletButton =
                    document.getElementById(
                        "wallet-login-button"
                    );


                const forgotPassword =
                    document.getElementById(
                        "forgot-password"
                    );


                const resetPanel =
                    document.getElementById(
                        "reset-panel"
                    );


                const resetEmail =
                    document.getElementById(
                        "reset-email"
                    );


                const resetSubmit =
                    document.getElementById(
                        "reset-submit"
                    );


                const resetClose =
                    document.getElementById(
                        "reset-close"
                    );


                /* =================================================
                   EMAIL LOGIN
                ================================================== */

                if (form) {

                    form.addEventListener(
                        "submit",
                        async function (event) {

                            event.preventDefault();


                            if (
                                !window.Web3JobsAuth ||
                                typeof window.Web3JobsAuth.login !==
                                    "function"
                            ) {

                                window.Web3JobsAuth?.showMessage?.(
                                    "تعذر تحميل نظام تسجيل الدخول.",
                                    "Authentication system is unavailable.",
                                    "error"
                                );

                                return;

                            }


                            const email =
                                emailInput
                                    ?.value
                                    ?.trim();


                            const password =
                                passwordInput
                                    ?.value ||
                                "";


                            if (
                                !email ||
                                !password
                            ) {

                                window.Web3JobsAuth.showMessage(
                                    "يرجى إدخال البريد الإلكتروني وكلمة السر.",
                                    "Please enter your email and password.",
                                    "error"
                                );

                                return;

                            }


                            loginButton.disabled =
                                true;


                            if (loading) {

                                loading.style.display =
                                    "block";

                            }


                            try {

                                const result =
                                    await window.Web3JobsAuth.login(
                                        email,
                                        password
                                    );


                                console.log(
                                    "Web3Jobs Login Result:",
                                    result
                                );


                                if (
                                    !result ||
                                    !result.success
                                ) {

                                    return;

                                }


                                if (
                                    result.dashboardUrl
                                ) {

                                    window.location.replace(
                                        result.dashboardUrl
                                    );

                                } else {

                                    window.location.replace(
                                        "index.html"
                                    );

                                }


                            } catch (error) {

                                console.error(
                                    "Web3Jobs login page error:",
                                    error
                                );


                                window.Web3JobsAuth?.showError?.(
                                    error
                                );

                            } finally {

                                loginButton.disabled =
                                    false;


                                if (loading) {

                                    loading.style.display =
                                        "none";

                                }

                            }

                        }
                    );

                }


                /* =================================================
                   FORGOT PASSWORD
                ================================================== */

                if (forgotPassword) {

                    forgotPassword.addEventListener(
                        "click",
                        function (event) {

                            event.preventDefault();


                            if (!resetPanel) {
                                return;
                            }


                            resetPanel.style.display =
                                "block";


                            const currentEmail =
                                emailInput
                                    ?.value
                                    ?.trim();


                            if (
                                currentEmail &&
                                resetEmail
                            ) {

                                resetEmail.value =
                                    currentEmail;

                            }


                            resetEmail?.focus();

                        }
                    );

                }


                /* =================================================
                   CLOSE RESET PANEL
                ================================================== */

                if (resetClose) {

                    resetClose.addEventListener(
                        "click",
                        function () {

                            resetPanel.style.display =
                                "none";

                        }
                    );

                }


                /* =================================================
                   SEND RESET EMAIL
                ================================================== */

                if (resetSubmit) {

                    resetSubmit.addEventListener(
                        "click",
                        async function () {

                            const email =
                                resetEmail
                                    ?.value
                                    ?.trim();


                            if (!email) {

                                window.Web3JobsAuth?.showMessage?.(
                                    "يرجى إدخال البريد الإلكتروني.",
                                    "Please enter your email address.",
                                    "error"
                                );

                                resetEmail?.focus();

                                return;

                            }


                            if (
                                !window.Web3JobsAuth ||
                                typeof window.Web3JobsAuth.resetPassword !==
                                    "function"
                            ) {

                                window.Web3JobsAuth?.showMessage?.(
                                    "تعذر تحميل نظام إعادة تعيين كلمة السر.",
                                    "Password reset system is unavailable.",
                                    "error"
                                );

                                return;

                            }


                            resetSubmit.disabled =
                                true;


                            try {

                                const success =
                                    await window.Web3JobsAuth.resetPassword(
                                        email
                                    );


                                if (success) {

                                    resetPanel.style.display =
                                        "none";

                                }

                            } finally {

                                resetSubmit.disabled =
                                    false;

                            }

                        }
                    );

                }


                /* =================================================
                   WALLET LOGIN
                   
                   IMPORTANT:
                   This remains separate from email login.
                ================================================== */

                if (walletButton) {

                    walletButton.addEventListener(
                        "click",
                        async function () {

                            if (
                                typeof window.ethereum ===
                                "undefined"
                            ) {

                                window.Web3JobsAuth?.showMessage?.(
                                    "يرجى تثبيت MetaMask أولاً.",
                                    "Please install MetaMask first.",
                                    "error"
                                );

                                return;

                            }


                            try {
