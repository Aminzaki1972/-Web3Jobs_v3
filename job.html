<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Web3Jobs - Job Details"
    >

    <title>Job Details - Web3Jobs</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .job-details-page {
            min-height: 100vh;
            padding: 90px 20px 80px;
        }

        .job-details-container {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            color: #818cf8;
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            opacity: .8;
        }

        .job-details-card {
            padding: 40px;
            border-radius: 22px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.10);
            box-shadow: 0 25px 70px rgba(0,0,0,.18);
        }

        .job-details-card h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 46px);
            line-height: 1.2;
        }

        .job-company {
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 700;
            opacity: .75;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .job-meta span {
            display: inline-flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 9px;
            background: rgba(255,255,255,.07);
            font-size: 14px;
        }

        .job-source {
            margin-bottom: 30px;
            padding: 12px 15px;
            border-radius: 10px;
            background: rgba(99,102,241,.10);
            font-size: 14px;
        }

        .job-description {
            line-height: 1.8;
            font-size: 16px;
            opacity: .88;
            overflow-wrap: anywhere;
        }

        .job-description h1,
        .job-description h2,
        .job-description h3 {
            margin-top: 30px;
        }

        .job-description p {
            margin: 0 0 18px;
        }

        .job-description ul,
        .job-description ol {
            padding-left: 25px;
        }

        .job-description a {
            color: #818cf8;
        }

        .job-apply-area {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .apply-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 55px;
            padding: 0 25px;
            border: 0;
            border-radius: 12px;
            background: #6366f1;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .apply-button:hover {
            filter: brightness(1.1);
        }

        .loading-box,
        .error-box {
            padding: 60px 25px;
            text-align: center;
            border-radius: 20px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.10);
        }

        .error-box h2 {
            margin-top: 0;
        }

        .error-box p {
            opacity: .75;
            line-height: 1.7;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {

            .job-details-page {
                padding: 60px 12px;
            }

            .job-details-card {
                padding: 25px 20px;
            }

            .job-details-card h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                Web3Jobs
            </a>

            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a
                    href="jobs.html"
                    class="active"
                >
                    Jobs
                </a>

                <a href="companies.html">
                    Companies
                </a>

                <a href="roadmap.html">
                    Roadmap
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="job-details-page">

        <div class="job-details-container">

            <a
                href="jobs.html"
                class="back-link"
            >
                ← Back to Jobs
            </a>


            <div
                id="job-loading"
                class="loading-box"
            >

                <p>
                    Loading job details...
                </p>

            </div>


            <div
                id="job-error"
                class="error-box hidden"
            >

                <h2>
                    Job Not Found
                </h2>

                <p id="job-error-message">
                    We could not find this job.
                </p>

                <a
                    href="jobs.html"
                    class="apply-button"
                >
                    Browse Jobs
                </a>

            </div>


            <article
                id="job-details-card"
                class="job-details-card hidden"
            >

                <h1 id="job-title">
                    Job Title
                </h1>


                <div
                    id="job-company"
                    class="job-company"
                >
                    Company
                </div>


                <div
                    id="job-meta"
                    class="job-meta"
                ></div>


                <div
                    id="job-source"
                    class="job-source hidden"
                ></div>


                <div
                    id="job-description"
                    class="job-description"
                ></div>


                <div
                    id="job-apply-area"
                    class="job-apply-area"
                >

                    <a
                        id="job-apply-button"
                        class="apply-button"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Apply Now
                    </a>

                </div>

            </article>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Web3Jobs. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="js/supabase.js"></script>


    <!-- =====================================================
         JOB DETAILS SYSTEM
         ===================================================== -->

    <script>

        "use strict";


        /*
         * -----------------------------------------------------
         * Helpers
         * -----------------------------------------------------
         */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function formatDate(value) {

            if (!value) {
                return "";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
        }


        /*
         * -----------------------------------------------------
         * Elements
         * -----------------------------------------------------
         */

        const loadingElement =
            document.getElementById(
                "job-loading"
            );

        const errorElement =
            document.getElementById(
                "job-error"
            );

        const errorMessageElement =
            document.getElementById(
                "job-error-message"
            );

        const detailsElement =
            document.getElementById(
                "job-details-card"
            );

        const titleElement =
            document.getElementById(
                "job-title"
            );

        const companyElement =
            document.getElementById(
                "job-company"
            );

        const metaElement =
            document.getElementById(
                "job-meta"
            );

        const sourceElement =
            document.getElementById(
                "job-source"
            );

        const descriptionElement =
            document.getElementById(
                "job-description"
            );

        const applyButton =
            document.getElementById(
                "job-apply-button"
            );


        /*
         * -----------------------------------------------------
         * Show error
         * -----------------------------------------------------
         */

        function showError(message) {

            loadingElement.classList.add(
                "hidden"
            );

            detailsElement.classList.add(
                "hidden"
            );

            errorElement.classList.remove(
                "hidden"
            );

            errorMessageElement.textContent =
                message ||
                "We could not find this job.";
        }


        /*
         * -----------------------------------------------------
         * Render job
         * -----------------------------------------------------
         */

        function renderJob(job) {

            loadingElement.classList.add(
                "hidden"
            );

            errorElement.classList.add(
                "hidden"
            );

            detailsElement.classList.remove(
                "hidden"
            );


            titleElement.textContent =
                job.title ||
                "Untitled Job";


            companyElement.textContent =
                job.company ||
                job.company_name ||
                "Company";


            metaElement.innerHTML = "";


            if (job.location) {

                metaElement.innerHTML +=
                    `<span>📍 ${escapeHtml(job.location)}</span>`;
            }


            if (job.type) {

                metaElement.innerHTML +=
                    `<span>💼 ${escapeHtml(job.type)}</span>`;
            }


            if (job.published_at) {

                metaElement.innerHTML +=
                    `<span>📅 Published ${escapeHtml(
                        formatDate(job.published_at)
                    )}</span>`;
            }


            if (job.updated_at) {

                metaElement.innerHTML +=
                    `<span>🔄 Updated ${escapeHtml(
                        formatDate(job.updated_at)
                    )}</span>`;
            }


            /*
             * Source
             */

            if (job.source) {

                let sourceText =
                    "Source: " +
                    job.source;

                if (job.source_job_id) {

                    sourceText +=
                        " • Job ID: " +
                        job.source_job_id;
                }

                sourceElement.textContent =
                    sourceText;

                sourceElement.classList.remove(
                    "hidden"
                );

            } else {

                sourceElement.classList.add(
                    "hidden"
                );
            }


            /*
             * Description
             */

            if (job.description) {

                descriptionElement.innerHTML =
                    job.description;

            } else {

                descriptionElement.innerHTML =
                    "<p>Job description is not available.</p>";
            }


            /*
             * Apply URL
             */

            const applyUrl =
                job.apply_link ||
                job.application_url ||
                job.source_url;


            if (applyUrl) {

                applyButton.href =
                    applyUrl;

                applyButton.classList.remove(
                    "hidden"
                );

            } else {

                applyButton.classList.add(
                    "hidden"
                );
            }


            document.title =
                (job.title || "Job Details") +
                " - " +
                (job.company || "Web3Jobs");
        }


        /*
         * -----------------------------------------------------
         * Load job
         * -----------------------------------------------------
         */

        async function loadJob() {

            try {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const jobId =
                    params.get("id");


                if (!jobId) {

                    showError(
                        "No job ID was provided."
                    );

                    return;
                }


                /*
                 * Make sure the unified Supabase
                 * client exists.
                 */

                if (
                    typeof window.supabaseClient ===
                    "undefined" ||
                    !window.supabaseClient
                ) {

                    showError(
                        "Supabase is not initialized."
                    );

                    return;
                }


                const {
                    data,
                    error
                } =
                    await window.supabaseClient
                        .from("jobs")
                        .select("*")
                        .eq("id", jobId)
                        .maybeSingle();


                if (error) {

                    console.error(
                        "Job loading error:",
                        error
                    );

                    showError(
                        "Unable to load the job from the database."
                    );

                    return;
                }


                if (!data) {

                    showError(
                        "This job does not exist or is no longer available."
                    );

                    return;
                }


                renderJob(data);

            } catch (error) {

                console.error(
                    "Unexpected job error:",
                    error
                );

                showError(
                    "An unexpected error occurred while loading this job."
                );
            }
        }


        /*
         * -----------------------------------------------------
         * Start
         * -----------------------------------------------------
         */

        document.addEventListener(
            "DOMContentLoaded",
            loadJob
        );

    </script>

</body>

              </html>
