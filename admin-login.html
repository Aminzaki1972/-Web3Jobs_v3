<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Web3Jobs Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #10233f,
                    #050b14 60%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-box {
            width: min(420px, 92%);

            padding: 35px;

            border-radius: 20px;

            background: rgba(10, 20, 35, .96);

            border: 1px solid #263f60;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .5);
        }

        .logo {
            text-align: center;

            font-size: 26px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #3b82f6;
        }

        .subtitle {
            text-align: center;

            color: #8fa4bd;

            font-size: 14px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            border: 1px solid #29415f;

            outline: none;

            background: #07111e;

            color: #ffffff;

            font-size: 15px;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: #2563eb;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .6;

            cursor: not-allowed;
        }

        #message {
            min-height: 22px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
        }

        .security {
            margin-top: 25px;

            text-align: center;

            color: #60758e;

            font-size: 11px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Web3<span>Jobs</span>
    </div>

    <div class="subtitle">
        Administrator Access
    </div>

    <form id="adminLoginForm">

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Secure Login
        </button>

    </form>

    <div id="message"></div>

    <div class="security">
        Restricted administrator area
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4.4"></script>

<script src="js/supabase.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
