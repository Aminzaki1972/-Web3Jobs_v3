     AUTHENTICATION SYSTEM
========================================================= -->

<script
    src="js/auth.js"
></script>


<!-- =========================================================
     COMPANY DASHBOARD
========================================================= -->

<script
    src="js/company-dashboard.js"
></script>


<script>

"use strict";


/* =========================================================
   COMPANY DASHBOARD AUTH CHECK
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        console.log(
            "Web3Jobs: Starting company dashboard authentication..."
        );


        try {

            if (
                !window.Web3JobsAuth ||
                typeof window.Web3JobsAuth.protectCompanyDashboard !==
                "function"
            ) {

                console.error(
                    "Web3Jobs: Authentication system is not available."
                );

                window.location.replace(
                    "login.html"
                );

                return;
            }


            const result =
                await window.Web3JobsAuth
                    .protectCompanyDashboard();


            console.log(
                "Web3Jobs: Company dashboard auth result:",
                result
            );


            if (
                !result ||
                result.authenticated !== true
            ) {

                console.error(
                    "Web3Jobs: Company authentication failed."
                );

                return;
            }


            if (
                result.accountType !==
                "company"
            ) {

                console.error(
                    "Web3Jobs: Account is not a company.",
                    result.accountType
                );


                window.location.replace(
                    window.Web3JobsAuth
                        .getDashboardUrl(
                            result.accountType
                        )
                );


                return;
            }


            console.log(
                "Web3Jobs: Company dashboard authentication successful."
            );


            console.log(
                "Web3Jobs: Company user:",
                result.user
            );


            console.log(
                "Web3Jobs: Company account type:",
                result.accountType
            );


            /* =================================================
               DISPLAY COMPANY DATA
               ================================================= */

            const emailElement =
                document.getElementById(
                    "company-email"
                );


            if (
                emailElement &&
                result.user
            ) {

                emailElement.textContent =
                    result.user.email || "";
            }


            const nameElement =
                document.getElementById(
                    "company-name"
                );


            if (
                nameElement &&
                result.user
            ) {

                const metadata =
                    result.user.user_metadata || {};


                const companyName =
                    metadata.full_name ||
                    metadata.name ||
                    "Company";


                nameElement.textContent =
                    companyName;
            }

        } catch (error) {

            console.error(
                "Web3Jobs: Company dashboard authentication error:",
                error
            );


            window.location.replace(
                "login.html"
            );
        }

    }
);

</script>
