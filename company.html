<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Company profile and active jobs on Web3Jobs.">
<title>Company Jobs | Web3Jobs</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
.company-page{min-height:100vh;padding-bottom:70px}.company-hero{width:min(1150px,calc(100% - 40px));margin:70px auto 35px;padding:42px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(255,255,255,.05)}.company-hero h1{margin:0 0 10px;font-size:clamp(34px,5vw,58px)}.company-hero p{margin:8px 0;opacity:.75}.company-badge{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(99,102,241,.15);color:#a5b4fc;font-weight:700;font-size:12px}.company-jobs-section{width:min(1150px,calc(100% - 40px));margin:auto}.company-job-card{display:flex;justify-content:space-between;gap:20px;padding:24px;margin-bottom:14px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.045)}.company-job-card h3{margin:10px 0 7px;font-size:20px}.company-job-card p{margin:0;opacity:.7}.company-job-tag{display:inline-block;margin-right:6px;padding:5px 8px;border-radius:999px;background:rgba(99,102,241,.12);font-size:11px;font-weight:700}.company-job-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}.company-job-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:10px;background:#6366f1;color:#fff;text-decoration:none;font-weight:700}.company-job-button.secondary{background:rgba(255,255,255,.08)}.company-empty{padding:55px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.04)}.company-empty a{display:inline-block;margin-top:15px;color:#a5b4fc}@media(max-width:650px){.company-hero,.company-jobs-section{width:calc(100% - 24px)}.company-hero{padding:26px}.company-job-card{flex-direction:column}.company-job-actions{width:100%}.company-job-button{flex:1}}
</style>
</head>
<body>
<header class="site-header"><div class="container"><a href="index.html" class="logo">Web3Jobs</a><nav class="main-nav"><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="companies.html" class="active">Companies</a><a href="roadmap.html">Roadmap</a><a href="login.html">Login</a></nav></div></header>
<main class="company-page">
<section class="company-hero"><span class="company-badge">Web3Jobs API Partner</span><h1 id="company-name">Loading company...</h1><p id="company-job-count">Loading jobs...</p><p id="company-location">Loading location...</p></section>
<section class="company-jobs-section"><div id="company-jobs"><div class="company-empty"><h2>Loading active jobs...</h2></div></div></section>
</main>
<footer class="site-footer"><div class="container"><p>© 2026 Web3Jobs. All rights reserved.</p></div></footer>
<script src="js/supabase.js"></script>
<script src="js/company-public.js"></script>
</body>
</html>
