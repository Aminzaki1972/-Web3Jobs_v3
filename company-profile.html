<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Edit Company Profile | Web3Jobs</title><style>body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#10263d,#06101d 48%,#030912);color:#f8fafc;padding:24px}*{box-sizing:border-box}.wrap{max-width:760px;margin:40px auto}.brand{text-align:center;margin-bottom:24px}.brand a{color:#fff;text-decoration:none;font-size:30px;font-weight:900}.brand span{color:#6ee7b7}.card{background:rgba(10,24,39,.94);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:32px}h1{text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:#94a3b8;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.group{margin-bottom:16px}.full{grid-column:1/-1}label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}input,textarea{width:100%;padding:13px 14px;border:1px solid #26384b;border-radius:10px;background:#081522;color:#fff;font-size:15px}textarea{min-height:140px;resize:vertical}.actions{display:flex;gap:12px}.button{flex:1;padding:14px;border-radius:10px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none}.save{border:0;background:#6ee7b7;color:#06101d}.back{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.1)}.message{display:none;margin-bottom:18px;padding:13px;border-radius:10px;font-size:13px}.loading{text-align:center;color:#94a3b8;padding:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{flex-direction:column}}</style></head><body><main class="wrap"><div class="brand"><a href="index.html">Web3<span>Jobs</span></a></div><section class="card"><h1>Edit Company Profile</h1><p class="subtitle">Update your company's public information on Web3Jobs.</p><div id="message" class="message"></div><div id="loading" class="loading">Loading company profile...</div><form id="companyProfileForm" style="display:none"><div class="grid"><div class="group"><label for="company_name">Company Name</label><input id="company_name" maxlength="120" required></div><div class="group"><label for="industry">Industry</label><input id="industry" maxlength="100"></div><div class="group"><label for="website">Website</label><input id="website" type="url" maxlength="500"></div><div class="group"><label for="location">Location</label><input id="location" maxlength="150"></div><div class="group full"><label for="logo_url">Company Logo URL</label><input id="logo_url" type="url" maxlength="1000"></div><div class="group full"><label for="description">Company Description</label><textarea id="description" maxlength="3000"></textarea></div><div class="group full"><label for="wallet_address">Wallet Address</label><input id="wallet_address" readonly></div></div><div class="actions"><button id="saveButton" class="button save" type="submit">Save Company Profile</button><a class="button back" href="company-dashboard.html">Back to Dashboard</a></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/company-profile.js"></script></body></html>
