<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Edit your Web3Jobs company profile.">
<meta name="theme-color" content="#06101d">
<title>Company Profile | Web3Jobs</title>
<style>
:root{--bg:#050c16;--card:#0b1727;--border:#182d47;--text:#f5f8ff;--muted:#8ea3bc;--green:#6ee7b7;--red:#f87171}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:radial-gradient(circle at top,#10263d 0%,#06101d 48%,#030912 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.page{width:min(100%,760px);margin:auto}.brand{text-align:center;margin-bottom:22px}.brand a{color:#fff;text-decoration:none;font-size:28px;font-weight:900}.brand span{color:var(--green)}
.card{background:rgba(10,24,39,.96);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35)}h1{margin:0 0 7px;text-align:center;font-size:27px}.intro{margin:0 0 24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.message{display:none;margin-bottom:18px;padding:12px 14px;border-radius:10px;font-size:13px}.message.success{display:block;background:rgba(25,135,84,.15);border:1px solid rgba(25,135,84,.35);color:#86efac}.message.error{display:block;background:rgba(220,53,69,.15);border:1px solid rgba(220,53,69,.35);color:#fca5a5}.message.info{display:block;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:#93c5fd}
.logo{text-align:center;margin-bottom:24px}.logo-preview{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#13283d;border:2px solid rgba(110,231,183,.3);color:var(--green);font-size:30px}.logo-preview img{width:100%;height:100%;object-fit:cover}.hint{color:#64748b;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.group{display:flex;flex-direction:column;gap:7px}.group.full{grid-column:1/-1}label{font-size:12px;font-weight:750;color:#c5d2e2}input,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:#071321;color:var(--text);outline:none;font:inherit;font-size:12px}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(110,231,183,.1)}textarea{min-height:135px;resize:vertical;line-height:1.6}.readonly{opacity:.65}
.actions{display:flex;gap:10px;margin-top:22px}.button{flex:1;min-height:44px;border-radius:9px;padding:10px 16px;font-weight:850;cursor:pointer}.save{border:0;background:linear-gradient(135deg,#1c765a,#175a47);color:#fff}.back{border:1px solid var(--border);background:#0d1d31;color:var(--text)}button:disabled{opacity:.55;cursor:not-allowed}
.loading{text-align:center;padding:35px;color:var(--muted)}form{display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}.group.full{grid-column:auto}.card{padding:20px}.actions{flex-direction:column}h1{font-size:23px}}
</style>
</head>
<body>
<main class="page"><div class="brand"><a href="company-dashboard.html">Web3<span>Jobs</span></a></div>
<section class="card"><h1>Company Profile</h1><p class="intro">Update the public information that candidates see about your company.</p><div id="message" class="message"></div><div id="loading" class="loading">Loading company profile...</div>
<form id="company-profile-form"><div class="logo"><div id="logo-preview" class="logo-preview">C</div><div class="hint">Company logo preview</div></div>
<div class="grid"><div class="group"><label for="company-name">Company Name</label><input id="company-name" maxlength="150" required placeholder="Your company name"></div><div class="group"><label for="industry">Industry</label><input id="industry" maxlength="150" placeholder="Web3, DeFi, AI, Infrastructure..."></div><div class="group"><label for="location">Location</label><input id="location" maxlength="150" placeholder="Remote / London / Dubai..."></div><div class="group"><label for="website">Website</label><input id="website" type="url" maxlength="500" placeholder="https://yourcompany.com"></div><div class="group full"><label for="logo-url">Logo URL</label><input id="logo-url" type="url" maxlength="1000" placeholder="https://example.com/logo.png"></div><div class="group full"><label for="description">Company Description</label><textarea id="description" maxlength="3000" placeholder="Tell candidates about your company, mission and products..."></textarea></div><div class="group full"><label for="wallet-address">Company Wallet Address</label><input id="wallet-address" class="readonly" readonly placeholder="Wallet address"></div></div>
<div class="actions"><button type="button" id="back-button" class="button back">Back to Company Dashboard</button><button type="submit" id="save-button" class="button save">Save Company Profile</button></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/company-profile.js?v=20260819-2"></script>
<script src="js/company-ui-enhancements.js"></script>
</body></html>
