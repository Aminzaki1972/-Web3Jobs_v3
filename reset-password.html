<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Web3Jobs password."
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Reset Password - Web3Jobs</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #06101d;
            color: #ffffff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .reset-card {
            background: #0b1726;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .reset-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-logo a {
            color: #ffffff;
            text-decoration: none;
            font-size: 28px;
            font-weight: 700;
        }

        .reset-logo span {
            color: #3b82f6;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            height: 48px;

            box-sizing: border-box;

            padding: 0 48px 0 14px;

            border-radius: 10px;
            border: 1px solid #26364a;

            background: #07111e;
            color: #ffffff;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        input::placeholder {
            color: #64748b;
        }

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            font-size: 13px;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            height: 48px;

            border: 0;
            border-radius: 10px;

            background: #2563eb;
            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;

            background: rgba(34, 197, 94, 0.1);

            border: 1px solid rgba(34, 197, 94, 0.25);

            color: #86efac;
        }

        .message.error {
            display: block;

            background: rgba(239, 68, 68, 0.1);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #fca5a5;
        }

        .back-login {
            margin-top: 24px;

            text-align: center;
        }

        .back-login a {
            color: #60a5fa;

            text-decoration: none;

            font-size: 14px;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .password-rules {
            margin-top: 8px;

            color: #64748b;

            font-size: 12px;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {

            .reset-container {
                padding: 15px;
            }

            .reset-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>


<body>

    <main class="reset-container">

        <div class="reset-card">

            <!-- Logo -->
            <div class="reset-logo">

                <a href="index.html">
                    Web3<span>Jobs</span>
                </a>

            </div>


            <!-- Title -->
            <h1>
                Reset Password
            </h1>


            <p class="subtitle">
                Enter your new password below.
            </p>


            <!-- Reset Form -->
            <form
                id="resetPasswordForm"
                novalidate
            >

                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                    <div class="password-rules">
                        Password must be at least 6 characters.
                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="resetPasswordBtn"
                    class="submit-btn"
                >
                    Update Password
                </button>

            </form>


            <!-- Message -->
            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Back -->
            <div class="back-login">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Existing Web3Jobs Supabase configuration -->
    <script src="js/supabase.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const form =
                    document.getElementById(
                        "resetPasswordForm"
                    );

                const newPassword =
                    document.getElementById(
                        "newPassword"
                    );

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    );

                const button =
                    document.getElementById(
                        "resetPasswordBtn"
                    );

                const message =
                    document.getElementById(
                        "message"
                    );


                /*
                 * Get the existing Supabase client.
                 *
                 * We do NOT create another authentication system.
                 */

                function getSupabaseClient() {

                    if (
                        window.supabaseClient &&
                        window.supabaseClient.auth
                    ) {
                        return window.supabaseClient;
                    }


                    /*
                     * Some versions of supabase.js
                     * may expose the client under another name.
                     */

                    if (
                        window.supabase &&
                        window.supabase.auth &&
                        typeof window.supabase.auth.updateUser === "function"
                    ) {
                        return window.supabase;
                    }


                    return null;
                }


                const supabase =
                    getSupabaseClient();


                /*
                 * Display message
                 */

                function showMessage(
                    text,
                    type
                ) {

                    message.textContent = text;

                    message.className =
                        "message " + type;

                }


                /*
                 * Toggle password visibility
                 */

                document
                    .querySelectorAll(
                        ".toggle-password"
                    )
                    .forEach(
                        function (toggleButton) {

                            toggleButton.addEventListener(
                                "click",
                                function () {

                                    const targetId =
                                        this.dataset.target;

                                    const input =
                                        document.getElementById(
                                            targetId
                                        );

                                    if (
                                        input.type ===
                                        "password"
                                    ) {

                                        input.type =
                                            "text";

                                        this.textContent =
                                            "Hide";

                                    } else {

                                        input.type =
                                            "password";

                                        this.textContent =
                                            "Show";
                                    }

                                }
                            );

                        }
                    );


                /*
                 * Check Supabase client
                 */

                if (!supabase) {

                    showMessage(
                        "Authentication service is not available. Please refresh the page and try again.",
                        "error"
                    );

                    button.disabled = true;

                    return;
                }


                /*
                 * IMPORTANT:
                 *
                 * When the user arrives from the Supabase
                 * password-reset email, Supabase creates
                 * a recovery session.
                 *
                 * We listen for PASSWORD_RECOVERY to make
                 * sure the recovery flow is active.
                 */

                let recoverySession = false;


                const {
                    data: authListener
                } =
                    supabase.auth.onAuthStateChange(
                        async function (
                            event,
                            session
                        ) {

                            console.log(
                                "Auth event:",
                                event
                            );


                            if (
                                event ===
                                "PASSWORD_RECOVERY"
                            ) {

                                recoverySession =
                                    true;

                                console.log(
                                    "Password recovery session detected."
                                );

                            }

                        }
                    );


                /*
                 * Also check the current session.
                 */

                try {

                    const {
                        data
                    } =
                        await supabase.auth.getSession();


                    if (
                        data &&
                        data.session
                    ) {

                        recoverySession =
                            true;

                    }

                } catch (error) {

                    console.error(
                        "Session check error:",
                        error
                    );

                }


                /*
                 * Submit reset form
                 */

                form.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const password =
                            newPassword.value;

                        const confirmation =
                            confirmPassword.value;


                        /*
                         * Validate password
                         */

                        if (!password) {

                            showMessage(
                                "Please enter your new password.",
                                "error"
                            );

                            return;
                        }


                        if (
                            password.length < 6
                        ) {

                            showMessage(
                                "Password must be at least 6 characters.",
                                "error"
                            );

                            return;
                        }


                        /*
                         * Validate confirmation
                         */

                        if (!confirmation) {

                            showMessage(
                                "Please confirm your new password.",
                                "error"
                            );

                            return;
                        }


                        if (
                            password !==
                            confirmation
                        ) {

                            showMessage(
                                "Passwords do not match.",
                                "error"
                            );

                            return;
                        }


                        /*
                         * Disable button
                         */

                        button.disabled =
                            true;

                        button.textContent =
                            "Updating...";

                        message.className =
                            "message";

                        message.textContent =
                            "";


                        try {

                            /*
                             * Update password using
                             * Supabase Auth.
                             */

                            const {
                                data,
                                error
                            } =
                                await supabase.auth.updateUser(
                                    {
                                        password:
                                            password
                                    }
                                );


                            if (error) {

                                throw error;

                            }


                            console.log(
                                "Password updated successfully.",
                                data
                            );


                            showMessage(
                                "Your password has been updated successfully. You can now log in with your new password.",
                                "success"
                            );


                            /*
                             * Clear password fields
                             */

                            newPassword.value =
                                "";

                            confirmPassword.value =
                                "";


                            /*
                             * Give the user time to read
                             * the success message, then go
                             * back to login.
                             */

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "login.html";

                                },
                                2500
                            );


                        } catch (error) {

                            console.error(
                                "Password update error:",
                                error
                            );


                            let errorMessage =
                                "Unable to update your password. Please request a new reset link and try again.";


                            if (
                                error &&
                                error.message
                            ) {

                                errorMessage =
                                    error.message;

                            }


                            showMessage(
                                errorMessage,
                                "error"
                            );


                            button.disabled =
                                false;

                            button.textContent =
                                "Update Password";

                        }

                    }
                );

            }
        );

    </script>

</body>

    </html>
