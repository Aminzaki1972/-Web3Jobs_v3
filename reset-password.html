<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Reset Password - Web3Jobs</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                180deg,
                #06101d,
                #09182a
            );

        color: #ffffff;
    }

    .container {
        width: 100%;
        max-width: 440px;
    }

    .brand {
        text-align: center;
        margin-bottom: 22px;
    }

    .brand h1 {
        margin: 0;
        font-size: 30px;
    }

    .brand span {
        color: #6ee7b7;
    }

    .card {
        background: #0d1b2e;
        border: 1px solid #1d3553;
        border-radius: 18px;
        padding: 30px;

        box-shadow:
            0 25px 70px
            rgba(0,0,0,.4);
    }

    h2 {
        margin: 0 0 8px;
        text-align: center;
    }

    .description {
        margin: 0 0 25px;
        text-align: center;
        color: #9db0c8;
        font-size: 13px;
        line-height: 1.6;
    }

    #message {
        display: none;
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.6;
    }

    .success {
        display: block !important;
        background: rgba(110,231,183,.08);
        border: 1px solid rgba(110,231,183,.35);
        color: #6ee7b7;
    }

    .error {
        display: block !important;
        background: rgba(251,113,133,.08);
        border: 1px solid rgba(251,113,133,.35);
        color: #fda4af;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
    }

    .password-box {
        margin-bottom: 17px;
    }

    input {
        width: 100%;
        padding: 13px;

        border-radius: 9px;

        border:
            1px solid
            #284563;

        outline: none;

        background:
            #071423;

        color:
            #ffffff;

        font-size: 14px;
    }

    input:focus {
        border-color: #60a5fa;
    }

    .password-box small {
        display: block;
        margin-top: 6px;
        color: #71869e;
        font-size: 11px;
    }

    button {
        width: 100%;

        border: 0;

        border-radius: 9px;

        padding: 13px;

        background:
            #6ee7b7;

        color:
            #06101d;

        font-weight:
            800;

        cursor:
            pointer;
    }

    button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .back {
        display: block;

        text-align: center;

        margin-top: 20px;

        color: #8dbdf3;

        font-size: 12px;

        text-decoration: none;
    }

</style>

</head><body><div class="container"><div class="brand">

    <h1>
        Web3<span>Jobs</span>
    </h1>

</div>


<div class="card">

    <h2>
        Create New Password
    </h2>

    <p class="description">
        Enter your new password below.
    </p>


    <div id="message"></div>


    <form id="resetForm">

        <div class="password-box">

            <label for="password">
                New Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                placeholder="Enter new password"
                required
                minlength="6"
            >

            <small>
                Minimum 6 characters.
            </small>

        </div>


        <div class="password-box">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Confirm new password"
                required
                minlength="6"
            >

        </div>


        <button
            id="updateButton"
            type="submit"
        >
            Update Password
        </button>

    </form>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>

</div><script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script><script src="js/supabase.js"></script><script>

"use strict";


document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const form =
            document.getElementById(
                "resetForm"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const confirmInput =
            document.getElementById(
                "confirmPassword"
            );

        const button =
            document.getElementById(
                "updateButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;
        }


        const client =
            window.Web3JobsSupabase?.getClient();


        if (!client) {

            showMessage(
                "Supabase connection is not available.",
                "error"
            );

            return;
        }


        /*
         * Supabase sends the recovery session
         * through the URL.
         *
         * We wait for PASSWORD_RECOVERY.
         */

        let recoveryReady =
            false;


        const {
            data: {
                subscription
            }
        } =
            client.auth.onAuthStateChange(
                async function (
                    event,
                    session
                ) {

                    console.log(
                        "Web3Jobs Auth Event:",
                        event
                    );


                    if (
                        event ===
                        "PASSWORD_RECOVERY"
                    ) {

                        recoveryReady =
                            true;

                        console.log(
                            "Web3Jobs: Password recovery session ready."
                        );

                        showMessage(
                            "يمكنك الآن إنشاء كلمة مرور جديدة.",
                            "success"
                        );
                    }


                    if (
                        event ===
                        "SIGNED_IN" &&
                        session
                    ) {

                        console.log(
                            "Web3Jobs: Recovery session signed in."
                        );
                    }

                }
            );


        /*
         * Also check current session.
         */

        try {

            const {
                data,
                error
            } =
                await client.auth.getSession();


            if (error) {

                console.error(
                    "Recovery session error:",
                    error
                );

            } else if (
                data?.session
            ) {

                recoveryReady =
                    true;

                console.log(
                    "Web3Jobs: Recovery session detected."
                );
            }

        } catch (error) {

            console.error(
                "Recovery session exception:",
                error
            );
        }


        /*
         * SUBMIT NEW PASSWORD
         */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmInput.value;


                if (
                    password.length < 6
                ) {

                    showMessage(
                        "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.",
                        "error"
                    );

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "كلمتا المرور غير متطابقتين.",
                        "error"
                    );

                    return;
                }


                button.disabled =
                    true;

                button.textContent =
                    "Updating...";


                try {

                    /*
                     * Verify that a recovery
                     * session exists.
                     */

                    const {
                        data:
                            sessionData,
                        error:
                            sessionError
                    } =
                        await client.auth.getSession();


                    if (
                        sessionError ||
                        !sessionData?.session
                    ) {

                        showMessage(
                            "رابط إعادة تعيين كلمة المرور غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.",
                            "error"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Update Password";

                        return;
                    }


                    /*
                     * UPDATE PASSWORD
                     */

                    const {
                        data,
                        error
                    } =
                        await client.auth.updateUser(
                            {
                                password:
                                    password
                            }
                        );


                    if (error) {

                        console.error(
                            "Update password error:",
                            error
                        );

                        showMessage(
                            error.message ||
                            "Unable to update password.",
                            "error"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Update Password";

                        return;
                    }


                    console.log(
                        "Web3Jobs: Password updated successfully.",
                        data
                    );


                    showMessage(
                        "تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى تسجيل الدخول.",
                        "success"
                    );


                    passwordInput.value =
                        "";

                    confirmInput.value =
                        "";


                    /*
                     * Give Supabase time to save
                     * the new password.
                     */

                    setTimeout(
                        async function () {

                            await client.auth.signOut();

                            window.location.replace(
                                "login.html"
                            );

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "Password update exception:",
                        error
                    );

                    showMessage(
                        "حدث خطأ أثناء تحديث كلمة المرور.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Update Password";
                }

            }
        );

    }
);

</script></body></html>
