<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Web3Jobs Admin - User Management"
    >

    <meta
        name="theme-color"
        content="#06101d"
    >

    <title>Web3Jobs - User Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --bg: #06101d;
            --panel: #0b1a2b;
            --panel2: #0e2135;
            --border: #1d3852;
            --text: #f5f9ff;
            --muted: #8fa5bb;
            --green: #4ade80;
            --blue: #60a5fa;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(38, 102, 160, .18),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            width: min(1400px, 100%);
            margin: auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--panel);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #1c765a,
                #175a47
            );
            font-weight: 900;
        }

        h1 {
            margin: 0;
            font-size: 20px;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button {
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel2);
            color: white;
            cursor: pointer;
            font-weight: 800;
            font-size: 11px;
        }

        .button:hover {
            background: #12283e;
        }

        .button.green {
            border-color: rgba(74, 222, 128, .3);
        }

        .button.red {
            border-color: rgba(248, 113, 113, .3);
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
        }

        .stat-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 27px;
            font-weight: 900;
        }

        .card {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--panel);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 17px;
        }

        .search {
            width: min(320px, 100%);
            min-height: 40px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: #081625;
            color: white;
        }

        .search:focus {
            border-color: #356184;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 13px 10px;
            border-bottom: 1px solid rgba(255,255,255,.06);
            text-align: left;
            font-size: 11px;
        }

        th {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        td {
            color: #e8f0f8;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 900;
        }

        .badge.individual {
            color: var(--blue);
            background: rgba(96,165,250,.08);
        }

        .badge.company {
            color: var(--green);
            background: rgba(74,222,128,.08);
        }

        .badge.admin {
            color: #facc15;
            background: rgba(250,204,21,.08);
        }

        .empty {
            padding: 35px;
            text-align: center;
            color: var(--muted);
        }

        .loading {
            padding: 35px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 13px;
            border: 1px solid rgba(248,113,113,.25);
            border-radius: 10px;
            background: rgba(248,113,113,.06);
            color: #fecaca;
            font-size: 11px;
        }

        #admin-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }

        .loading-box {
            text-align: center;
        }

        .loading-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .loading-box span {
            color: var(--muted);
            font-size: 11px;
        }

        #content {
            display: none;
        }

        @media (max-width: 700px) {

            .page {
                padding: 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <div id="admin-loading">

        <div class="loading-box">

            <strong>
                Web3Jobs Admin
            </strong>

            <span>
                Checking administrator access...
            </span>

        </div>

    </div>


    <main id="content">

        <div class="page">

            <header class="header">

                <div class="brand">

                    <div class="logo">
                        W3
                    </div>

                    <div>

                        <h1>
                            User Management
                        </h1>

                        <div class="subtitle">
                            Web3Jobs Platform Administration
                        </div>

                    </div>

                </div>


                <div class="header-actions">

                    <button
                        class="button"
                        id="back-dashboard"
                        type="button"
                    >
                        Admin Dashboard
                    </button>

                    <button
                        class="button red"
                        id="logout"
                        type="button"
                    >
                        Logout
                    </button>

                </div>

            </header>


            <div
                id="error"
                class="error"
            ></div>


            <section class="stats">

                <div class="stat">

                    <div class="stat-label">
                        Total Users
                    </div>

                    <div
                        class="stat-value"
                        id="total-users"
                    >
                        —
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Individual Accounts
                    </div>

                    <div
                        class="stat-value"
                        id="individual-users"
                    >
                        —
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Company Accounts
                    </div>

                    <div
                        class="stat-value"
                        id="company-users"
                    >
                        —
                    </div>

                </div>

            </section>


            <section class="card">

                <div class="toolbar">

                    <h2>
                        Platform Users
                    </h2>

                    <input
                        id="search"
                        class="search"
                        type="search"
                        placeholder="Search by email..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="table-container"
                    class="table-wrap"
                >

                    <div class="loading">
                        Loading users...
                    </div>

                </div>

            </section>

        </div>

    </main>


    <script src="js/supabase.js"></script>

    <script src="js/admin-users.js"></script>

</body>

  </html>
