<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password - Web3Jobs</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                180deg,
                #06101d,
                #09182a
            );

        color: #ffffff;
    }

    .container {
        width: 100%;
        max-width: 440px;
    }

    .brand {
        text-align: center;
        margin-bottom: 22px;
    }

    .brand h1 {
        margin: 0;
        font-size: 30px;
    }

    .brand span {
        color: #6ee7b7;
    }

    .card {
        background: #0d1b2e;
        border: 1px solid #1d3553;
        border-radius: 18px;
        padding: 30px;
        box-shadow:
            0 25px 70px
            rgba(0,0,0,.4);
    }

    h2 {
        margin: 0 0 8px;
        text-align: center;
    }

    .description {
        margin: 0 0 25px;
        text-align: center;
        color: #9db0c8;
        font-size: 13px;
        line-height: 1.6;
    }

    #message {
        display: none;
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.6;
    }

    .success {
        display: block !important;
        background: rgba(110,231,183,.08);
        border: 1px solid rgba(110,231,183,.35);
        color: #6ee7b7;
    }

    .error {
        display: block !important;
        background: rgba(251,113,133,.08);
        border: 1px solid rgba(251,113,133,.35);
        color: #fda4af;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
    }

    input {
        width: 100%;
        padding: 13px;
        border-radius: 9px;
        border: 1px solid #284563;
        outline: none;
        background: #071423;
        color: #ffffff;
        font-size: 14px;
        margin-bottom: 17px;
    }

    input:focus {
        border-color: #60a5fa;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 13px;
        background: #6ee7b7;
        color: #06101d;
        font-weight: 800;
        cursor: pointer;
    }

    button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #8dbdf3;
        font-size: 12px;
        text-decoration: none;
    }

</style>

</head><body><div class="container"><div class="brand">
    <h1>
        Web3<span>Jobs</span>
    </h1>
</div>

<div class="card">

    <h2>
        Forgot Password
    </h2>

    <p class="description">
        Enter your email address and we will send you
        a link to create a new password.
    </p>

    <div id="message"></div>

    <form id="forgotForm">

        <label for="email">
            Email Address
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
        >

        <button
            id="resetButton"
            type="submit"
        >
            Send Reset Link
        </button>

    </form>

    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>

</div><script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script><script src="js/supabase.js"></script><script>

"use strict";

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById("forgotForm");

        const emailInput =
            document.getElementById("email");

        const button =
            document.getElementById("resetButton");

        const message =
            document.getElementById("message");


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className = type;

        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;
                }


                const client =
                    window.Web3JobsSupabase?.getClient();


                if (!client) {

                    showMessage(
                        "Supabase connection is not available.",
                        "error"
                    );

                    return;
                }


                button.disabled = true;

                button.textContent =
                    "Sending...";


                try {

                    /*
                     * IMPORTANT:
                     * Return the user to reset-password.html
                     */

                    const resetUrl =
                        window.location.origin +
                        window.location.pathname
                            .replace(
                                "forgot-password.html",
                                "reset-password.html"
                            );


                    console.log(
                        "Web3Jobs reset URL:",
                        resetUrl
                    );


                    const {
                        error
                    } =
                        await client.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    resetUrl
                            }
                        );


                    if (error) {

                        console.error(
                            "Password reset error:",
                            error
                        );

                        showMessage(
                            error.message ||
                            "Unable to send password reset email.",
                            "error"
                        );

                        button.disabled = false;

                        button.textContent =
                            "Send Reset Link";

                        return;
                    }


                    showMessage(
                        "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
                        "success"
                    );


                    button.textContent =
                        "Reset Link Sent";


                } catch (error) {

                    console.error(
                        "Password reset exception:",
                        error
                    );

                    showMessage(
                        "حدث خطأ أثناء إرسال رسالة إعادة التعيين.",
                        "error"
                    );

                    button.disabled = false;

                    button.textContent =
                        "Send Reset Link";
                }

            }
        );

    }
);

</script></body></html>
