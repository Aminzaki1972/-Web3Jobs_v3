<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - Web3Jobs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(96, 165, 250, .14),
                    transparent 45%
                ),
                linear-gradient(
                    180deg,
                    #06101d,
                    #09182a
                );

            color: #f5f8ff;
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-name {
            font-size: 27px;
            font-weight: 850;
        }

        .brand-name span {
            color: #6ee7b7;
        }

        .card {
            background: #0d1b2e;
            border: 1px solid #1d3553;
            border-radius: 20px;
            padding: 32px;
            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, .38);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin: 0 0 25px;
            text-align: center;
            color: #9db0c8;
            font-size: 13px;
            line-height: 1.7;
        }

        #auth-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 12px;
            line-height: 1.7;
        }

        .message-error {
            border: 1px solid rgba(251,113,133,.35);
            background: rgba(251,113,133,.08);
            color: #fda4af;
        }

        .message-success {
            border: 1px solid rgba(110,231,183,.35);
            background: rgba(110,231,183,.08);
            color: #6ee7b7;
        }

        .message-info {
            border: 1px solid rgba(96,165,250,.35);
            background: rgba(96,165,250,.08);
            color: #93c5fd;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dbe7f4;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border:
                1px solid #284563;

            border-radius: 10px;
            outline: none;

            background: #071423;
            color: white;

            font-size: 14px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        input::placeholder {
            color: #60758d;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;

            border: 0;
            border-radius: 10px;

            background: #6ee7b7;
            color: #06101d;

            font-size: 14px;
            font-weight: 850;

            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #8dbdf3;
            font-size: 12px;
        }

        .back:hover {
            color: #6ee7b7;
        }

        @media (max-width: 500px) {

            .card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="wrapper">


    <div class="brand">

        <div class="brand-name">
            Web3<span>Jobs</span>
        </div>

    </div>


    <div class="card">

        <h1>
            Forgot Password?
        </h1>

        <p class="subtitle">
            Enter your email address and we will send you
            a password reset link.
        </p>


        <div
            id="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <form
            id="forgotPasswordForm"
            novalidate
        >

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >


            <button
                id="resetButton"
                type="submit"
            >
                Send Reset Email
            </button>

        </form>


        <a
            href="login.html"
            class="back"
        >
            ← Back to Login
        </a>

    </div>


</div>


<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4.4"
></script>


<script src="js/supabase.js"></script>


<script>

"use strict";


document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "forgotPasswordForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const message =
            document.getElementById(
                "auth-message"
            );


        /*
         * GitHub Pages reset URL
         */

        const resetRedirectUrl =
            window.location.origin +
            window.location.pathname
                .replace(
                    "forgot-password.html",
                    "update-password.html"
                );


        function showMessage(
            ar,
            en,
            type
        ) {

            message.className =
                "message-" + type;

            message.innerHTML =
                `
                    <div>${ar}</div>
                    <div>${en}</div>
                `;

            message.style.display =
                "block";
        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    showMessage(
                        "يرجى إدخال البريد الإلكتروني.",
                        "Please enter your email address.",
                        "error"
                    );

                    emailInput.focus();

                    return;
                }


                resetButton.disabled =
                    true;

                resetButton.textContent =
                    "Sending...";


                try {

                    const client =
                        window.Web3JobsSupabase
                            ?.getClient();


                    if (!client) {

                        throw new Error(
                            "Supabase client is not available."
                        );
                    }


                    console.log(
                        "Web3Jobs password reset:",
                        email
                    );


                    console.log(
                        "Reset redirect URL:",
                        resetRedirectUrl
                    );


                    const {
                        error
                    } =
                        await client.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        resetRedirectUrl
                                }
                            );


                    if (error) {

                        console.error(
                            "Password reset error:",
                            error
                        );

                        throw error;
                    }


                    showMessage(
                        "تم إرسال رسالة إعادة تعيين كلمة المرور إلى بريدك الإلكتروني. تحقق أيضًا من مجلد الرسائل غير المرغوب فيها.",
                        "A password reset email has been sent. Please also check your spam or junk folder.",
                        "success"
                    );


                    resetButton.textContent =
                        "Email Sent";


                } catch (error) {

                    console.error(
                        "Web3Jobs password reset exception:",
                        error
                    );


                    showMessage(
                        "تعذر إرسال رسالة إعادة تعيين كلمة المرور. تحقق من البريد وحاول مرة أخرى.",
                        "Unable to send the password reset email. Please check the email address and try again.",
                        "error"
                    );


                    resetButton.disabled =
                        false;

                    resetButton.textContent =
                        "Send Reset Email";

                }

            }
        );

    }
);

</script>


</body>

</html>
